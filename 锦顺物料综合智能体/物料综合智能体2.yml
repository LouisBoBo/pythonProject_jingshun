    - data:
        code: "\"\"\"\nDify Code 节点：领料 / 查单 / 混合类请求 → 进入 **领料子流程**（先 DATA Fast 读，再\
          \ Agent 写）。\n\n**不是**「直进 Agent」。`use_agent` 为历史字段名，与 `use_requisition_flow`\
          \ 同值。\n\n放在「登录路由」之后、「意图分类器」之前。\n纯查物料/库存（无领料意图）应输出 false，交给分类器 → DATA Fast。\n\
          \n输入：\n  - query: string  sys.query\n\n输出（If-Else equals）：\n  - use_requisition_flow:\
          \ \"true\" | \"false\"  （推荐 If 绑此字段）\n  - use_agent: 同上（兼容旧画布）\n  - reason:\
          \ string\n\"\"\"\n\nimport re\n\n_GON = re.compile(r\"GON\\d+\", re.I)\n\
          _DRAFT = re.compile(r\"DRAFT-\\d\", re.I)\n\n_REQUISITION_KEYWORDS = (\n\
          \    \"领料\",\n    \"我要领\",\n    \"要领料\",\n    \"要料\",\n    \"帮我领\",\n  \
          \  \"申请领\",\n    \"出库申请\",\n    \"确认提交\",\n    \"提交审批\",\n    \"审批到哪\",\n\
          \    \"我的领料\",\n    \"我的申请\",\n    \"领用\",\n    \"要申请\",\n)\n\n_STATUS_KEYWORDS\
          \ = (\n    \"领料单\",\n    \"出仓单\",\n    \"审批状态\",\n    \"到哪了\",\n    \"单号状态\"\
          ,\n)\n\n_FLOW_KEYWORDS = (\n    \"确认提交\",\n    \"修改数量\",\n    \"修改数量为\"\
          ,\n)\n\n_UNITS = (\"KG\", \"kg\", \"Kg\", \"箱\", \"张\", \"吨\", \"个\", \"\
          卷\", \"桶\", \"包\")\n\n_MIXED_HINTS = (\"够的话\", \"够就\", \"先查\", \"再领\", \"\
          再帮我领\", \"帮我申请\")\n\n# 用户选型后续回复：仅料号或「领 JS-NZ-006」\n_MATERIAL_CODE = re.compile(r\"\
          \\b([A-Z]{2,}-[A-Z0-9-]+)\\b\", re.I)\n\n\ndef _out(use: bool, reason: str)\
          \ -> dict:\n    v = \"true\" if use else \"false\"\n    return {\"use_requisition_flow\"\
          : v, \"use_agent\": v, \"reason\": reason}\n\n\ndef _is_requisition(text:\
          \ str) -> tuple[bool, str]:\n    if any(k in text for k in _REQUISITION_KEYWORDS):\n\
          \        return True, \"requisition_keyword\"\n\n    if any(k in text for\
          \ k in _FLOW_KEYWORDS):\n        return True, \"requisition_flow\"\n\n \
          \   if \"领\" in text and any(h in text for h in _MIXED_HINTS):\n       \
          \ return True, \"mixed_hint\"\n\n    if \"领\" in text and any(u in text\
          \ for u in _UNITS):\n        return True, \"requisition_with_unit\"\n\n\
          \    return False, \"\"\n\n\ndef main(query: str) -> dict:\n    t = (query\
          \ or \"\").strip()\n    if not t:\n        return _out(False, \"empty\"\
          )\n\n    if _GON.search(t):\n        return _out(True, \"gon_number\")\n\
          \n    if _DRAFT.search(t):\n        return _out(True, \"draft_number\")\n\
          \n    if any(k in t for k in _STATUS_KEYWORDS):\n        return _out(True,\
          \ \"requisition_status_keyword\")\n\n    if \"状态\" in t and re.search(r\"\
          查询\\s*[A-Z]{2,}\\d+\", t, re.I):\n        return _out(True, \"query_status_with_biz_no\"\
          )\n\n    ok, why = _is_requisition(t)\n    if ok:\n        return _out(True,\
          \ why)\n\n    if t in (\"取消\", \"算了\"):\n        return _out(True, \"requisition_cancel\"\
          )\n\n    # 选型后用户只发料号 / 「领 JS-NZ-006」→ 仍进领料子流程\n    if _MATERIAL_CODE.search(t):\n\
          \        if len(t) <= 48 and not any(k in t for k in (\"统计\", \"查询\", \"\
          多少\", \"消耗\", \"明细\")):\n            return _out(True, \"material_code_pick\"\
          )\n\n    return _out(False, \"use_classifier\")\n"
        code_language: python3
