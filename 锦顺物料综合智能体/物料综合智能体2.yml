    - data:
        code: "\"\"\"\nFast / 网关 · 解析 chat-messages 响应并拆分 / 组装展示内容\n\n展示顺序（detail）：表格\
          \ → 要点速览 → ECharts\n\"\"\"\nimport json\nimport re\n\nSUMMARY_MARKERS =\
          \ (\"\U0001F4CA 要点速览\", \"▸ 简要分析\", \"\U0001F4A1 建议\")\nECHARTS_RE = re.compile(r\"\
          ```echarts\\s*\\n([\\s\\S]*?)```\", re.IGNORECASE)\nTABLE_RE = re.compile(r\"\
          (\\|[^\\n]+\\|\\s*\\n(?:\\|[^\\n]+\\|\\s*\\n?)+)\")\n\n\ndef normalize_answer(text:\
          \ str) -> str:\n    t = (text or \"\").strip()\n    t = re.sub(r\"```\\\
          s*\\|\", \"```\\n\\n|\", t)\n    return t\n\n\ndef extract_parts(answer:\
          \ str) -> tuple[str, str, str]:\n    \"\"\"拆出 table / summary（含表前表后分析 +\
          \ 要点速览）/ echarts。\"\"\"\n    text = normalize_answer(answer)\n    if not\
          \ text:\n        return \"\", \"\", \"\"\n\n    echarts = \"\"\n    m =\
          \ ECHARTS_RE.search(text)\n    if m:\n        echarts = f\"```echarts\\\
          n{m.group(1).strip()}\\n```\"\n    rest = ECHARTS_RE.sub(\"\", text).strip()\n\
          \n    marker_summary = \"\"\n    cut = len(rest)\n    for marker in SUMMARY_MARKERS:\n\
          \        idx = rest.find(marker)\n        if idx != -1:\n            cut\
          \ = min(cut, idx)\n            marker_summary = rest[idx:].strip()\n\n \
          \   body = rest[:cut].strip() if cut < len(rest) else rest\n\n    table\
          \ = \"\"\n    prose = \"\"\n    tm = TABLE_RE.search(body)\n    if tm:\n\
          \        table = tm.group(1).strip()\n        before = body[: tm.start()].strip()\n\
          \        after = body[tm.end() :].strip()\n        prose = \"\\n\\n\".join(p\
          \ for p in (before, after) if p)\n    elif body:\n        # 无 markdown 管道表时，正文留给\
          \ summary（如纯文字结论）\n        prose = body\n\n    summary = \"\\n\\n\".join(p\
          \ for p in (prose, marker_summary) if p)\n\n    return table, summary, echarts\n\
          \n\ndef assemble_display(table: str, summary: str, echarts: str) -> str:\n\
          \    \"\"\"列表 → 要点速览 → ECHARTS\"\"\"\n    parts = [p for p in (table, summary,\
          \ echarts) if p]\n    if parts:\n        return \"\\n\\n\".join(parts)\n\
          \    return \"\"\n\n\ndef split_answer(answer: str) -> tuple[str, str]:\n\
          \    \"\"\"summary=要点速览；detail=按展示顺序组装后的全文。\"\"\"\n    table, summary, echarts\
          \ = extract_parts(answer)\n    display = assemble_display(table, summary,\
          \ echarts)\n    if display:\n        return summary or \"查询完成，明细如下。\", display\n\
          \    text = normalize_answer(answer)\n    if len(text) <= 300:\n       \
          \ return text, text\n    return text[:300] + \"…\", text\n\n\ndef parse_sse(raw:\
          \ str) -> tuple[str, str]:\n    text = raw or \"\"\n    chunks = []\n  \
          \  final_answer = \"\"\n    conversation_id = \"\"\n\n    stripped = text.strip()\n\
          \    if stripped.startswith(\"{\"):\n        try:\n            obj = json.loads(stripped)\n\
          \            data = obj.get(\"data\") or obj\n            outputs = data.get(\"\
          outputs\") or obj.get(\"outputs\") or {}\n            final_answer = (\n\
          \                outputs.get(\"answer\")\n                or data.get(\"\
          answer\")\n                or obj.get(\"answer\")\n                or \"\
          \"\n            )\n            conversation_id = (\n                outputs.get(\"\
          conversation_id\")\n                or data.get(\"conversation_id\")\n \
          \               or obj.get(\"conversation_id\")\n                or \"\"\
          \n            )\n            if final_answer:\n                return normalize_answer(final_answer),\
          \ conversation_id\n        except json.JSONDecodeError:\n            pass\n\
          \n    for line in text.splitlines():\n        line = line.strip()\n    \
          \    if not line.startswith(\"data:\"):\n            continue\n        payload\
          \ = line[5:].strip()\n        if not payload or payload == \"[DONE]\":\n\
          \            continue\n        try:\n            obj = json.loads(payload)\n\
          \        except json.JSONDecodeError:\n            continue\n\n        cid\
          \ = obj.get(\"conversation_id\")\n        if cid:\n            conversation_id\
          \ = cid\n        # workflow_finished 嵌套\n        data_top = obj.get(\"data\"\
          ) or {}\n        if isinstance(data_top, dict):\n            cid2 = data_top.get(\"\
          conversation_id\")\n            if cid2:\n                conversation_id\
          \ = cid2\n\n        event = obj.get(\"event\")\n        if event == \"message\"\
          :\n            part = obj.get(\"answer\") or \"\"\n            if part:\n\
          \                chunks.append(part)\n        elif event == \"workflow_finished\"\
          :\n            data = obj.get(\"data\") or {}\n            outputs = data.get(\"\
          outputs\") or {}\n            final_answer = outputs.get(\"answer\") or\
          \ final_answer\n            cid = obj.get(\"conversation_id\") or conversation_id\n\
          \            if cid:\n                conversation_id = cid\n\n    answer\
          \ = normalize_answer((final_answer or \"\".join(chunks)).strip())\n    if\
          \ not answer:\n        answer = \"数据分析未返回结果，请稍后重试或联系管理员。\"\n    return answer,\
          \ conversation_id or \"\"\n\n\ndef main(raw: str) -> dict:\n    answer,\
          \ conversation_id = parse_sse(raw)\n    table, summary, echarts = extract_parts(answer)\n\
          \    display = assemble_display(table, summary, echarts)\n    if not display:\n\
          \        display = answer\n\n    return {\n        \"answer\": answer,\n\
          \        \"summary\": summary,\n        \"detail\": display,\n        \"\
          table\": table,\n        \"echarts\": echarts,\n        \"conversation_id\"\
          : conversation_id,\n    }\n"
        code_language: python3
