                '
              tool_label: erp_save_draft
              tool_name: erp_save_draft
              type: api
            - enabled: true
              extra:
                description: '仅当用户明确说「确认提交」后调用。

                  必须先有 erp_save_draft 返回的 draft_id。

                  每次提交尝试使用新的 idempotency_key（UUID）；用户重复说「确认提交」且同一 draft 时可复用同一 key
