    - data:
        code: "\"\"\"\n领料 Agent 前 · 判断本轮是否需 Fast HTTP 查库存。\n\n输入：\n  query       \
          \       ← sys.query\n  reason             ← 领料路由 Code 的 reason（可选）\n  pick_waiting\
          \       ← conversation.requisition_pick_waiting（可选）\n  pick_cache_json \
          \   ← conversation.requisition_pick_cache_json（可选）\n\n输出（If-Else equals）：\n\
          \  need_fast_inventory: \"true\" | \"false\"\n  use_pick_cache: \"true\"\
          \ | \"false\"   # false 时直进 Agent（确认提交等）\n  skip_reason: string\n\"\"\"\n\
          \nimport json\nimport re\n\n_SKIP_REASONS = frozenset(\n    {\n        \"\
          gon_number\",\n        \"requisition_status_keyword\",\n        \"query_status_with_biz_no\"\
          ,\n        \"draft_number\",\n    }\n)\n\n_FLOW_SKIP = (\n    \"确认提交\",\n\
          \    \"提交审批\",\n    \"取消\",\n    \"算了\",\n)\n\n\ndef _is_modify_qty(text:\
          \ str) -> bool:\n    return \"修改数量\" in text or bool(re.search(r\"改(?:成|为)\\\
          s*[\\d.]+\\s*(?:KG|kg|箱|张|吨|个|卷|桶|包)?\", text))\n\n\n_CODE_IN_QUERY = re.compile(r\"\
          \\b([A-Z]{2,}-[A-Z0-9-]+)\\b\", re.I)\n\n\ndef _code_in_pick_cache(code:\
          \ str, pick_cache_json: str) -> bool:\n    if not code or not (pick_cache_json\
          \ or \"\").strip():\n        return False\n    try:\n        rows = json.loads(pick_cache_json)\n\
          \    except json.JSONDecodeError:\n        return False\n    if not isinstance(rows,\
          \ list):\n        return False\n    upper = code.upper()\n    return any(str(r.get(\"\
          code\", \"\")).strip().upper() == upper for r in rows if isinstance(r, dict))\n\
          \n\ndef _out(need_fast: bool, use_cache: bool, reason: str) -> dict:\n \
          \   return {\n        \"need_fast_inventory\": \"true\" if need_fast else\
          \ \"false\",\n        \"use_pick_cache\": \"true\" if use_cache else \"\
          false\",\n        \"skip_reason\": reason,\n    }\n\n\ndef main(\n    query:\
          \ str,\n    reason: str = \"\",\n    pick_waiting: str = \"\",\n    pick_cache_json:\
          \ str = \"\",\n) -> dict:\n    t = (query or \"\").strip()\n    r = (reason\
          \ or \"\").strip()\n\n    if not t:\n        return _out(False, False, \"\
          empty_query\")\n\n    if r in _SKIP_REASONS:\n        return _out(False,\
          \ False, r)\n\n    if t in _FLOW_SKIP or any(k in t for k in (\"确认提交\",\
          \ \"提交审批\")):\n        return _out(False, False, \"confirm_or_cancel\")\n\
          \n    if _is_modify_qty(t):\n        return _out(False, False, \"modify_qty_only\"\
          )\n\n    if re.search(r\"GON\\d+\", t, re.I):\n        return _out(False,\
          \ False, \"gon_in_query\")\n\n    # 选型后续：料号在上一轮 list 中 → 走缓存，不 HTTP\n  \
          \  if (pick_waiting or \"\").strip().lower() == \"true\":\n        m = _CODE_IN_QUERY.search(t)\n\
          \        if m and _code_in_pick_cache(m.group(1), pick_cache_json):\n  \
          \          return _out(False, True, \"pick_cache_hit\")\n\n    return _out(True,\
          \ False, \"\")\n"
        code_language: python3
        outputs:
          need_fast_inventory:
            children: null
            type: string
          skip_reason:
            children: null
            type: string
          use_pick_cache:
            children: null
            type: string
