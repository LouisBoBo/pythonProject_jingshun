    - data:
        code: "\"\"\"\n领料 Fast · 解析 DATA Fast 表格：唯一物料 vs 需用户选型。\n\npick_required=true\
          \ 时 **不产出**有效 material_code；画布走选型 Answer，**不进 Agent**。\nextract_ok=true\
          \ 时料号唯一；画布 Assigner → Agent。\n\n输入：detail, user_query\n输出：material_code,\
          \ material_name, available_qty, unit, extract_ok,\n      pick_required,\
          \ pick_list, match_count\n\"\"\"\n\nfrom __future__ import annotations\n\
          \nimport json\nimport re\nfrom typing import NamedTuple\n\n_CODE_IN_QUERY\
          \ = re.compile(r\"\\b([A-Z]{2,}-[A-Z0-9-]+)\\b\", re.I)\n_QTY_IN_QUERY =\
          \ re.compile(\n    r\"([\\d,]+(?:\\.\\d+)?)\\s*(KG|kg|Kg|箱|张|吨|个|卷|桶|包)\"\
          ,\n    re.I,\n)\n_TABLE_ROW = re.compile(\n    r\"^\\|\\s*([A-Z0-9-]+)\\\
          s*\\|\\s*([^|]+?)\\s*\\|\\s*([\\d,]+(?:\\.\\d+)?)\\s*\\|\\s*([^|]+?)\\s*\\\
          |\",\n    re.I | re.M,\n)\n\n\nclass MaterialRow(NamedTuple):\n    code:\
          \ str\n    name: str\n    qty: float\n    unit: str\n\n\ndef _norm_qty(s:\
          \ str) -> float:\n    return float(str(s or \"\").replace(\",\", \"\").strip()\
          \ or 0)\n\n\ndef _parse_requested(user_query: str, fallback_query: str =\
          \ \"\") -> tuple[float, str]:\n    for src in (user_query, fallback_query):\n\
          \        m = _QTY_IN_QUERY.search(src or \"\")\n        if m:\n        \
          \    unit = (m.group(2) or \"KG\").strip()\n            return _norm_qty(m.group(1)),\
          \ unit.upper() if unit.upper() == \"KG\" else unit\n    return 0.0, \"KG\"\
          \n\n\ndef _parse_code_in_query(user_query: str) -> str:\n    m = _CODE_IN_QUERY.search(user_query\
          \ or \"\")\n    return m.group(1).upper() if m else \"\"\n\n\ndef _parse_table(text:\
          \ str) -> list[MaterialRow]:\n    rows: list[MaterialRow] = []\n    for\
          \ m in _TABLE_ROW.finditer(text):\n        code = m.group(1).strip().upper()\n\
          \        if code.upper() in (\"MATERIAL_CODE\", \"料号\", \"---\"):\n    \
          \        continue\n        if set(code) <= {\"-\", \" \"}:\n           \
          \ continue\n        name = m.group(2).strip()\n        qty = _norm_qty(m.group(3))\n\
          \        unit = m.group(4).strip()\n        rows.append(MaterialRow(code=code,\
          \ name=name, qty=qty, unit=unit))\n    return rows\n\n\ndef _pick_list_markdown(rows:\
          \ list[MaterialRow], limit: int = 10) -> str:\n    top = rows[:limit]\n\
          \    lines = [\n        \"### 请选择要领的料号\",\n        \"\",\n        \"| 料号\
          \ | 物料名称 | 可用库存 | 单位 |\",\n        \"|------|----------|----------|------|\"\
          ,\n    ]\n    for r in top:\n        lines.append(f\"| {r.code} | {r.name}\
          \ | {r.qty:g} | {r.unit} |\")\n    lines.extend(\n        [\n          \
          \  \"\",\n            \"请直接回复 **料号**（例如 `JS-NZ-006`），或说「领 JS-NZ-006 10KG」。\"\
          ,\n        ]\n    )\n    return \"\\n\".join(lines)\n\n\ndef _pick_cache_json(rows:\
          \ list[MaterialRow]) -> str:\n    payload = [\n        {\"code\": r.code,\
          \ \"name\": r.name, \"qty\": r.qty, \"unit\": r.unit}\n        for r in\
          \ rows\n    ]\n    return json.dumps(payload, ensure_ascii=False)\n\n\n\
          def _result(\n    *,\n    code: str = \"\",\n    name: str = \"\",\n   \
          \ qty: str = \"\",\n    unit: str = \"\",\n    ok: bool = False,\n    pick:\
          \ bool = False,\n    pick_list: str = \"\",\n    match_count: int = 0,\n\
          \    pick_cache_json: str = \"\",\n) -> dict:\n    return {\n        \"\
          material_code\": code,\n        \"material_name\": name,\n        \"available_qty\"\
          : qty,\n        \"unit\": unit,\n        \"extract_ok\": \"true\" if ok\
          \ else \"false\",\n        \"pick_required\": \"true\" if pick else \"false\"\
          ,\n        \"pick_list\": pick_list,\n        \"match_count\": str(match_count),\n\
          \        \"pick_cache_json\": pick_cache_json,\n    }\n\n\ndef main(detail:\
          \ str, user_query: str = \"\", pending_intent_query: str = \"\") -> dict:\n\
          \    text = (detail or \"\").strip()\n    if not text:\n        return _result()\n\
          \n    intent = (pending_intent_query or \"\").strip()\n    rows = _parse_table(text)\n\
          \    if not rows:\n        return _result(pick_list=\"未能解析物料表格，请补充更具体的物料名称或料号。\"\
          )\n\n    req_qty, req_unit = _parse_requested(user_query, intent)\n    explicit\
          \ = _parse_code_in_query(user_query)\n    if explicit:\n        for r in\
          \ rows:\n            if r.code == explicit:\n                return _result(\n\
          \                    code=r.code,\n                    name=r.name,\n  \
          \                  qty=str(r.qty).rstrip(\"0\").rstrip(\".\") if r.qty %\
          \ 1 else str(int(r.qty)),\n                    unit=r.unit or req_unit,\n\
          \                    ok=True,\n                    match_count=len(rows),\n\
          \                )\n\n    in_stock = [r for r in rows if r.qty > 0]\n  \
          \  if not in_stock:\n        return _result(\n            pick=True,\n \
          \           pick_list=\"匹配到的物料 **当前均无可用库存**，请更换物料或联系仓库。\",\n           \
          \ match_count=len(rows),\n        )\n\n    if len(in_stock) == 1:\n    \
          \    r = in_stock[0]\n        q = str(r.qty).rstrip(\"0\").rstrip(\".\"\
          ) if r.qty % 1 else str(int(r.qty))\n        return _result(\n         \
          \   code=r.code,\n            name=r.name,\n            qty=q,\n       \
          \     unit=r.unit or req_unit,\n            ok=True,\n            match_count=len(rows),\n\
          \        )\n\n    # 多条有库存：仅当「够领」的唯一一条时自动选中\n    if req_qty > 0:\n      \
          \  enough = [r for r in in_stock if r.qty >= req_qty]\n        if len(enough)\
          \ == 1:\n            r = enough[0]\n            q = str(r.qty).rstrip(\"\
          0\").rstrip(\".\") if r.qty % 1 else str(int(r.qty))\n            return\
          \ _result(\n                code=r.code,\n                name=r.name,\n\
          \                qty=q,\n                unit=r.unit or req_unit,\n    \
          \            ok=True,\n                match_count=len(rows),\n        \
          \    )\n\n    ranked = sorted(in_stock, key=lambda x: x.qty, reverse=True)\n\
          \    return _result(\n        pick=True,\n        pick_list=_pick_list_markdown(ranked),\n\
          \        match_count=len(rows),\n        pick_cache_json=_pick_cache_json(ranked),\n\
          \    )\n"
