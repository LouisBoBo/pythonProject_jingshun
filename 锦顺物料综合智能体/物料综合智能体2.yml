    - data:
        code: "\"\"\"\nDify Code 节点：登录路由（被动登录 · 单节点决策 + 可选直出凭据）。\n\n输入：\n  - query:\
          \ string\n  - auth_token: string\n  - login_pending: string\n\n输出（**全部为\
          \ string**，If-Else 用「等于」比较）：\n  - should_login: \"true\" | \"false\"\n \
          \ - login_action: \"authenticate\" | \"prompt\" | \"skip\"\n  - username:\
          \ string   authenticate 时可直绑 HTTP，空则再走 Extractor\n  - password: string\n\
          \  - reason: string\n\"\"\"\n\n\ndef _norm_flag(value: str) -> bool:\n \
          \   return str(value or \"\").strip().lower() in {\"true\", \"1\", \"yes\"\
          , \"是\"}\n\n\ndef _result(\n    should: bool,\n    action: str,\n    reason:\
          \ str,\n    username: str = \"\",\n    password: str = \"\",\n) -> dict:\n\
          \    return {\n        \"should_login\": \"true\" if should else \"false\"\
          ,\n        \"login_action\": action,\n        \"username\": username or\
          \ \"\",\n        \"password\": password or \"\",\n        \"reason\": reason,\n\
          \    }\n\n\ndef _looks_like_credential_pair(text: str) -> tuple[str, str]\
          \ | None:\n    \"\"\"「zhangsan 123456」类：两段 token，无业务动词。\"\"\"\n    import\
          \ re\n\n    parts = text.strip().split()\n    if len(parts) != 2:\n    \
          \    return None\n    biz_markers = (\n        \"领\", \"查\", \"帮\", \"申请\"\
          , \"统计\", \"多少\", \"物料\", \"油墨\", \"消耗\",\n        \"KG\", \"kg\", \"箱\"\
          , \"张\", \"吨\", \"个\", \"覆铜\", \"明细\",\n    )\n    if any(m in text for\
          \ m in biz_markers):\n        return None\n    user, pwd = parts[0], parts[1]\n\
          \    if re.match(r\"^[a-zA-Z0-9_\\-]+$\", user) and pwd:\n        return\
          \ user, pwd\n    return None\n\n\ndef _extract_credentials(text: str) ->\
          \ tuple[str, str] | None:\n    import re\n\n    t = text.strip()\n    if\
          \ not t:\n        return None\n\n    m = re.search(\n        r\"(?:工号|账号|用户名|账户)\\\
          s*[：:]?\\s*(\\S+)\\s*(?:密码|口令)\\s*[：:]?\\s*(\\S+)\",\n        t,\n     \
          \   re.I,\n    )\n    if m:\n        return m.group(1), m.group(2)\n\n \
          \   m = re.search(\n        r\"(?:密码|口令)\\s*[：:]?\\s*(\\S+)\\s*(?:工号|账号|用户名)\\\
          s*[：:]?\\s*(\\S+)\",\n        t,\n        re.I,\n    )\n    if m:\n    \
          \    return m.group(2), m.group(1)\n\n    if t.lower().startswith(\"login\
          \ \"):\n        parts = t.split()\n        if len(parts) >= 3:\n       \
          \     return parts[1], parts[2]\n\n    if t.startswith(\"登录\"):\n      \
          \  rest = t[2:].lstrip(\"：: \\t\")\n        parts = rest.split()\n     \
          \   if len(parts) >= 2:\n            return parts[0], parts[1]\n\n    return\
          \ _looks_like_credential_pair(t)\n\n\ndef _needs_erp_auth(text: str) ->\
          \ bool:\n    t = text.strip()\n    if not t:\n        return False\n\n \
          \   requisition_keywords = (\n        \"领料\", \"我要领\", \"要领料\", \"要料\",\
          \ \"帮我领\", \"申请领\",\n        \"出库申请\", \"确认提交\", \"提交审批\", \"审批到哪\", \"\
          我的领料\",\n        \"我的申请\", \"领用\", \"要申请\",\n    )\n    if any(k in t for\
          \ k in requisition_keywords):\n        return True\n\n    if \"领\" in t\
          \ and any(\n        x in t for x in (\"够的话\", \"够就\", \"先查\", \"再领\", \"\
          再帮我领\", \"帮我申请\")\n    ):\n        return True\n\n    if \"领\" in t and\
          \ any(u in t for u in (\"KG\", \"kg\", \"箱\", \"张\", \"吨\", \"个\")):\n \
          \       return True\n\n    return False\n\n\ndef _is_login_keyword_only(text:\
          \ str) -> bool:\n    t = text.strip()\n    if t in {\"登录\", \"登陆\"}:\n \
          \       return True\n    if t.startswith(\"登录\") and _extract_credentials(t)\
          \ is None:\n        rest = t[2:].lstrip(\"：: \\t\")\n        return not\
          \ rest\n    return False\n\n\ndef main(query: str, auth_token: str = \"\"\
          , login_pending: str = \"\") -> dict:\n    text = (query or \"\").strip()\n\
          \n    if (auth_token or \"\").strip():\n        return _result(False, \"\
          skip\", \"already_logged_in\")\n\n    creds = _extract_credentials(text)\n\
          \    if creds:\n        return _result(\n            True, \"authenticate\"\
          , \"explicit_credentials\", creds[0], creds[1]\n        )\n\n    if _is_login_keyword_only(text):\n\
          \        return _result(True, \"prompt\", \"login_keyword_only\")\n\n  \
          \  if _needs_erp_auth(text):\n        return _result(True, \"prompt\", \"\
          need_erp_auth\")\n\n    if _norm_flag(login_pending):\n        pair = _looks_like_credential_pair(text)\n\
          \        if pair:\n            return _result(\n                True, \"\
          authenticate\", \"pending_two_tokens\", pair[0], pair[1]\n            )\n\
          \n    return _result(False, \"skip\", \"normal_flow\")\n"
