          \  pending_intent_query ← conversation.requisition_intent_query\n\n输出：与\
          \ extract_requisition_material_from_detail 相同字段。\n\"\"\"\n\nfrom __future__\
          \ import annotations\n\nimport json\nimport re\n\n_CODE_IN_QUERY = re.compile(r\"\
          \\b([A-Z]{2,}-[A-Z0-9-]+)\\b\", re.I)\n\n\ndef _result(\n    *,\n    code:\
          \ str = \"\",\n    name: str = \"\",\n    qty: str = \"\",\n    unit: str\
          \ = \"\",\n    ok: bool = False,\n    pick_list: str = \"\",\n) -> dict:\n\
          \    return {\n        \"material_code\": code,\n        \"material_name\"\
          : name,\n        \"available_qty\": qty,\n        \"unit\": unit,\n    \
          \    \"extract_ok\": \"true\" if ok else \"false\",\n        \"pick_required\"\
          : \"false\",\n        \"pick_list\": pick_list,\n        \"match_count\"\
          : \"0\",\n    }\n\n\ndef _fmt_qty(n: float) -> str:\n    return str(n).rstrip(\"\
          0\").rstrip(\".\") if n % 1 else str(int(n))\n\n\ndef main(\n    user_query:\
          \ str,\n    pick_cache_json: str = \"\",\n    pending_intent_query: str\
          \ = \"\",\n) -> dict:\n    code = \"\"\n    m = _CODE_IN_QUERY.search(user_query\
          \ or \"\")\n    if m:\n        code = m.group(1).upper()\n\n    if not code:\n\
          \        return _result(pick_list=\"未能识别料号，请直接回复料号，如 JS-NZ-006。\")\n\n \
          \   raw = (pick_cache_json or \"\").strip()\n    if not raw:\n        return\
          \ _result(\n            pick_list=f\"选型缓存为空，无法匹配 {code}，将需重新查库存。\"\n   \
          \     )\n\n    try:\n        rows = json.loads(raw)\n    except json.JSONDecodeError:\n\
          \        return _result(pick_list=\"选型缓存格式异常，请重新发起领料。\")\n\n    if not isinstance(rows,\
          \ list):\n        return _result(pick_list=\"选型缓存无效，请重新发起领料。\")\n\n    for\
          \ row in rows:\n        if not isinstance(row, dict):\n            continue\n\
          \        row_code = str(row.get(\"code\", \"\")).strip().upper()\n     \
          \   if row_code != code:\n            continue\n        qty_val = float(row.get(\"\
          qty\", 0) or 0)\n        unit = str(row.get(\"unit\", \"KG\") or \"KG\"\
          ).strip()\n        name = str(row.get(\"name\", \"\") or row_code).strip()\n\
          \        return _result(\n            code=row_code,\n            name=name,\n\
          \            qty=_fmt_qty(qty_val),\n            unit=unit,\n          \
          \  ok=True,\n        )\n\n    intent = (pending_intent_query or \"\").strip()\n\
          \    hint = f\"（原申请：{intent}）\" if intent else \"\"\n    return _result(\n\
          \        pick_list=f\"料号 **{code}** 不在上一轮选型列表中{hint}，需重新查库存。\"\n    )\n\n"
