        code: "\n\"\"\"\nFast 路径 · HTTP 前组装 chat-messages 请求体\n\n节点：「组装Chat请求」Code（放在\
          \ HTTP 之前）\n输入：\n  query          ← sys.query / 用户输入\n  conversation_id\
          \ ← conversation.data_analysis_conversation_id\n输出：\n  body_json      ←\
          \ 给 HTTP Body（整段 JSON 字符串）\n  has_conversation_id ← 是否带 id（调试用）\n\n规则：\n\
          \  - 新问：conversation_id 为空 → Body **不含** conversation_id 字段\n  - 追问：conversation_id\
          \ 非空 → Body **必须带** conversation_id\n  - user 固定 fast-path-user（首问/追问必须相同）\n\
          \"\"\"\nimport json\n\n\ndef main(query: str, conversation_id: str = \"\"\
          ) -> dict:\n    q = (query or \"\").strip()\n    if not q:\n        return\
          \ {\n            \"body_json\": \"\",\n            \"has_conversation_id\"\
          : \"false\",\n            \"error\": \"query 为空\",\n        }\n\n    payload\
          \ = {\n        \"inputs\": {},\n        \"query\": q,\n        \"response_mode\"\
          : \"streaming\",\n        \"user\": \"fast-path-user\",\n    }\n    cid\
          \ = (conversation_id or \"\").strip()\n    if cid and cid not in (\"null\"\
          , \"undefined\", \"{{conversation.data_analysis_conversation_id}}\"):\n\
          \        payload[\"conversation_id\"] = cid\n\n    return {\n        \"\
          body_json\": json.dumps(payload, ensure_ascii=False),\n        \"has_conversation_id\"\
          : \"true\" if cid else \"false\",\n        \"error\": \"\",\n    }\n\n"
