    - data:
        code: "\"\"\"\nDify Code 节点：解析 erp_login HTTP 响应。\n\n输出均为 string（login_ok\
          \ 为 \"true\"/\"false\"，供 If-Else 等于 判断）。\n\"\"\"\n\n\ndef main(body: str\
          \ | dict, status_code: int = 200) -> dict:\n    import json\n    from datetime\
          \ import datetime, timedelta, timezone\n\n    def fail(msg: str) -> dict:\n\
          \        return {\n            \"auth_token\": \"\",\n            \"token_expires_at\"\
          : \"\",\n            \"user_profile\": {},\n            \"login_ok\": \"\
          false\",\n            \"login_message\": msg,\n        }\n\n    if status_code\
          \ and int(status_code) >= 400:\n        return fail(f\"登录失败（HTTP {status_code}），请检查工号密码。\"\
          )\n\n    data = body\n    if isinstance(body, str):\n        body = body.strip()\n\
          \        if not body:\n            return fail(\"登录失败：ERP 返回为空。\")\n   \
          \     try:\n            data = json.loads(body)\n        except json.JSONDecodeError:\n\
          \            return fail(\"登录失败：响应不是合法 JSON。\")\n\n    if not isinstance(data,\
          \ dict):\n        return fail(\"登录失败：响应格式异常。\")\n\n    token = data.get(\"\
          access_token\") or \"\"\n    user = data.get(\"user\") or {}\n    if not\
          \ token or not user:\n        msg = data.get(\"message\") or data.get(\"\
          detail\") or \"用户名或密码错误。\"\n        if isinstance(msg, dict):\n        \
          \    msg = msg.get(\"message\") or str(msg)\n        return fail(str(msg))\n\
          \n    expires_in = int(data.get(\"expires_in\") or 7200)\n    expires_at\
          \ = (\n        datetime.now(timezone.utc) + timedelta(seconds=expires_in)\n\
          \    ).isoformat()\n\n    name = user.get(\"name\") or user.get(\"username\"\
          ) or \"\"\n    dept = user.get(\"dept_name\") or \"\"\n    login_message\
          \ = (\n        f\"登录成功，{name}（{dept}）。\"\n        f\"您可以直接说：查库存、统计用量、或帮我领\
          \ XX 物料。\"\n    )\n\n    return {\n        \"auth_token\": token,\n    \
          \    \"token_expires_at\": expires_at,\n        \"user_profile\": user,\n\
          \        \"login_ok\": \"true\",\n        \"login_message\": login_message,\n\
          \    }\n\n"
