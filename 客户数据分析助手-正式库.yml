          \     return o\n\n    if st == \"bar\":\n        _dify_bar_horizontal_layout(o)\n\
          \        return o\n\n    g = o.get(\"grid\")\n    if isinstance(g, dict)\
          \ and st == \"line\":\n        o[\"grid\"] = {**g, \"left\": 88, \"bottom\"\
          : 110, \"top\": 96, \"containLabel\": True}\n    xa = o.get(\"xAxis\")\n\
          \    if isinstance(xa, dict) and st == \"line\":\n        al = xa.get(\"\
          axisLabel\") or {}\n        xa[\"axisLabel\"] = {\n            **al,\n \
          \           \"interval\": 0,\n            \"rotate\": 32,\n            \"\
          hideOverlap\": True,\n            \"width\": 72,\n            \"overflow\"\
          : \"truncate\",\n        }\n        o[\"xAxis\"] = xa\n    ya2 = o.get(\"\
          yAxis\")\n    if isinstance(ya2, dict) and st == \"line\":\n        yal\
          \ = ya2.get(\"axisLabel\") or {}\n        ya2[\"axisLabel\"] = {**yal, \"\
          margin\": 18, \"width\": 68, \"overflow\": \"break\"}\n        o[\"yAxis\"\
          ] = ya2\n        o[\"backgroundColor\"] = \"#f8f9fc\"\n\n    return o\n\n\
          \ndef _mermaid_safe_label(s: str, maxlen: int = 18) -> str:\n    t = (\n\
          \        s.replace('\"', \"'\")\n        .replace(\"\\n\", \" \")\n    \
          \    .replace(\"[\", \"(\")\n        .replace(\"]\", \")\")\n        .replace(\"\
          （\", \"(\")\n        .replace(\"）\", \")\")\n        .replace(\":\", \"\
          ：\")\n        .strip()\n    )\n    return (t[: maxlen - 1] + \"…\") if len(t)\
