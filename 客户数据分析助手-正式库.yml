            \ IS NULL OR (m.INV_PART_DESCRIPTION NOT LIKE N'%外发%' AND m.INV_PART_DESCRIPTION\
            \ NOT LIKE N'%外协%')) AND (m.INV_DESCRIPTION IS NULL OR (m.INV_DESCRIPTION\
            \ NOT LIKE N'%外发%' AND m.INV_DESCRIPTION NOT LIKE N'%外协%'))`**。**禁止**只筛\
            \ **`INV_PART_DESCRIPTION`** 而漏 **`INV_NAME`**（否则会出现 **「全制程外发PCB」** 等仍在结果中）。\n\
            \n**输出前自检**：凡「材料统计」且 **`FROM` 链含 `Data0017 m`** → 若缺 **`JOIN Data0496`\
            \ + `ttype` 条件**，或缺 **`INV_NAME` 的外发/外协 `NOT LIKE`** → **本 SQL 不合格，必须重写**。若\
            \ **`SELECT`/`GROUP BY` 含 **`u.`**（如 **`u.UNIT_NAME`**）→ 须有 **`JOIN Data0002\
            \ u`**（见文首 **铁律：`u` 禁止悬空**）。若原句**点名某一材料大类**（中文类别词、用户给出的 **`GROUP_NAME`/代码**，或\
            \ **1.13** 映射能归一的词）且**未**表达「全库/全部物料/所有类别」→ **`WHERE` 须有针对该类的 **`cat` 类别并联**（见\
            \ **1.12**、**1.13**），**「明细」「统计」等句式均不免除此条**。\n\n## 铁律：用户问题含「统计」→ 只输出汇总，禁止物料明细行（最高优先级）\n\
            \n**触发**：用户原句中出现 **「统计」**（含「统计分析」「数据统计」等含「统计」二字的常规口语）。\n**硬性约束**：在满足本条触发，且用户**未**在同一原句中明确要求下列任一：**明细**、**各物料**、**每种**、**分列**、**清单**、**逐条**、**按料号**、**按原材料代码**、**提供明细**、**领用流水**、**每一笔**、**TOP前几名**、**前十**\
            \ 时，生成的 SQL **必须仅为汇总口径**，**禁止**生成「一行一物」的明细表：\n\n1. **`SELECT` 的最终输出列不得包含\
