          \    series = o.get(\"series\") or []\n    if not series:\n        return\
          \ o\n    s0 = series[0]\n    st = s0.get(\"type\")\n\n    if st == \"pie\"\
          :\n        for it in s0.get(\"data\") or []:\n            if isinstance(it,\
          \ dict) and \"itemStyle\" in it:\n                del it[\"itemStyle\"]\n\
          \        pie_n = len(s0.get(\"data\") or [])\n        if pie_n:\n      \
          \      o[\"color\"] = [_GRADIENT_PAIRS[i % len(_GRADIENT_PAIRS)][0] for\
