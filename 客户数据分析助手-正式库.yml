    - data:
        code: "# -*- coding: utf-8 -*-\n\"\"\"\nDify 代码节点：从「Schema: dbo」前缀 + 多条首尾相接的\
          \ JSON 对象文本中解析出维修记录数组。\n\n输入：在节点「输入变量」里新增 arg1（类型 string），绑定上游全文。\n\n输出（与\
          \ Dify「输出变量」一一对应；records 用字符串规避 array 最多 30 条限制）：\n- records：string，整段 JSON\
          \ 数组文本（UTF-8，中文不转义为 \\\\uXXXX），下游用 JSON 解析即可\n- count：number，与 records 中数组长度一致（超长时仅保留前缀若干条）\n\
          \nDify 对单变量约 400000 字符上限：超出时自动截断为能容纳的最长前缀；单条即超限时退化为 \"[]\"。\n\n重要：工作流代码节点通过调用\
          \ main(...) 并读取其 return 的字典。\n\n乱码：仅对「不含中文」的字符串尝试 latin-1 → gbk / gb18030，必要时再试\
          \ latin-1 → utf-8（fix_mojibake，默认 True）。\n\n解析失败时 records 为 \"[]\"，count\
          \ 为 0。\n\"\"\"\n\nimport json\nimport re\nfrom typing import Any, Dict,\
          \ List\n\nSCHEMA_PREFIX = re.compile(r\"^Schema:\\s*\\S+\\s*\", re.IGNORECASE)\n\
          \n# Dify：「output variable records must be less than 400000 characters」——留出余量按字符数（len）控制\n\
          RECORDS_OUTPUT_MAX_CHARS = 399_000\n\n\ndef _json_array_prefix_under_limit(\n\
          \    records: List[Dict[str, Any]], max_chars: int\n) -> tuple[str, int]:\n\
          \    \"\"\"\n    返回不超过 max_chars 的 JSON 数组字符串，以及其中包含的记录条数。\n    在条数维度二分，避免\
          \ O(n) 次全量 dumps。\n    \"\"\"\n    if not records:\n        return \"[]\"\
          , 0\n    full = json.dumps(records, ensure_ascii=False)\n    if len(full)\
          \ <= max_chars:\n        return full, len(records)\n    lo, hi = 0, len(records)\n\
          \    best_s, best_k = \"[]\", 0\n    while lo <= hi:\n        mid = (lo\
          \ + hi) // 2\n        chunk = json.dumps(records[:mid], ensure_ascii=False)\
          \ if mid else \"[]\"\n        if len(chunk) <= max_chars:\n            best_s,\
          \ best_k = chunk, mid\n            lo = mid + 1\n        else:\n       \
          \     hi = mid - 1\n    return best_s, best_k\n\n\ndef _strip_schema_prefix(text:\
          \ str) -> str:\n    t = text.strip()\n    t = SCHEMA_PREFIX.sub(\"\", t,\
          \ count=1)\n    return t.strip()\n\n\ndef parse_json_objects_blob(blob:\
          \ str) -> List[Dict[str, Any]]:\n    \"\"\"从一段文本中连续 raw_decode 多个顶层 JSON\
          \ 对象。\"\"\"\n    decoder = json.JSONDecoder()\n    idx = 0\n    n = len(blob)\n\
          \    out: List[Dict[str, Any]] = []\n    while idx < n:\n        while idx\
          \ < n and blob[idx].isspace():\n            idx += 1\n        if idx >=\
          \ n:\n            break\n        val, end = decoder.raw_decode(blob, idx)\n\
          \        if not isinstance(val, dict):\n            raise ValueError(f\"\
          第 {len(out) + 1} 段解析结果不是对象，而是 {type(val).__name__}\")\n        out.append(val)\n\
          \        idx = end\n    return out\n\n\ndef _has_cjk(s: str) -> bool:\n\
          \    return any(\"\\u4e00\" <= c <= \"\\u9fff\" for c in s)\n\n\ndef _cjk_score(s:\
          \ str) -> int:\n    return sum(1 for c in s if \"\\u4e00\" <= c <= \"\\\
          u9fff\")\n\n\ndef _fix_mojibake_string(s: str) -> str:\n    \"\"\"\n   \
          \ 已是正常 UTF-8 中文则不处理，避免误伤。\n    否则尝试：latin-1 字节按 gbk / gb18030 / utf-8 解码，取含中文最多的一种。\n\
          \    \"\"\"\n    if not s or not isinstance(s, str):\n        return s\n\
          \    if _has_cjk(s):\n        return s\n    best = s\n    best_score = _cjk_score(s)\n\
          \    for codec in (\"gbk\", \"gb18030\"):\n        try:\n            t =\
          \ s.encode(\"latin-1\").decode(codec)\n            sc = _cjk_score(t)\n\
          \            if sc > best_score:\n                best, best_score = t,\
          \ sc\n        except (UnicodeDecodeError, UnicodeEncodeError):\n       \
          \     continue\n    try:\n        t = s.encode(\"latin-1\").decode(\"utf-8\"\
          )\n        sc = _cjk_score(t)\n        if sc > best_score:\n           \
          \ best = t\n    except (UnicodeDecodeError, UnicodeEncodeError):\n     \
          \   pass\n    return best\n\n\ndef fix_record_strings(obj: Any, fix_mojibake:\
          \ bool = True) -> Any:\n    \"\"\"递归处理 dict/list 中的字符串；可选乱码修复。\"\"\"\n \
          \   if isinstance(obj, dict):\n        return {k: fix_record_strings(v,\
          \ fix_mojibake) for k, v in obj.items()}\n    if isinstance(obj, list):\n\
          \        return [fix_record_strings(x, fix_mojibake) for x in obj]\n   \
          \ if isinstance(obj, str):\n        text = _fix_mojibake_string(obj) if\
          \ fix_mojibake else obj\n        return text.replace(\"|\", \"/\")\n   \
          \ return obj\n\n\ndef _as_input_string(raw: Any) -> str:\n    \"\"\"Dify\
          \ 侧应按「字符串」传参；仅接受 str（或 bytes 按 UTF-8 解码）。\"\"\"\n    if raw is None:\n \
          \       raise ValueError(\"未传入 arg1：请在代码节点「输入变量」里添加 arg1 并绑定上游文本\")\n  \
          \  if isinstance(raw, str):\n        if not raw.strip():\n            raise\
          \ ValueError(\"arg1 为空字符串，请检查上游是否已输出内容\")\n        return raw\n    if isinstance(raw,\
          \ (bytes, bytearray)):\n        return raw.decode(\"utf-8\", errors=\"replace\"\
          )\n    raise ValueError(\n        f\"入参须为字符串，当前类型为 {type(raw).__name__}。\"\
          \n        \"请在 Dify 中将该输入变量类型设为「字符串」，勿用 object/array。\"\n    )\n\n\ndef\
          \ _parse_records(arg1: Any, fix_mojibake: bool) -> List[Dict[str, Any]]:\n\
          \    text = _as_input_string(arg1)\n    body = _strip_schema_prefix(text)\n\
          \    if not body:\n        raise ValueError(\"去掉 Schema 前缀后内容为空\")\n   \
          \ records = parse_json_objects_blob(body)\n    if fix_mojibake:\n      \
          \  records = [fix_record_strings(r, True) for r in records]\n    return\
          \ records\n\n\ndef main(arg1: Any = None, fix_mojibake: bool = True) ->\
          \ Dict[str, Any]:\n    \"\"\"Dify 调用 main；records 为 JSON 数组字符串，count 为条数。\"\
          \"\"\n    try:\n        records = _parse_records(arg1, fix_mojibake)\n \
          \       records_str, included = _json_array_prefix_under_limit(\n      \
          \      records, RECORDS_OUTPUT_MAX_CHARS\n        )\n        return {\"\
          records\": records_str, \"count\": included}\n    except Exception:\n  \
          \      return {\"records\": \"[]\", \"count\": 0}\n\n"
        code_language: python3
