            \ 等多段尺寸或工艺后缀），且 **不像** 企业内常用的 **短物料编码**（无文档时以「长串 + 多分隔符」启发式判断）；\n    \
            \ - 按 **`INV_PART_NUMBER = 用户原文`** 在逻辑上会 **过长或含描述性字符**（与贵司编码习惯不符）时，默认走描述路径。\n\
            \   - **强制示例触发（必须执行）**：当用户输入形如 **`HB1.2MM/15um/0/1240*1035/KM-1-D`** 的长规格串，并提问\
