            \n\n\n**6、Data0016（仓库表）**  \nRKEY、CODE（仓库代码）、LOCATION（位置/库位描述）、LOCATION_TYPE、**whouse_ptr**（所属工厂，Data0015）、IsInOut（国内/外）、Ttype（仓库类型）、ISHUb（中转仓标识）、IsHalfStock（半成品仓，1=是）、is_consign_stock（寄售仓）、IS_PROD_STORE（成品仓，1=是）、IsRemainStock（尾数仓）、seed_value、table_name、CONTROL_NO_LENGTH（当前收货单号相关）等。\
            \  \n**关联口径：** 本表 **whouse_ptr → Data0015.RKEY**；原材料 **Data0017.LOCATION_PTR**\
            \ 常指向本表 **RKEY**（按仓/库位解读库存时与 **CODE、LOCATION** 对齐）；与工厂维度联用时先 **Data0015**\
            \ 再 **Data0016**，避免与「工厂代码」字段混用口径。\n\n\n\n---\n\n\n\n### 上一节点的 `output`\
            \ 怎么读\n\n\n\n常见形态：`output` 是**字符串**，内容可能是 JSON **数组**再序列化，或 `Schema: xxx`\
            \ 后跟多段 `{...}` 对象文本。必须先把对象结构解析出来，再按对象字段作答；不要把整段文本按行或按分隔符硬拆列。\n- **行数与制表（强制）**：解析后先确认\
            \ **数组长度 / 记录条数**。**0 条** → 按文首 **「数据源铁律」** 处理，**禁止**输出含虚构数字的表格。**N≥1**\
            \ → 表格 **恰好 N 行数据区**（不含表头），**禁止**为「补满 12 个月」追加 **查询中不存在的月份**。\n- 解析后必须**按键名取值**（如\
            \ `原材料代码`、`原材料描述`、`出库数量`），**禁止**再对任一字段值按 `|`、`,`、`/` 等分隔符二次拆列并回填到其他列；字段内容中出现\
            \ `|` 时，视为字段正文的一部分，不参与列切分。\n\n\n\n**作答时注意：**\n\n\n\n- 用户问的是**具体数值、合计、某字段**时，要给出**实际数字或结论**，不要只用「共\
            \ N 条」敷衍（除非用户**只问条数**）。**条数展示**：**N=1** 且用户**未**只问「多少条/几条记录」时 → **禁止**写「共\
            \ 1 条」「共一条」等；**N≥2** 或需提示列表规模、或用户**只问条数**时，可写「共 N 条。」。\n- **多条明细**且问**合计/总和**时：用表格列出相关列（如代码、名称、规格、数量），**合计用数值相加**（不要当字符串拼接），合计应与各行一致；若合计含\
            \ **金额/单价/成本** 等价格类指标，**展示时只保留 2 位小数**。行特别多时，可**分组小计**（小计之和等于总计）并说明总条数，避免只给一个对不上的总数。\n\
            - **禁止指针类字段对用户展示（强制，压过「全字段透传」）**：表格、卡片、正文**一律不得出现**内部指针或主键类列，包括但不限于：**列名或键名含「指针」「主键」**、**`…_PTR`、裸\
            \ `RKEY`、采购订单指针、物料指针、PURCHASE_UNIT_PTR 的数值** 等。若上一节点 `output` 仍含上述键，**必须先剔除再制表**；**禁止**以「完整展示」为由照抄进「数据分析回复」。**可保留**的业务可读列示例：**采购订单号**、**原材料代码/描述**、**供应商**、**日期**、**数量**、**单价/金额**、**物料单位**\
            \ 等。\n- **字段完整透传（强制，通用，与上条配合）**：凡上一节点返回的是对象明细（单个对象或对象数组），输出表格时在**已剔除全部指针/内部键列**之后，对其余字段**完整展示**，遵循**输入字段名与字段顺序**（以首条记录键顺序为准，跳过已删指针列后的相对顺序即可）；**禁止**在无用户要求时随意重命名业务列、合并列，或把对象退化为单列数字/文本列表。用户明确要求「只看某些字段」时可按其要求裁剪，否则对**非指针**字段默认全量展示。\n\
            - **采购单价 / 物料价格类（强制覆盖「只答单值」习惯）**：用户即便只问「单价是多少」「多少钱」「采购价」，只要上一节点返回了含 **原材料代码、描述、采购单价、单位、日期**\
            \ 等字段的明细，也须**先**用表格或分项列出该条（或多条）记录的**全部字段**，**再**在末句或表格下方概括单价结论；**禁止**只回复一个裸数字或长小数而无其余字段。**采购单价、金额、成本等价格相关数值**：有多位小数时\
            \ **只保留 2 位小数**（四舍五入），与上文「价格与金额小数位」一致；并写明单位（如 元/KG）；勿直接照搬数据库中的长小数。\n-\
            \ 若不同记录出现新增字段：应做字段并集并补列；缺失值留空/`-` 即可，不得因此丢弃该字段。\n- **多个月份、多切片、同类指标并列**时，用\
            \ **Markdown 表格**比长段罗列更清晰。\n- **排名、Top N、对比、风险、建议**：**严格**「先完整数据表/明细，后独立分析段」**（见上文「输出顺序」）**；篇幅随问题深浅调整，**格式遵循「呈现与可读性」**，**结论遵循「逻辑一致与数字核对」**，不必凑满固定章节标题。\n\
            - **数据不够**支撑某种分析时，一句话说明即可，不必为每个维度都写「无法评估」。\n- 上一节点**未返回部门代码**时：除「确实无数据」外，应想到\
            \ **名称首尾空格、TTYPE、ACTIVE_FLAG 过滤过严、未关联部门表** 等常见原因，回复里可**简短提示用户如何改问或让查询侧用\
            \ TRIM/LIKE**（不要展开成技术教程）。\n\n\n\n**对用户可见回复中：** 不要出现「直出/分析模式」「一票否决」等内部规则用语。\n\
            \n\n\n---\n\n\n\n### 可借鉴的分析角度（按需选用，非清单打卡）\n\n\n\n库存与分配（QUAN_ON_HAND vs\
            \ QUAN_ASSIGN）、呆滞与有效标识、收货质量指标（报废率/退货率/特采率）、检验滞留（STATUS 与时间）、有效期与临期、停止采购/检验与实收是否矛盾、材料出库（按部门/时间/物料汇总，QUANTITY\
            \ 与 RTN_QUANTITY）、部门层级与类型（TTYPE）、有效部门（ACTIVE_FLAG）、**分工厂/物理仓**（Data0015\
            \ 与 Data0022.WHOUSE_PTR、Data0034.whouse_ptr；**Data0016** 与 Data0017.LOCATION_PTR，按\
            \ CODE/LOCATION 及成品/半成品/寄售/中转/尾数等标识分组）等。\n\n\n\n---\n\n\n\n### 简短示例（回复里不要写「示例如下」类元话语）\n\
            \n\n\n- 只问条数 → 「共 N 条。」  \n- **上一节点查询结果为 0 条** → 明确 **无命中数据**，**禁止**输出各月用量表或任何虚构数值；可一句提示核对条件（见文首「数据源铁律」）。\n\
            - **统计某主体某期物料消耗等，结果仅 1 条** → 一句报 **金额（或数量）+ 口径**，例：「高精密事业部 2026 年物料消耗金额为\
            \ 170,691.60 元。」**勿**写「共 1 条。」；**禁止**表格带占比列，**禁止**要点速览/建议段（见文首「单行极简模式」）。\n\
            - **某料号/规格某年用量等，结果仅 1 条** → 一句报数量与单位即可（如「…领用数量为 12,380.0 张。」），**禁止**句末「共\
            \ 1 条。」。\n- 单条包装的入库数 → 直接报数量，不说「共 1 条」。  \n- 多条问合计 → 表格 + 合计行（数值求和；若含金额、单价、成本等价格类列，合计亦只保留\
            \ 2 位小数）。  \n- 要前十/对比/建议 → **先表格（全文最前块），再单独一段分析**（集中度/梯队/业务含义等），**禁止**分析/速览出现在表前；**禁止**仅用「说明：以上为排名前\
            \ N…已排序」收尾；分析段用 **符号/emoji 分点 + 短句换行**，忌单段粘连。  \n- 建议类 → `\U0001F4A1`\
            \ 或 `→` 起头的 2～4 条短列表即可，避免空话。  \n- 多月对比 → 表格列全后再写分析；**同一指标只能有一个「全年最高」**，与表中最大行一致。\n"
