    - data:
        code: "\nfrom typing import Any, Dict\n\n\ndef _safe_name(name: str) -> str:\n\
          \    text = (name or \"\").strip()\n    base = text if text else \"点击下载文件\"\
          \n    return base if base.lower().endswith(\".md\") else f\"{base}.md\"\n\
          \n\ndef _safe_url(url: str) -> str:\n    text = (url or \"\").strip()\n\
          \    if not text:\n        return \"\"\n    # 仅做最小校验，避免输出空链接\n    if not\
          \ (text.startswith(\"http://\") or text.startswith(\"https://\")):\n   \
          \     return \"\"\n    return text\n\n\ndef main(\n    file_url: Any = None,\n\
          \    file_name: Any = None,\n    arg1: Any = None,\n    arg2: Any = None,\n\
          \    style: Any = None,\n    **kwargs: Any\n) -> Dict[str, Any]:\n    url\
          \ = _safe_url(\n        str(\n            file_url\n            or arg1\n\
          \            or kwargs.get(\"url\")\n            or kwargs.get(\"download_url\"\
          )\n            or kwargs.get(\"fileUrl\")\n            or kwargs.get(\"\
          downloadUrl\")\n            or \"\"\n        )\n    )\n    name = _safe_name(str(arg2\
          \ or file_name or kwargs.get(\"name\") or \"下载文件\"))\n\n    if not url:\n\
          \        return {\n            \"card_md\": \"未获取到有效下载地址，请检查上游 `file_url`。\"\
          \n        }\n\n    style_mode = str(style or kwargs.get(\"card_style\")\
          \ or \"md\").strip().lower()\n\n    # 方案1：纯 Markdown（兼容性最好）\n    card_md\
          \ = (\n        \"### 文件下载\\n\"\n        \"> ┌──────────────────────────────┐\\\
          n\"\n        f\"> 文件名：**{name}**\\n\"\n        f\"> [立即下载]({url})\\n\"\n\
          \        \"> └──────────────────────────────┘\"\n    )\n\n    # 方案2：HTML\
          \ 样式卡片（更美观，需渠道允许 HTML 渲染）\n    card_html = (\n        \"<div style='border:1px\
          \ solid #d0d7de;border-radius:12px;padding:14px 16px;\"\n        \"background:#f8fafc;max-width:420px'>\"\
          \n        \"<div style='font-size:16px;font-weight:700;margin-bottom:10px'>文件下载</div>\"\
          \n        f\"<div style='font-size:14px;color:#334155;margin-bottom:12px'>文件名：{name}</div>\"\
          \n        f\"<a href='{url}' target='_blank' \"\n        \"style='display:inline-block;background:#2563eb;color:#fff;text-decoration:none;\"\
          \n        \"padding:8px 12px;border-radius:8px;font-size:14px'>点击下载</a>\"\
          \n        \"</div>\"\n    )\n\n    return {\n        \"card_md\": card_md,\n\
          \        \"card_html\": card_html,\n        \"card_text\": card_html if\
          \ style_mode == \"html\" else card_md\n    }\n"
