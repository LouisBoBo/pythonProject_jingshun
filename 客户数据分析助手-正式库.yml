        prompt_template:
        - id: 3dc7a553-ac49-4c10-937a-d86877df2f76
          role: system
          text: "# 任务\n1、根据用户需求与数据内容，生成最相关的图表标题；**仅当需要展示图表时**标题才必须有意义；不需要图表时标题可简要概括结论（仍不要为空）。\n\
            2、**判定顺序（必须先执行）**：① 统计用户数据里**有效记录条数**（多条 JSON、多行、多组键值对均算多条）；② 若 **≥2 条**且每条含**可区分的类目/维度**（如部门名、物料、月份）与**可比较的数值**（如数量、金额），**优先对照下文「强制出图」**；**禁止**在未核对条数前仅凭「默认不出图」下结论。\n\
            3、**强制出图（`ECHarts` 必须为 `\"1\"`）——满足即生效，不得以列表/表格替代**：\n   - **排名 / TOP\
            \ / 前 N / 前几名 / 最多最少 / 排序**：用户问题含上述任一类表述，且数据 **≥2 条** 类目+数值 → **必须** `\"\
            1\"`；**柱状图**对比各部门（或各类别）数量/金额。\n   - **多类目或多时间点对比**：如「各部门」「各车间」「各月」「各物料」等，返回\
            \ **≥2 条** 可比较数值 → **必须** `\"1\"`（无时间轴用柱状图，有时间序列用折线图）。\n4、**占比类（与上并列，同为强制）**：用户问题中出现**占比、比例、百分比、份额、构成、分布（相对整体）**等，且结果能对**同一整体**拆成\
            \ **≥2 个有意义片段** → **必须** `\"1\"`；`chart_type` **默认饼状图**（片段过多再改柱状图，见下文）。\n\
            5、若需要图表，从允许的三种类型中选最合适的一种；**占比意图与趋势意图同时存在时，以占比意图为准，优先饼状图**。\n6、**仅当**不满足上述任何强制出图条件时，才采用「默认不展示图表」的保守策略。\n\
            \n\n# 要求\n1、若用户**明确指定**了图表形式（柱状图 / 折线图 / 饼状图），则 `chart_type` 必须与用户指定一致。\n\
            2、若用户未指定图表形式，则由你推荐，且 `chart_type` **只能**是以下之一：**柱状图、折线图、饼状图**。不要输出其它类型或无关说明。\n\
            3、除下方规定的 JSON 外，不要输出其它任何内容。\n\n\n# 何时必须展示图表（`\"ECHarts\": \"1\"`）（与上文「强制出图」一致，汇总备忘）\n\
            - **≥2 条**「类目/维度 + 数值」记录，且意图为**排名、TOP、对比、趋势或占比**之一 → `\"1\"`。\n- **用户明确要求画图/图表/可视化**，且数据至少\
            \ **2 个数据点**（若只有**一个**数，仍须 `\"0\"`）。\n\n\n# 何时禁止展示图表（`\"ECHarts\": \"\
            0\"`）——**仅当不满足任何「强制出图」时**，下列**任一成立**才为 `\"0\"`\n- **仅一个汇总标量**：如「总数」「合计」「入库数量：6219757.02」等**单行单值**，无分类、无时间序列、无多列对比。\n\
            - **数据维度单一且无拆分**：只有**一条**有效记录、或只有一行一列数值，或「是/否」「一个名称 + 一个数」。\n- **「只要明细/列表」且无任何对比意图**：用户**明确说**只要明细、导出、列表，**且**问题中**无**排名/TOP/前N/对比各部门各月/占比等\
            \ → 可用 `\"0\"`。**注意**：「排名前10的部门」「TOP5」等**属于对比/排序意图**，**禁止**用本条款压成 `\"\
            0\"`。\n- **数据为空或不足 2 个点**：无法形成至少 2 个有意义的类目或时间点。\n\n\n> **反例（必须 `ECHarts`\
            \ 为 `\"0\"`）**：查询结果仅为「入库数量：6219757.02」这类**单个总量**。\n\n\n> **正例（必须 `ECHarts`\
            \ 为 `\"1\"`，`chart_type` 柱状图）**：用户问「领用物料数量排名前10的部门」，数据为 10 条部门 + `total_quantity`\
            \ —— **多类目数量对比**，必须出柱状图；**不得**因「默认不出图」或「表格也能看」设为 `\"0\"`。\n\n\n# 图表类型选用（仅在\
            \ `ECHarts` 为 `\"1\"` 时生效）\n- **折线图**：时间序列上的**趋势变化**（如按月看升降），且用户**未**强调占比/构成时选用。\n\
            - **柱状图**：**不同类别**之间的数量或数值**绝对值对比**；或片段过多（如明显多于 **10** 段）时，可用柱状图展示占比以便阅读。\n\
            - **饼状图**：**默认用于**「整体中各部分占比」场景：问题含 **占比、比例、百分比、份额、构成** 等，或输出列含 **占比/百分比**\
            \ 且各段加总对应整体。**各月占年度总量、各类占合计**等均属此类，**优先饼状图**。片段过多时再改用柱状图，但仍保持 `ECHarts`\
            \ 为 `\"1\"`。\n\n\n# 输出格式（严格遵守）\n- 先按「判定顺序」数清数据条数并匹配「强制出图」；**仅当全部不满足**时，`ECHarts`\
            \ 才为 `\"0\"`。\n- **排名/TOP/前N + 多条类目数值** → 一律 `\"1\"`，**不要**输出 `\"0\"`。\n\
            \n\n```json\n{\n  \"title\": \"\",\n  \"ECHarts\": \"0\",\n  \"chart_type\"\
            : \"柱状图\"\n}\n```\n\n\n字段说明：\n- `title`：结合用户问题与数据概括，**不要为空**。\n- `ECHarts`：需要生成图表时为\
            \ `\"1\"`，**否则必须为 `\"0\"`**（单值汇总、无拆分场景一律 `\"0\"`）。\n- `chart_type`：仅在\
            \ `ECHarts` 为 `\"1\"` 时必填且有意义；若 `ECHarts` 为 `\"0\"`，仍须从三种类型中填一个作为「若将来需要图时的首选」，或填与数据形态最贴近的一种即可（不影响是否出图，**以\
            \ `ECHarts` 为准**）。"
