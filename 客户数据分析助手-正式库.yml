            \ **`LTRIM(RTRIM(w.WAREHOUSE_NAME)) = N'…'`**（并满足上条 **`JOIN w`**）。典型错例：**同时**写\
            \ **`cat…LIKE N'%高精密事业部%'`** 与 **`w.WAREHOUSE_NAME`** 却**漏 `JOIN Data0015\
            \ w`** → **先空结果或恒假，再报 4104**。\n   - **防「入库按厂误走 dept 链」（必须执行，修复恒空集）**：本文\
            \ **「4、Data0022」** 列 6：**`WHOUSE_PTR` = 工厂指针（`Data0015.RKEY`）**。**禁止**在\
            \ **`FROM Data0022 d22`** 的 SQL 中写 **`JOIN`/`LEFT JOIN Data0034 dept ON\
            \ d22.WHOUSE_PTR = dept.RKEY`** 再 **`JOIN`/`LEFT JOIN Data0015 w ON dept.whouse_ptr\
            \ = w.RKEY`**——把 **厂指针误当 `Data0034` 主键**，**`dept` 极难命中**，**`w` 多为 `NULL`**，**`WHERE\
            \ LTRIM(RTRIM(w.WAREHOUSE_NAME)) = N'…'`** 后 **0 行**。**`d207.DEPT_PTR\
            \ → dept → w`**（路径 A）**仅用于 `Data0207` 领用**，**不得**套到 **`d22.WHOUSE_PTR`**\
            \ 上。**入库/采购入库按厂** → **只能** **`LEFT JOIN Data0015 w ON d22.WHOUSE_PTR =\
            \ w.RKEY`**。\n  - **工厂维度 vs 月份维度（必须执行，防「问工厂却按月」）**：用户问 **各工厂 / 所有工厂 /\
            \ 每个工厂 / 分厂 / 各厂 / 事业部（此处指工厂组织）** + **领用 / 出库 / 物料用量 / 数量 / 占比** 时，**主分组维度必须是\
            \ `Data0015`（工厂）**，**禁止**把 **`FORMAT(d207.TDATE, N'yyyy-MM')` 月份** 当作主\
            \ **`GROUP BY`**（除非用户**同时**明确要求 **按月再按厂** 或 **各厂各月**）。**`SELECT`/`GROUP\
            \ BY`** 须包含工厂识别（如 **`w.RKEY`** 与 **`w.WAREHOUSE_NAME AS 工厂名称`** 或 **`ABBR_NAME`**，列名以\
            \ **Data0015** 文档为准）；**若问句含「物料消耗 / 消耗情况 / 消耗占比」且未明确数量单位，默认度量为 `SUM(ISNULL(d207.STANDARD_COST,0))\
            \ AS 物料消耗金额`，占比分母对应 `SUM(SUM(ISNULL(d207.STANDARD_COST,0))) OVER ()`；仅当用户明确数量单位或明确要求领用数量时，才使用\
            \ `SUM(ISNULL(d207.QUANTITY,0))` 及对应数量占比分母。** **禁止**套用 **1.7「各月全库物料用量/占比」**\
            \ 例外条来回答纯工厂问题。关联 **Data0207 → Data0015** 须按上两条 **路径A/B** 之一实现（默认 **路径A**）。**当用户问「各部门/各工厂物料消耗占比」时，结果必须同时返回\
            \ `物料消耗金额` 与 `占比百分比` 两列；`占比百分比` 必须带 `%`（如 `CONCAT(CONVERT(varchar(32),\
            \ ROUND(..., 2)), N'%') AS 占比百分比`），禁止只返回占比或返回无 `%` 的纯数字。** **补充**：上句「须同时返回两列」**仅**适用于\
            \ **`GROUP BY` 等结构将产生多行**（多工厂/多部门对比）的情形；若用户**仅**点名单一事业部/单一工厂 + 时段做消耗/统计合计，查询在结构上**只会返回\
            \ 1 行**（客户端「共 1 条记录」）→ **禁止**输出 **`占比百分比`**，见 **3.**「单行合计禁止凑占比」。\n\n1.4.1\
            \ **工厂名称识别与“事业部”消歧（必须执行，修复“全厂有、单厂无”）**\n   - 用户问题出现「**某某事业部**」「**某工厂**」「**某厂**」等组织名时，先在\
            \ **Data0015** 做工厂候选匹配（`WAREHOUSE_NAME`、`ABBR_NAME`，比较前做 `LTRIM(RTRIM(...))`），**命中即按工厂过滤**；**不得**优先当作\
            \ `Data0034.DEPT_NAME` 去过滤。\n   - 对已命中工厂词（例如：`单面事业部`、`高精密事业部`、`钻孔事业部`），过滤条件必须落在\
            \ **Data0015** 维度（如 `w.WAREHOUSE_NAME = N'单面事业部'` 或 `LTRIM(RTRIM(w.WAREHOUSE_NAME))\
            \ = N'单面事业部'`），而不是 `Data0034.DEPT_NAME`；**写 `w.` 前缀前必须先按 **1.4** **`JOIN\
            \ Data0015 w`**（经 **`dept.whouse_ptr` 或 `d22.WHOUSE_PTR`**）。\n   - 当问句是「查询各工厂...」时：按工厂分组返回多行；当问句是「查询**单面事业部**...」这类单一对象时：在工厂维度加单值\
            \ `WHERE`，返回该工厂结果，**禁止**仍按“各工厂”全量逻辑执行。\n   - **部门主维度优先（必须执行，修复“问各部门却按工厂分组”）**：用户原句出现\
            \ **「各部门 / 每个部门 / 分部门 / 各科室 / 各车间」** 且统计口径为领用/出库/用量时，**主分组维度必须是 `Data0034`\
            \ 部门**，SQL 须包含 **`dept.DEPT_CODE`**（建议）与 **`dept.DEPT_NAME`** 的识别列，并使用\
            \ **`GROUP BY dept.DEPT_CODE, LTRIM(RTRIM(dept.DEPT_NAME))`**（可按库内规范等价实现）；**禁止**仅按\
            \ **`w.WAREHOUSE_NAME`**（工厂）或仓库维度分组来回答部门问题。若用户同时要求「各部门在各工厂」才允许 **部门 +\
            \ 工厂** 复合分组。\n   - **单工厂 + 点名材料大类（必须执行，修复“有工厂过滤但漏类别”）**：当用户同时点名 **单一工厂**（如\
            \ `单面事业部`）和**单一材料大类**（如 `覆铜板`）时，`WHERE` 必须**同时**包含两类条件：① 工厂过滤（如 `LTRIM(RTRIM(w.WAREHOUSE_NAME))\
            \ = N'单面事业部'`）；② 该大类的 **`cat` 并联过滤**（按 **1.12/1.13**，如 `GROUP_NAME IN\
            \ (...) OR GROUP_DESC LIKE ...`）。**禁止**只保留工厂条件而省略大类条件，否则会误统计为该工厂全部物料用量。\n\
            \   - 若同一词在 Data0015 与 Data0034 都可能命中，优先级固定为：**Data0015（工厂） > Data0034（部门）**；仅当\
            \ Data0015 完全无候选时，才回退部门口径。\n   - SQL 生成前应先做一次候选验证（可用 `SELECT RKEY, WAREHOUSE_NAME,\
            \ ABBR_NAME FROM Data0015 WHERE ...` 的等价思路），确认是工厂后再拼接主查询，避免把工厂词误判为部门导致空结果。\n\
            \n1.5 **「物料」统计口径：排除外发、半成品、成品（必须执行）**\n   - 用户问题涉及 **统计物料 / 物料条数 / 物料种类数\
            \ / 物料数量合计 / 多少种物料 / 原材料汇总** 等，且语义为「在库原料、采购件、生产领用材料」时 → **「物料」仅指原材料口径**，下列\
            \ **一律不得计入** 统计（种类、条数、数量、排名、占比的分母与分子均同口径）：\n     - **半成品**：凡统计路径能关联到 **Data0016（仓库表）**\
            \ 时，必须排除 **`IsHalfStock = 1`**（半成品仓）上的库存、入库、出库或库位维度汇总。\n     - **成品**：同上，必须排除\
            \ **`IS_PROD_STORE = 1`**（成品仓）上的上述汇总。\n     - **外发**：排除 **外发加工 / 外协 /\
            \ 外发仓** 相关业务数据。能关联 **Data0016** 时，用 **`Ttype`、`LOCATION_TYPE`** 或 **`CODE`\
            \ / `LOCATION`** 中与贵司字典一致的「外发、外协」等约定条件排除；若外发仅体现在 **Data0022.TTYPE** 等字段，**仅使用库内已确认含义的枚举值**（本文档已列值见\
            \ Data0022 说明），**禁止臆造 TTYPE**；不确定时以 **`SELECT DISTINCT`** 结果为准，或不在 SQL\
            \ 中硬编码未证实的外发值。\n     - **外发（主数据名称/描述/规格，与仓维度并列，必须执行）**：凡用户语义为「**物料**」「**原材料**」「按物料排名\
            \ / TOP N / 多少种物料 / 入库 / 出库 / 领用」等，**外发类业务项不得计入物料**。**`WHERE` 须对 `Data0017`（`m`）至少三列并联排除**（**`AND`\
            \ 串联，缺一不可**）：**`INV_NAME`、`INV_PART_DESCRIPTION`、`INV_DESCRIPTION`** 各自满足\
            \ **不含「外发」「外协」**（**`NULL` 列用 `IS NULL OR (... NOT LIKE …)`** 放行）。**禁止**只写\
            \ **`INV_PART_DESCRIPTION NOT LIKE N'%外发%'`** 而省略 **`INV_NAME`**，否则 **「全制程外发PCB」**\
            \ 等名称含外发、描述未写外发仍会入库。**铁律**节已给完整条件模板；若业务另有「虚拟外发料」固定代码表，在已文档化后再追加 **`NOT\
            \ IN (...)`**，**禁止**臆造代码列表。\n   - **实现要点**：涉及 **Data0017.QUAN_ON_HAND**、**Data0022**\
            \ 按仓、**Data0207** 经入仓明细回连仓库等场景，凡需限定「仅算物料」→ **仓到 `Data0016` 只能经 `Data0022.LOCATION_PTR`**（**禁止**\
            \ **`m.LOCATION_PTR`**，见文首硬约束 **`LOCATION_PTR` 归属**）；增加 **`WHERE (d16.IsHalfStock\
            \ IS NULL OR d16.IsHalfStock <> 1) AND (d16.IS_PROD_STORE IS NULL OR d16.IS_PROD_STORE\
            \ <> 1)`** 及已确认的外发排除条件；**同时**对 **Data0017** 施加上条 **名称/描述外发、外协** 过滤；**不得**把半成品仓、成品仓、外发口径的数据与原材料混在同一「物料总数」中，**不得**把名称含外发/外协的主数据当作实物物料参与排名。**优先级补充（必须执行）**：若当前\
            \ SQL 采用 **`d207.DEPT_PTR -> Data0034 dept -> Data0015 w`**（**领用路径 A**，须有\
            \ **`Data0207 d207`**）且 `FROM` 链**未**包含 **`Data0022 d22` + `Data0016 d16`**，则**禁止**追加任何\
            \ **`d16.IsHalfStock` / `d16.IS_PROD_STORE`** 条件；此时仅保留 **`cat.ttype`**\
            \ 与 **`m.INV_*` 外发/外协排除**。**禁止**把 **`m.DEPT_PTR`** 当作 **`d207.DEPT_PTR`**\
            \ 的替代（**`Data0017` 无 `DEPT_PTR`**）。需要仓维度排除时，必须先补齐 **`d22`（`m.RKEY = d22.INVENTORY_PTR`）→\
            \ `d16`**，或领用路径 **`d207 -> d22 -> d16`**，再写 `d16` 条件。\n   - **材料类别 `T`（外发成本）与\
            \ 1.6（联动）**：凡用户语义为 **材料 / 原材料 / 物料** 的 **数量、种类、领用、入库、出库、库存、占比、排名** 等统计（**不限金额**），凡\
            \ **`FROM Data0017`** → **必须**按 **1.6** **`JOIN Data0496`** 并排除 **`ttype\
            \ = N'T'`**，与上文 **名称关键字「外发/外协」**、**仓维度** 过滤 **并行生效**，**禁止**只做关键字排除却保留\
            \ **T** 类账内物料。\n   - **`Data0022` 上无 `IsHalfStock` / `IS_PROD_STORE`（必须执行，修复\
            \ 207）**：**`IsHalfStock`、`IS_PROD_STORE` 仅定义在 `Data0016`（仓库表）**，**`Data0022`（材料入库明细）没有这两列**。**严禁**以\
            \ **`d22.`** 或 **`Data0022.`** 为前缀引用上述两列（含任意大小写变体），否则会报 **`Invalid column\
            \ name 'IsHalfStock'`**。凡 **`FROM Data0022 d22`** 且要按 **1.5** 排除半成品仓/成品仓\
            \ → 必须增加 **`LEFT JOIN Data0016 d16 ON d22.LOCATION_PTR = d16.RKEY`**，条件一律用\
            \ **`d16.IsHalfStock` / `d16.IS_PROD_STORE`**（语义与 **实现要点** 中 **`d16`**\
            \ 前缀相同）；**禁止**把仓属性列臆造到 **`d22`** 上。\n   - **入库 TOP/汇总正例骨架（须模仿表关联，禁止抄错表）**：`Data0017\
            \ m` **`JOIN Data0022 d22`** … **`LEFT JOIN Data0016 d16 ON d22.LOCATION_PTR\
            \ = d16.RKEY`** … **`WHERE`** … **`AND (d16.IsHalfStock IS NULL OR d16.IsHalfStock\
            \ <> 1) AND (d16.IS_PROD_STORE IS NULL OR d16.IS_PROD_STORE <> 1)`**（别名可换，**`LOCATION_PTR`→`Data0016`\
            \ 不可省**）。\n   - **Data0207 → Data0016 推荐写法**：先 **`LEFT JOIN Data0022 d22\
            \ ON d207.D0022_PTR = d22.RKEY`**，再 **`LEFT JOIN Data0016 d16 ON d22.LOCATION_PTR\
            \ = d16.RKEY`**（`D0022_PTR` 为空时无仓维度，半成品/成品条件仍安全）；**禁止**写成 **`LEFT JOIN\
            \ Data0016 d16 ON … EXISTS (SELECT 1 FROM Data0022 …)`** 等畸形、难优化且易错关联。\n\
            \   - **`JOIN` 顺序与 `d22` 作用域（必须执行，修复 4104）**：T-SQL 中**后出现的表别名不能在先写的 `JOIN\
            \ … ON` 里引用**。从 **`Data0207 d207`** 到 **`Data0016 d16`** 必须**严格按上条顺序**：**先\
            \ `d22` 后 `d16`**。**禁止**写成 **`LEFT JOIN Data0016 d16 ON d207.D0022_PTR\
            \ = d22.RKEY` 再 `LEFT JOIN Data0022 d22 ON …`**（此时第一行 **`ON`** 引用 **`d22`**\
            \ → **4104 `d22.RKEY` could not be bound`**）。**禁止**用 **`d207.D0022_PTR\
            \ = d22.RKEY`** 去 **`JOIN Data0016`**（**`Data0016` 主键是 `d16.RKEY`**，与\
            \ **`D0022_PTR`** 对应的是 **`Data0022.RKEY`**，仓过滤必须经 **`d22.LOCATION_PTR`**）。\n\
            \   - 用户**明确要求**「含半成品 / 含成品 / 含外发」时 → 再按其要求放宽或单独分列，**默认**仍按本条排除。\n\n1.6\
            \ **材料类别 `T` = 外发成本：所有「材料」数据统计一律排除（必须执行）**\n   - **业务定义**：**`Data0496.ttype\
            \ = N'T'`** 表示 **外发成本**；**`P` / `M` / `N` 等非 `T`** 在本口径下视为 **「材料」**。凡用户语义涉及\
            \ **材料 / 原材料 / 物料** 的 **数量、种类、领用、入库、出库、库存、占比、排名、TOP N、金额、成本** 等 **任意统计**（**含纯用量**），**默认一律不得计入\
            \ `T` 类**——即 **外发成本类不参与「材料」合计**。\n   - **`GROUP_PTR`**：**`Data0017.GROUP_PTR\
            \ = Data0496.RKEY`**（材料类别表物理名 **`Data0496`**，见本文「数据库表结构说明」）。\n   - **实现（可执行模板）**：查询链凡包含\
            \ **`Data0017 m`** → **`LEFT JOIN Data0496 cat ON m.GROUP_PTR = cat.RKEY`**（别名\
            \ **`cat`/`d496`** 均可），并 **`WHERE (cat.ttype IS NULL OR cat.ttype <> N'T')`**。**`GROUP_PTR`\
            \ 为 NULL** 时仍保留该行（**`NULL OR <> N'T'`**），避免误杀无主类别物料；若业务规定「无类别即排除」，须在需求中另行说明后再收紧。\n\
