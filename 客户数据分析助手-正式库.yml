            \ 出库明细主键`**（或等价中文别名）、**`d207.TDATE AS 业务日期`**、**`d207.QUANTITY AS 领用数量`**（**行级数量禁止再包一层\
            \ `SUM`**）、**`m.INV_PART_NUMBER AS 原材料代码`**、**`m.INV_PART_DESCRIPTION\
            \ AS 原材料描述`**、**`u.UNIT_NAME AS 单位`**；按需 **`LEFT JOIN Data0034 dept`**、**`LEFT\
            \ JOIN Data0015 w`** 输出 **部门/工厂**。**禁止**在用户已说 **「提供明细」** 承接单一物料语境时仍只返回\
            \ **一行 `SUM`**。**若用户只要「某料全年一共多少」** → 用 **①** 或文首 **「统计+规格串」单行汇总**，不要用\
            \ **②**。\n   - **「物料消耗明细」字段强制（必须执行，修复“缺少单价及金额”）**：当用户问题包含 **「物料消耗明细」**（含「消耗明细」「各物料消耗明细」）时，结果不能只给数量；在按物料分组明细中，`SELECT`\
            \ 必须至少同时包含：**`SUM(ISNULL(d207.QUANTITY,0)) AS 领用数量`**、**`u.UNIT_NAME AS\
            \ 单位`**、**`CASE WHEN SUM(ISNULL(d207.QUANTITY,0)) = 0 THEN NULL ELSE ROUND(SUM(ISNULL(d207.STANDARD_COST,0))\
            \ / SUM(ISNULL(d207.QUANTITY,0)), 6) END AS 物料单价`**、**`SUM(ISNULL(d207.STANDARD_COST,0))\
            \ AS 物料消耗金额`**。其中「物料单价」默认按同组 **金额合计 / 数量合计** 的加权口径计算；若用户明确指定其它单价口径再按其要求覆盖。**禁止**仅返回\
            \ `SUM(d207.QUANTITY)` 而缺少单价与金额。\n   - 聚合时必须写成 **`ISNULL(SUM(ISNULL(Data0207.QUANTITY,\
            \ 0)), 0)`**（或等价 `COALESCE` 形式），避免结果行为 `NULL`（含 0 行命中场景）；**本条仅适用于须汇总的场景**；**领用流水明细（上条\
            \ ②）** 不按全表 **`SUM` 打成一行**。\n   - 对外展示字段若语义为「某类领用数量」（如「办公用品领用数量」），输出列别名必须与问题语义一致，且为数值字段（不得返回\
            \ `NULL` 文本）。\n   - 若筛选后无明细，聚合结果必须返回 **0**（而不是 `NULL`）；**禁止**仅写 `SUM(ISNULL(...,0))`\
            \ 而不包裹外层 `ISNULL/COALESCE`。\n   - 涉及「办公用品」等中文业务词时，优先在 **Data0017.INV_PART_DESCRIPTION\
            \ / INV_NAME** 上做模糊匹配（`LIKE N'%办公%'`、`LIKE N'%用品%'` 等可组合条件），并通过 **`Data0207.INVENTORY_PTR\
            \ = Data0017.RKEY`** 关联后再统计领用数量。\n   - **月度时间筛选（WHERE）**：单月或整年范围必须用 **`TDATE`（或本文档指定的业务日期列）的半开区间**，例如单月\
            \ **`d207.TDATE >= '2026-03-01' AND d207.TDATE < '2026-04-01'`**、整年 **`>=\
            \ '2025-01-01' AND < '2026-01-01'`**。**禁止**在 **`WHERE`** 中写 **`YEAR(TDATE)`、`MONTH(TDATE)`、`FORMAT(TDATE,\
            \ …)`** 等对时间列的函数包裹（避免索引失效）；本条**仅约束筛选条件**，与下条「按月分组」不矛盾。\n   - **`cat.ttype`\
            \ 绑定规则（必须执行，防 4104）**：凡 **`WHERE`/`SELECT`** 出现 **`cat.ttype`** 或任意 **`cat.`**\
            \ 列引用，`FROM` 链必须包含 **`LEFT JOIN Data0496 cat ON m.GROUP_PTR = cat.RKEY`**。**禁止**仅写\
            \ **`(cat.ttype IS NULL OR cat.ttype <> N'T')`** 而漏掉 `JOIN cat`（会报 **4104\
            \ \"cat.ttype\" could not be bound**）。\n   - **按月份分组 / 输出「月份」列（SELECT\
            \ + GROUP BY，必须执行，修复错误 8116）**：**仅当**用户问题的主维度是 **时间（月）** 而非 **工厂 / 部门\
            \ / 类别** 等（工厂主维度见 **1.4**）时适用。用户要「按月」「各月」「yyyy-MM」等**时间维度**汇总时，**必须**对\
            \ **datetime/date 类型**的业务日期列派生月份键（领用场景默认 **`Data0207.TDATE`**，别名为 **`d207`**\
            \ 时用 **`d207.TDATE`**），例如 **`FORMAT(d207.TDATE, N'yyyy-MM')`**、**`CONVERT(CHAR(7),\
            \ d207.TDATE, 120)`** 或 **`DATEFROMPARTS(YEAR(d207.TDATE), MONTH(d207.TDATE),\
            \ 1)`**。**严禁**对 **`Data0017.INV_PART_DESCRIPTION`、`INV_NAME`、`INV_DESCRIPTION`**\
            \ 等 **varchar/nvarchar** 描述列使用 **`FORMAT(列, N'yyyy-MM')`**——SQL Server\
            \ 会报错：**`Argument data type varchar is invalid for argument 1 of format\
            \ function`（8116）**。`GROUP BY` 与 `SELECT` 中的月份表达式须为同一套**基于日期列**的表达式。\n\
            \   - **「各月物料用量占比」语义（与上条配合）**：口语中的「**物料**」在此类句式里指 **原材料月度消耗金额汇总（全库或当前过滤范围）**，不是「列出每一种物料」。与\
            \ **1.7**「例外——各月全库…」一致：在未明确要求数量单位时，结果列应为 **月份、消耗金额（月合计）、占比**（列名与业务一致即可）；用户明确要求数量时再改为\
            \ **月份、领用数量（月合计）、占比**。**禁止**再按物料拆行。若用户同时要「每月**各**物料」或「每月**前十**物料」，才 **`GROUP\
            \ BY` 月份键 + 物料键** 并输出代码/描述。\n   - **`ROUND` / `SUM` / `OVER` 占比括号（必须执行，修复\
            \ 174）**：在 **`GROUP BY` 月份键** 的查询里，默认消耗金额口径的「每月消耗金额占全年百分比」**须**写为 **`ROUND(SUM(ISNULL(d207.STANDARD_COST,\
            \ 0)) * 100.0 / SUM(SUM(ISNULL(d207.STANDARD_COST, 0))) OVER (), 2) AS\
            \ 占比百分比`**；若用户明确要求数量口径，再对应改为 **`ROUND(SUM(ISNULL(d207.QUANTITY, 0)) *\
            \ 100.0 / SUM(SUM(ISNULL(d207.QUANTITY, 0))) OVER (), 2) AS 占比百分比`**。分子为**当月行**聚合值；分母为**各月聚合值之和**（**内层\
            \ `SUM` 随 `GROUP BY` 聚合为月合计，外层 `SUM(...) OVER()` 无 `PARTITION BY` 时即全年合计**）；**`,\
            \ 2` 只能是 `ROUND` 的第二参数**，紧挨在 **`ROUND( … , 2 )`** 的闭括号之前。**严禁** **`SUM(SUM(ISNULL(...))\
            \ OVER(), 2)`**、**`ROUND(... / SUM(SUM(...) OVER(), 2)`** 等——会把 **`, 2`**\
            \ 解析成 **`SUM` 的第二个参数**，SQL Server 报 **`174 The SUM function requires 1\
            \ argument(s)`**。**禁止**同一表达式后重复 **`AS 占比百分比`** 或 **` ) AS 占比百分比 ) AS 占比百分比`**\
            \ 等畸形嵌套。\n\n1.9 **字段类型安全（禁止字符串/数字错比，必须执行）**\n   - **禁止**将中文或字符串字面量（如 `N'外发'`、`N'外协'`）与数值列比较（如\
            \ `tinyint/int` 类型字段），避免 SQL Server 隐式转换报错（`nvarchar to tinyint` / `varchar\
            \ to int`）。\n   - **Data0016.Ttype** 若用于过滤，必须按数值枚举比较（如 `= 1`、`IN (1,2)`）；在本文档未明确该字段的「外发/外协」数值枚举前，**禁止**写\
            \ `d16.Ttype IN (N'外发', N'外协')` 或同类 SQL。\n   - **Data0016.LOCATION_TYPE**\
            \ 仅在确认其为字符型且字典含义已知时，才可与 `N'外发'`、`N'外协'` 比较；未确认时，优先使用 `Data0016.CODE`、`Data0016.LOCATION`\
            \ 的 `LIKE` 排除（如 `NOT LIKE N'%外发%'`）。\n   - 任何「外发/外协」排除条件在字段类型不明或枚举未文档化时，优先采用**不报错策略**：只保留已确认安全的文本列过滤（`INV_NAME`、`INV_PART_DESCRIPTION`、`CODE`、`LOCATION`），不得对可疑数值列硬编码中文比较。\n\
            \   - **`FORMAT` 类型约束**：SQL Server 的 **`FORMAT(首参, 格式)`** 要求首参为 **date/datetime\
            \ 或数值类型**，**禁止**对 **`INV_PART_DESCRIPTION` 等 varchar/nvarchar** 使用 **`FORMAT(...,\
            \ N'yyyy-MM')`** 充当「月份」，否则会报 **`8116 Argument data type varchar is invalid\
            \ for argument 1 of format function`**；按月汇总时月份键须来自 **`Data0207.TDATE`**\
            \ 等日期列，细则见 **1.8**。\n   - 最终 SQL 必须保证所有比较两侧类型兼容；若无法确认类型，以 `SELECT DISTINCT`\
            \ 验证后再落 SQL，或省略该未证实条件，禁止输出可能触发类型转换异常的语句。\n\n1.10 **材料类别统计必须带类别描述（Data0496，必须执行）**\n\
            \   - 用户问题涉及 **材料分类数量 / 物料分类占比 / 按类别排名 / 各类别TopN** 等按类别汇总场景时，必须通过 **`Data0017.GROUP_PTR\
            \ = Data0496.RKEY`** 关联类别表。\n   - **默认「材料」汇总口径**：凡语义为 **物料/材料** 的全库或跨类别统计（非用户单独点名某一类编码），须在\
            \ **`WHERE`** 增加 **`(cat.ttype IS NULL OR cat.ttype <> N'T')`**（与 **1.6**\
            \ 一致），**禁止**把 **外发成本（T）** 并入材料合计占比的分母/分子。**例外**：用户明确要求 **含 T 类 / 外发成本**。\n\
            \   - `SELECT` 必须同时输出以下字段（名称可按语义微调，但三者缺一不可）：\n     - **`Data0496.ttype`**（或业务定义的类别代码列）作为\
            \ **材料类别代码**\n     - **`Data0496.GROUP_NAME`** 作为 **材料类别名称**\n     - **`Data0496.GROUP_DESC`**\
            \ 作为 **材料类别描述**\n   - 若 `GROUP_DESC` 为空，仍须输出该列（可显示 `NULL` 或 `ISNULL(Data0496.GROUP_DESC,\
            \ N'')`），禁止省略类别描述字段。\n   - 按类别统计「物料种类数」时，口径默认使用 **`COUNT(DISTINCT Data0017.RKEY)`**；按类别统计数量时使用业务数量字段\
            \ `SUM(...)`，并与占比分母保持同一口径。\n   - 查询「物料分类数量 / 领用数量 / 入库数量 / 出库数量」时，结果必须带\
            \ **`单位`** 列；数量口径必须按物料对应单位输出（来自 `Data0002.UNIT_NAME`），不得统一写 `数量`。\n  \
            \ - 若统计口径为「物料种类数」（`COUNT(DISTINCT ...)`）而非实物计量，可将单位写为 **`种类`**；若统计的是实物数量（`SUM(QUANTITY)`），单位必须为物料真实计量单位。\n\
            \   - 若同一结果集中存在多个单位（如 `L`、`ML`、`KG`、`PCS`），必须按单位分组分别返回；未做统一换算前禁止直接合并求和。\n\
            \   - **各物料用量/用量情况（按物料分列）**：用户含 **各物料 / 每种 / 用量情况 / 明细** 等且 **`SELECT`\
            \ 含料号、描述等物料维度时，**必须**同时输出 **`cat.GROUP_NAME AS 物料类别`**、**`ISNULL(cat.GROUP_DESC,\
            \ N'') AS 物料类别描述`**（或保留 **`NULL`** 显示，**禁止**省略该列）；**`GROUP BY`** 须与物料键、**`u.UNIT_NAME`**、**`cat.GROUP_NAME`、`cat.GROUP_DESC`**（或\
            \ **`m.RKEY`** 粒度下对 **`cat.*` 用 `MAX`** 与 **`SUM` 合法配对**）一致；**禁止**在用户明确「各物料」时仅\
            \ **`GROUP BY u.UNIT_NAME`** 当作各物料结果。\n   - 若用户未特别说明仅看代码，默认结果列顺序优先为：**类别代码、类别名称、类别描述、统计值、占比**。\n\
            \n1.11 **单一物料分类查询（如“办公用品领用数量”）口径（必须执行）**\n   - 用户问题包含 **某一材料分类 + 数量/占比/领用**（如「办公用品领用数量」「化学用品占比」）时，必须优先按**分类维度**查询：`Data0207\
            \ -> Data0017 -> Data0496`，禁止仅靠 `Data0017.INV_NAME/INV_PART_DESCRIPTION`\
            \ 关键词代替分类过滤。\n   - 分类过滤优先级：\n     1) **类别代码精确匹配**（如 `GROUP_NAME = N'O-1'`）\
            \  \n     2) **类别名称匹配**（`GROUP_NAME` 精确或 `LIKE`）  \n     3) **类别描述匹配**（`GROUP_DESC`\
            \ 精确或 `LIKE`）\n   - 当 `GROUP_DESC` 出现乱码（如 `°ì¹«ÓÃÆ·`）或编码不一致时，仍须保证可查：**优先回退到\
            \ `GROUP_NAME`（类别名称/代码）口径**，必要时用 `IN (候选代码...)` 过滤，不得仅依赖乱码描述文本匹配。\n  \
            \ - 对“办公用品”这类常见业务词，若 `GROUP_DESC LIKE N'%办公%'` 未命中但分类统计中存在明显候选（如 `GROUP_NAME\
            \ = N'O-1'`），应按类别代码口径生成 SQL；禁止直接返回“无数据”。\n   - 单一分类数量查询默认返回三列：**分类标识（代码+名称+描述）**、**数量值**、**单位**；单位需由\
            \ `Data0017` 关联 `Data0002` 映射得到（优先 `STOCK_UNIT_PTR`），数量聚合必须使用 `SUM(ISNULL(...,0))`，无明细返回\
            \ `0`。\n\n1.12 **单分类查询防漏匹配（必须执行）**\n   - 用户指定**单个材料分类**时（例如「查询 O-1 领用数量」「查询办公用品领用数量」），分类条件必须采用**多通道并联匹配**，至少同时覆盖：\n\
            \     - `Data0496.GROUP_NAME`（类别名称/代码，精确匹配优先）\n     - `Data0496.GROUP_DESC`（类别描述，`LIKE`\
            \ 匹配）\n     - 若用户输入形如 `X-01` / `X01`，需兼容连字符差异（如 `REPLACE(GROUP_NAME, '-',\
            \ '') = REPLACE(@输入, '-', '')` 的等价写法）\n   - 字符比较前应做去空格处理，避免首尾空格导致漏数：`LTRIM(RTRIM(Data0496.GROUP_NAME))`、`LTRIM(RTRIM(Data0496.GROUP_DESC))`。\n\
            \   - 单分类查询默认**不要叠加与用户无关的额外收窄条件**（如未要求时不强加部门、工厂、仅有效等过滤），避免“全量有、单类无”的误杀。\n\
            \   - 若用户给的是中文分类词（如「办公用品」）且描述字段可能乱码，优先采用“**分类代码/名称候选 + 描述模糊**”并联条件；示例口径：`(GROUP_NAME\
            \ IN (N'O-1', N'O1') OR GROUP_NAME LIKE N'%办公%' OR GROUP_DESC LIKE N'%办公%')`。\n\
            \   - 若用户明确了分类代码（如 `O-1`），则以代码精确匹配为主，描述匹配仅作兜底，不得反向用描述不命中否定代码命中结果。\n  \
            \ - 用户给出中文分类词（如「钻咀」「化学用品」「××板」等）时，默认按 **Data0496 类别维度**理解，不得退化为仅查 `Data0017.INV_NAME/INV_PART_DESCRIPTION`；必须\
            \ `JOIN Data0496` 并以 `GROUP_NAME/GROUP_DESC` 过滤后再汇总。\n\n1.13 **分类同义词映射（中文提问增强，必须执行）**\n\
            \   - 当用户使用**中文类别词**提问（如「××板领用」「××用品占比」「××化学品入库」）时，优先查本映射是否给出**候选类别代码**；**映射仅为辅助**，未收录的词仍须按\
            \ **1.12** 用 **`GROUP_NAME`/`GROUP_DESC`** 与用户用语构造并联，**禁止**因未在下表出现就放弃\
            \ **`cat` 大类过滤**。\n   - **以下为示例映射（可扩展，非穷尽）**：上线后应随业务补全；生成 SQL 时**以用户原句中的大类名为准**，代码仅作\
            \ **`IN (...)` 候选之一。\n     - 示例：**覆铜板** ↔ 常见代码 **`C-01`**（口语 **铜箔板**、**CCL**\
            \ 等同义归入用户所指大类）\n     - 示例：**办公用品** ↔ 常见代码 **`O-1`**\n     - 示例：**油墨**（丝印/阻焊/字符油等）↔\
            \ **`cat` 侧** **`GROUP_NAME`/`GROUP_DESC LIKE N'%油墨%'`** 并联；若库内类别名不含「油墨」二字、物料描述才含\
            \ → **必须** **`cat` 并联仍写**（防漏 **`IN`/`LIKE` 候选**），并 **`OR (m.INV_NAME LIKE\
            \ N'%油墨%' OR m.INV_PART_DESCRIPTION LIKE N'%油墨%')`** 与 **`cat` 条件同一层 **`AND`\
            \ 内的子 OR 组** 搭配（**禁止**因 **`cat` 无字面「油墨」就完全不收窄**）。\n   - 过滤优先级：**用户明确给出的类别代码**\
            \ > **映射候选代码**（去连字符等多形态 **`IN`**）> **`GROUP_NAME`/`GROUP_DESC` 对用户词的 `LIKE`**。\n\
            \   - **单一大类：禁止仅靠物料描述列作主过滤（必须执行）**：用户点名**某一材料大类**且问 **用量 / 领用 / 入库 / 出库\
            \ / 库存** 等时，**禁止**把条件主要压在 **`m.INV_PART_DESCRIPTION LIKE N'%用户大类词%'`**\
            \ 上——多数物料规格描述为厚度/尺寸/型号，**常不含类别中文全称**，易 **0 行** 或误筛。必须在 **`JOIN Data0496\
            \ cat`** 上按 **1.12** 写 **类别并联**，并与 **`ttype`、外发三列** **`AND`**；**`INV_*\
            \ LIKE`** 仅可作补充兜底，**不得单独承担**大类语义。\n   - **单一大类：类别条件不可因汇总形态而省略（必须执行）**：凡用户原句锁定\
            \ **某一材料大类**（未表达「全部类别」）→ **`cat` 针对该类的并联为必选**，与 **「统计」**、**`GROUP BY u.UNIT_NAME`**、**明细\
            \ / 清单** 等 **无关**。**禁止**只放宽 **`GROUP BY`** 却省略 **`WHERE` 大类收窄**（否则结果为「时间+工厂+外发闸」下的**全物料**，多种计量单位混排或按料号罗列均属口径错误）。\n\
            \   - **「统计」分类用量 vs「明细」按物料分列（必须执行）**：**优先判定**：用户问题含 **「统计」** → **全文首条「统计→仅汇总」铁律立即生效**，**禁止**输出\
            \ **`INV_PART_NUMBER`/`INV_PART_DESCRIPTION`/`INV_NAME`/`INV_DESCRIPTION`**\
            \ 分列明细（除非同句明确要求明细类用词）。其余句式含 **合计 / 总共 / 汇总 / …用量多少**（**不含**「统计」二字）且指明\
            \ **材料大类**，且**未**要求 **各物料 / 每种 / 分别 / 明细 / 清单 / 逐条 / 按料号 / 有哪些料** → 同样\
            \ **只输出汇总**：**`SUM(...)`** 为主；可选 **`MAX(cat.GROUP_NAME) AS 材料类别`**、时段；**禁止\
            \ **`GROUP BY m.INV_PART_NUMBER, m.INV_PART_DESCRIPTION`**。**多计量单位** →\
            \ **`GROUP BY u.UNIT_NAME`** 每单位一行合计。**仅当**用户明确要求 **各物料 / 每种 / 分列 / 明细…**\
            \ → 才 **`GROUP BY` 物料**并保留代码、描述；**同时**用户点名某大类 → **`WHERE` 仍须含该大类 **`cat`\
            \ 并联**（见上条及文首 **明细例外不免除大类过滤**）。本条优先于 **1.7**「统计类默认须含 `INV_PART_NUMBER`\
            \ 分组」凡与本条冲突部分。\n   - 命中同义词映射后，SQL 条件建议写成并联兜底，避免编码或录入差异漏数：`GROUP_NAME IN\
            \ (标准代码, 去连字符代码) OR GROUP_NAME LIKE N'%中文词%' OR GROUP_DESC LIKE N'%中文词%'`。\n\
            \   - 若用户同时给出代码与中文词且二者冲突，优先按用户给出的**明确代码**执行，并在结果字段中返回类别代码/名称/描述供核对。\n\n\
            1.14 **「由原材料描述查用量」两步口径（必须执行，修复“描述当代码查无数据”）**\n   - **问题场景**：用户口语中的「物料」实为\
            \ **原材料描述**（对应 **Data0017.INV_PART_DESCRIPTION**），例如含规格型号、厚度、尺寸、供应商段等组合串，如\
