    - data:
        code: "# Dify 代码节点：查询结果为 JSON 数组字符串时，超过 50 条只保留前 50 条。\n#\n# 输入变量（类型选「文本 /\
          \ string」）：data 或 arg1 — 查询结果的 JSON 数组字符串（可带 ```json 代码块）；≤50 条时原样写入 data_first_50\n\
          # 输出变量（与 return 的键名一致）：\n#   - exceeds_50 — string，值为 \"true\" 或 \"false\"\
          \n#   - data_first_50 — string（JSON 数组字符串，最多 50 条）\n\nfrom __future__ import\
          \ annotations\n\nimport json\nfrom typing import Any, Dict, List\n\n\ndef\
          \ _parse_data(raw: Any) -> List[Any]:\n    if raw is None:\n        return\
          \ []\n    if isinstance(raw, list):\n        return raw\n    if isinstance(raw,\
          \ str):\n        text = raw.strip()\n        if not text:\n            return\
          \ []\n        if text.startswith(\"```\"):\n            lines = text.split(\"\
          \\n\")\n            if lines and lines[0].startswith(\"```\"):\n       \
          \         lines = lines[1:]\n            if lines and lines[-1].strip()\
          \ == \"```\":\n                lines = lines[:-1]\n            text = \"\
          \\n\".join(lines).strip()\n        try:\n            parsed = json.loads(text)\n\
          \        except json.JSONDecodeError:\n            return []\n        if\
          \ isinstance(parsed, list):\n            return parsed\n        if isinstance(parsed,\
          \ dict):\n            for key in (\"data\", \"records\", \"rows\", \"list\"\
          , \"items\", \"result\"):\n                v = parsed.get(key)\n       \
          \         if isinstance(v, list):\n                    return v\n      \
          \  return []\n    return []\n\n\ndef _resolve_raw(data: Any, kwargs: Dict[str,\
          \ Any]) -> Any:\n    if data is not None:\n        return data\n    for\
          \ key in (\"data\", \"arg1\"):\n        v = kwargs.get(key)\n        if\
          \ v is not None:\n            return v\n    return None\n\n\ndef main(data:\
          \ Any = None, **kwargs: Any) -> Dict[str, Any]:\n    \"\"\"\n    Dify 入口：输入变量名可用\
          \ `data` 或 `arg1`；输出键名与 Dify「输出变量」一致。\n    条数 ≤50 时 exceeds_50 为 \"false\"\
          ，data_first_50 仍为完整数据的 JSON 数组字符串。\n    \"\"\"\n    raw = _resolve_raw(data,\
          \ kwargs)\n    items = _parse_data(raw)\n    n = len(items)\n    over =\
          \ n > 50\n    sliced = items[:50]\n    return {\n        \"exceeds_50\"\
          : \"true\" if over else \"false\",\n        \"data_first_50\": json.dumps(sliced,\
          \ ensure_ascii=False),\n    }"
        code_language: python3
