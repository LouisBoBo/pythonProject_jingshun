    - data:
        code: "\nimport re\n\n\ndef extract_executable_sql(input_text) -> str:\n \
          \   \"\"\"\n    从任意文本中提取可执行的纯 SQL 语句（尽量不返回解释文字）。\n\n    提取策略：\n    1) 优先提取\
          \ Markdown 代码块里的 SQL：```sql ... ``` 或 ``` ... ```\n    2) 若没有代码块，则从 SQL\
          \ 关键字开始进行分段，优先截到分号结束\n    3) 输出：所有 SQL 按段用空行拼接成一个字符串\n    \"\"\"\n\n   \
          \ if input_text is None:\n        return \"\"\n\n    # Dify 里有时 arg1 可能不是纯字符串（例如传进来是\
          \ dict/对象）\n    if not isinstance(input_text, str):\n        if isinstance(input_text,\
          \ dict):\n            for k in (\"input_text\", \"text\", \"content\", \"\
          arg1\", \"value\"):\n                v = input_text.get(k)\n           \
          \     if isinstance(v, str) and v.strip():\n                    input_text\
          \ = v\n                    break\n        if not isinstance(input_text,\
          \ str):\n            input_text = str(input_text)\n\n    if not input_text:\n\
          \        return \"\"\n\n    # 兼容：有些链路会把换行写成字面量 \"\\\\n\"\n    text = (\n\
          \        input_text.replace(\"\\\\r\\\\n\", \"\\n\")\n        .replace(\"\
          \\\\n\", \"\\n\")\n        .replace(\"\\\\t\", \"\\t\")\n    )\n\n    #\
          \ 1) 提取所有代码块里的 SQL\n    fence_re = re.compile(r\"```(?:sql)?\\s*([\\s\\\
          S]*?)```\", re.IGNORECASE)\n    sql_blocks = [m.group(1).strip() for m in\
          \ fence_re.finditer(text)]\n    sql_blocks = [s for s in sql_blocks if s]\n\
          \    if sql_blocks:\n        return \"\\n\\n\".join(sql_blocks)\n\n    #\
          \ 2) 兜底：基于 SQL 关键字起点分段，并优先截到分号\n    start_word_re = re.compile(\n      \
          \  r\"\\b(SELECT|INSERT|UPDATE|DELETE|WITH|CREATE|ALTER|DROP|TRUNCATE|MERGE)\\\
          b\",\n        re.IGNORECASE,\n    )\n    starts = [m.start() for m in start_word_re.finditer(text)]\n\
          \    if not starts:\n        return \"\"\n\n    # 过滤用：避免截到一段明显不是 SQL 的文本\n\
          \    likely_sql_re = re.compile(\n        r\"\\b(SELECT|INSERT|UPDATE|DELETE|FROM|WHERE|JOIN|GROUP\\\
          s+BY|ORDER\\s+BY|VALUES)\\b\",\n        re.IGNORECASE,\n    )\n\n    sqls:\
          \ list[str] = []\n    for i, start in enumerate(starts):\n        end =\
          \ starts[i + 1] if i + 1 < len(starts) else len(text)\n        chunk = text[start:end].strip()\n\
          \        if not chunk:\n            continue\n\n        last_semi = chunk.rfind(\"\
          ;\")\n        if last_semi != -1:\n            chunk = chunk[: last_semi\
          \ + 1].strip()\n\n        if chunk and likely_sql_re.search(chunk):\n  \
          \          sqls.append(chunk)\n\n    return \"\\n\\n\".join(sqls) if sqls\
          \ else \"\"\n\n\ndef main(arg1: str) -> dict:\n    \"\"\"\n    Dify 代码节点入口（Python）。\n\
          \n    约定：\n    - arg1：输入的任意文本（可能包含 ```sql ... ``` 或普通描述混杂 SQL）\n    - 返回值：dict，包含可执行\
          \ SQL 字段 `sql`\n    \"\"\"\n\n    sql_text = extract_executable_sql(arg1)\n\
          \    # 只保留 Dify 侧需要的输出字段名：result\n    return {\"result\": sql_text}\n"
