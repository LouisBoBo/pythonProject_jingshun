            \ / `INV_PART_DESCRIPTION` / `INV_DESCRIPTION` 外发外协关键字排除**、**半成品仓/成品仓**、**仓维度外发**\
            \ 等过滤 **须同时生效**；**不得**只依赖 **`ttype`** 而放过描述里写满外发的行，也**不得**只做 **`NOT LIKE`**\
            \ 而放过 **`ttype = N'T'`**。\n   - **例外**：用户**明确要求** **含外发成本 / 含 T 类 / 单独看外发类别**\
            \ 时 → 可取消 **`ttype <> N'T'`** 条件，或 **单独分列** 展示 **T** 与非 **T**。\n   - **禁止**：臆造类别表名或未文档化列名；本文已列出\
            \ **`Data0496.ttype`**，生成 SQL **须使用真实表名与列名**，**禁止** `DataXXXX` 占位。\n\n\
            1.7 **物料查询展示：仅显示代码与描述（必须执行）**\n   - 用户以 **长规格串、原材料描述** 提问用量/入库/领用时，主数据定位规则见\
            \ **1.14**（先 **INV_PART_DESCRIPTION** 等再关联事实表）；本条规定输出列格式。\n   - 用户问题涉及\
            \ **查物料 / 列出物料 / 物料明细 / 按物料汇总或排名** 等，且 SQL **关联 Data0017（原材料明细）** 并返回物料识别信息时\
            \ → **`SELECT` 必须显式包含以下两列**：\n    - **`INV_PART_NUMBER` AS 原材料代码**\n \
            \   - **`INV_PART_DESCRIPTION` AS 原材料描述**（允许库内为 `NULL`，列仍须输出）\n   - 查询**物料明细**时，结果中必须新增\
            \ **`单位`** 字段：当结果口径为金额（如成本、库存金额、领用金额）时输出 **`单位 = N'金额'`**；当结果口径为数量（如入库数量、出库数量、库存数量）时，必须按物料主数据映射输出真实单位（如油类显示\
            \ `ML/L`，不得固定写 `数量`）。\n   - 数量口径取单位时，优先按 **`Data0017.STOCK_UNIT_PTR =\
            \ Data0002.RKEY`** 关联并输出 **`Data0002.UNIT_NAME`**；若为采购口径可改用 **`Data0017.PURCH_UNIT_PTR\
            \ = Data0002.RKEY`**。\n   - **`单位` 只能是库表计量单位（必须执行，防「KM」等误判）**：**`单位`**\
            \ 列**必须**来自 **`Data0002.UNIT_NAME`**（经 **`JOIN`** **`STOCK_UNIT_PTR`**\
