            \ **`SUM(…)` / 等价聚合** 作为主度量（如 **`AS 领用数量合计`**、**`入库数量合计`**）。\n2. **`GROUP\
            \ BY` 禁止含 **`m.INV_PART_NUMBER`、`m.INV_PART_DESCRIPTION`、`m.RKEY`**；仅允许\
            \ **`GROUP BY u.UNIT_NAME`**（多计量单位时每单位一行合计）、或在单一单位下 **不写物料维度分组**。\n3.\
            \ **禁止 **`TOP`、`FETCH FIRST`** 截断**（除非用户同句明确要求前几名；见下条 **铁律补充**）。\n4. **输出前自检**：若用户问题含「统计」且无明细类用词\
            \ → 最终 SQL 若出现 **`GROUP BY … INV_PART_NUMBER`**（多行按料分列）→ **不合格**；若出现 **`INV_PART_NUMBER\
            \ AS`** 且**非** **`MAX`/`MIN` 聚合包装**（即把物料列当分组键输出多行）→ **不合格**。**「统计 + 整段规格串\
            \ / 原材料规格短牌号」例外**（见上，短牌号见 **1.14** 第一步 **0)**）→ **允许** **`MAX(m.INV_PART_NUMBER)\
            \ AS 原材料代码`** 等 **单行汇总**。\n5. **「统计某类」≠「统计全物料」（必须执行）**：用户原句若点名 **某一材料大类**（任意中文类别词、类别代码，或\
            \ **1.13** 可映射词），则 **`WHERE` 必须与「问该类明细」同样收窄到该类**：在已有 **`JOIN Data0496\
            \ cat`** 上按 **1.12** 写 **多通道并联**（**`GROUP_NAME`/`GROUP_DESC`**、去连字符、`LIKE`\
            \ 用户词等）。**禁止**只写 **时间 + 工厂 + 外发闸** 却**不写针对该大类的类别条件**，再 **`GROUP BY u.UNIT_NAME`**——否则会变为「该厂该时段**全部物料**按计量单位汇总」。**汇总形态只禁止物料分列，不禁止类别过滤**。\n\
            \n**例外**：用户同句明确要求 **明细 / 各物料 / …**（上列词之一）→ 允许 **`GROUP BY` 物料**并输出代码、描述；若同时含「统计」但明确要求明细，以\
            \ **明细分列** 为准。**明细例外不免除大类过滤（必须执行）**：原句仍点名 **某一材料大类**时 → **`WHERE` 必须与「不问明细」时一致**，写入\
            \ **`Data0496 cat` 类别并联**（**1.12**）。**禁止**仅因触发「明细」就 **`GROUP BY m.INV_PART_NUMBER`**\
            \ 却**不写该类别的 `cat` 条件** → 否则等价于「事业部该时段**全部物料**按料号汇总」，与用户点名的**大类语义**不符。\n\
            \n**例外——「统计 + 整段规格串 / 规格短牌号」点名单一物料（必须执行）**：用户问 **统计…用量 / …年用量** 等且用 **整段规格描述**（**1.14**\
            \ 规格组合特征，如含 **`/`**、**`*`**、**`MM`**、**`um`**）**或**以 **「原材料规格 / 规格 / 牌号」+\
            \ 短型号**（如 **`KB-6160`**，该串**拼接在** **`INV_PART_DESCRIPTION`/`INV_DESCRIPTION`**\
            \ 的 **`|`** 分段中，见 **1.14** 第一步 **0)**）锁定 **单一物料** → **优先于本条第 1、2 点对「禁写\
            \ INV_* 列」的一般约束**：**允许且必须**在 **单行汇总** 结果中同时输出 **`SUM(ISNULL(d207.QUANTITY,\
            \ 0)) AS 领用数量`**（口径见 **1.8**）与 **`MAX(m.INV_PART_NUMBER) AS 原材料代码`**、**`MAX(m.INV_PART_DESCRIPTION)\
            \ AS 原材料描述`**（按需 **`LEFT JOIN Data0002 u`** **`MAX(u.UNIT_NAME) AS 单位`**），以区分\
            \ **「主数据未命中」** 与 **「命中但区间内无领用（数量为 0）」**；**禁止**仅 **`SELECT SUM(...)`**\
            \ 无物料参照。**关联 `Data0207`/`Data0022` 须 `LEFT JOIN`，日期写在 `JOIN … ON`**（详见\
            \ **1.14** 专条）。**仍禁止**在仅「统计用量」且无 **逐笔/明细清单/提供明细/领用流水/每一笔** 等词时把 **`Data0207`**\
            \ 展开为多行；用户一旦明确要求前述用词 → **须按 1.8「领用流水明细」** 输出 **`Data0207` 行级多行**，**禁止**仅用\
            \ **`SUM` 单行**冒充「全部明细」。\n\n## 铁律补充：`TOP N` 仅限用户明确要求「前几名 / TOP」\n\n**禁止无前提写\
            \ `TOP 10`**：本文凡出现 **`SELECT TOP (N)`**，**`TOP` 均在 `SELECT` 与列名之间**，**`ORDER\
            \ BY` 只在全句末尾**；**不得**在用户只说 **统计…用量 / 某大类用量 / 某类物料用量**（**未**说 **前十、TOP、前几名、只看10条**）时照搬\
            \ **`TOP`**。**用户问题含「统计」且无明细词** → **一并遵守上文「统计→仅汇总」铁律**，**禁止 TOP**。\n\n\
            **规则**：**仅当**用户明确 **前十 / TOP10 / TOP N / 排名前N / 只要几条** → 才使用 **`SELECT\
            \ TOP (N)`**（**`N` 与用户数字一致**）。用户要 **各物料/分列明细** 且未要求 TOP → **`SELECT` 不带\
            \ `TOP`**，返回全部物料行（见 **1.13**）。\n\n**SQL Server 语法铁律（防 156，必须执行）**：**禁止**写成\
            \ **`ORDER BY … DESC TOP 10`**、**`ORDER BY` 子句末尾再写 `TOP (N)`** 或把 **`TOP`**\
            \ 放在 **`GROUP BY`/`HAVING` 之后**模仿 MySQL 的 **`LIMIT`**——会触发 **`(156) Incorrect\
            \ syntax near the keyword 'TOP'`**。**`TOP (N)` 只允许紧跟在 **`SELECT` 之后**：**`SELECT\
            \ TOP (10) … FROM … [WHERE …] [GROUP BY …] ORDER BY …`**。若需「先排序再取前 N 行」且\
            \ **`SELECT` 已含聚合**，仍用外层 **`SELECT TOP (N) … FROM (子查询) AS t ORDER BY\
            \ …`** 等合法嵌套，**不得**在最外层 **`ORDER BY` 后追加 `TOP`**。**禁止**在 **`WHERE` 子句结束之后**再写\
            \ **`JOIN`/`LEFT JOIN`**（否则常报 **`(156) Incorrect syntax near the keyword\
            \ 'LEFT'`**）；**凡 `WHERE` 中出现 `w.` 前缀，必须先于 `WHERE` 完成 `JOIN Data0015 w`**。\n\
            \n**SQL Server 列别名铁律（防 102，必须执行）**：**`AS` 后的中文（或其它）列名若以阿拉伯数字开头**，例如 **`AS\
            \ 2024年入库数量`**、**`AS 2025年采购金额`**，解析器会把 **`2024`** 当成数值字面量，随后 **`年…`**\
            \ 非法 → **`(102) Incorrect syntax near '2024'`**（与 **pymssql** 报错一致）。**必须**使用方括号分隔标识符：**`AS\
            \ [2024年入库数量]`**、**`AS [2025年入库数量]`**；**`ORDER BY`** 引用同名列时同样写 **`ORDER\
            \ BY [2024年入库数量]`**（或改用 **`ORDER BY` 列位置序号**）。**替代写法**：别名不以数字开头，如 **`AS\
            \ 年入库数量_2024`**。**输出前自检**：**`SELECT`** 中若存在 **`AS 20`**（**`AS` 与四位年份紧邻**）且无\
            \ **`[`** → **整段不合格，须改为 `[…]` 或改名**。\n\n## 铁律：`u.UNIT_NAME` / `GROUP BY\
            \ u` 禁止悬空（4104，最高优先级）\n\n**一字不落**：凡最终 SQL 含 **`u.UNIT_NAME`**、**`GROUP\
            \ BY … u.UNIT_NAME`**、或任一 **`u.`** 前缀列 → **`FROM` 链在与 `Data0017 m` 同行的位置必须含**：**`LEFT\
            \ JOIN Data0002 u ON m.STOCK_UNIT_PTR = u.RKEY`**（数量口径默认；采购语义一致时可 **`m.PURCH_UNIT_PTR`**）。**禁止**「精简模板」时去掉\
            \ **`JOIN Data0002 u`** 却仍保留 **`u.UNIT_NAME`** → **`4104 The multi-part\
            \ identifier \"u.UNIT_NAME\" could not be bound`**。**路径差异不影响本条**：无论是否\
            \ **`JOIN Data0022 d22`/`Data0016 d16`**，只要 **`SELECT` 里写了单位别名 **`u`**，就必须\
            \ **`JOIN Data0002 u`**。\n\n**输出前自检**：全文搜索 **`u.`** → 若无 **`Data0002 u`**\
            \ 的 **`JOIN`** → **整段不合格，必须补写后再输出**。\n\n## 硬约束（最高优先级：半成品/成品仓列归属，违反必报 207）\n\
            \n**问题本质（不是语法笔误）**：**`IsHalfStock`、`IS_PROD_STORE` 只存在于 `Data0016`（仓库表，见本文「9、Data0016」第\
            \ 9、11 列）**。**`Data0022`（材料入库明细）没有这两列**，只有 **`LOCATION_PTR`** 指向 **`Data0016.RKEY`**。若在\
            \ **`Data0022` 别名 `d22`** 上写 **`d22.IsHalfStock`** / **`d22.IS_PROD_STORE`**，SQL\
            \ Server 固定报错：**`Invalid column name 'IsHalfStock'`（207）**。\n\n**`LOCATION_PTR`\
            \ / `DEPT_PTR` 归属（防 207，必须执行）**：**`LOCATION_PTR` 仅定义在 `Data0022`（如 `d22.LOCATION_PTR`），`Data0017`（`m`）上不存在该列。**\
            \ **禁止** **`JOIN Data0016 d16 ON m.LOCATION_PTR = d16.RKEY`**、**`ON Data0017.LOCATION_PTR`**\
            \ 或任何 **`m.LOCATION_PTR`** 引用，否则报 **`Invalid column name 'LOCATION_PTR'`（207）**。**`DEPT_PTR`\
            \ 用于 `Data0207`（如 `d207.DEPT_PTR → Data0034`）等事务明细**；本文 **Data0017** 列清单**不含**主表\
            \ **`DEPT_PTR`** → **禁止** **`m.DEPT_PTR`**、**`LEFT JOIN Data0034 dept\
            \ ON m.DEPT_PTR = dept.RKEY`**、**`Data0017.DEPT_PTR`**，否则报 **`Invalid\
            \ column name 'DEPT_PTR'`（207）**。要用 **`d16.IsHalfStock` / `d16.IS_PROD_STORE`**\
            \ 时，**必须先** **`JOIN`/`LEFT JOIN Data0022 d22 ON m.RKEY = d22.INVENTORY_PTR`**，再\
            \ **`LEFT JOIN Data0016 d16 ON d22.LOCATION_PTR = d16.RKEY`**；**未**引入\
            \ **`d22`** 时**不得**写 **`d16`** 条件（见 **1.5 实现要点**「优先级补充」）。用户问 **库存/在库 +\
            \ 某事业部（工厂名）** 且 **`FROM` 无 `Data0207`** 时，**必须**经 **`d22.WHOUSE_PTR →\
            \ Data0015 w`** 过滤厂名（见 **1.4**），**禁止**用 **`m → dept → w`** 伪路径。\n\n**唯一合法关联**：凡\
            \ **`FROM Data0022 d22`** 且需按 **1.5** 排除半成品仓/成品仓 → 语句中**必须**出现 **`LEFT\
            \ JOIN Data0016 d16 ON d22.LOCATION_PTR = d16.RKEY`**（或等价 **`JOIN Data0016`**\
            \ 且仍用 **`d16.`** 前缀），半成品/成品条件**只能**写 **`(d16.IsHalfStock IS NULL OR d16.IsHalfStock\
            \ <> 1) AND (d16.IS_PROD_STORE IS NULL OR d16.IS_PROD_STORE <> 1)`**。\n\
            \n**黑名单（最终 SQL 中禁止出现以下任一子串，否则整段作废重写）**：`d22.IsHalfStock`、`d22.IS_PROD_STORE`、`Data0022.IsHalfStock`、`Data0022.IS_PROD_STORE`、`m.LOCATION_PTR`、`Data0017.LOCATION_PTR`、`m.DEPT_PTR`、`Data0017.DEPT_PTR`。\n\
            \n**正确模板（按物料分列汇总「入库数量」，适用于用户要 **明细/各物料**；**若用户问题含「统计」且无明细用词 → 禁止套用本模板**，须\
            \ **`SELECT SUM(...) AS 入库数量合计`…**，不得 **`GROUP BY` 物料维度**，见文首 **铁律：统计→仅汇总**）**：\n\
            \n```sql\nSELECT\n    m.INV_PART_NUMBER AS 原材料代码,\n    m.INV_PART_DESCRIPTION\
            \ AS 原材料描述,\n    SUM(ISNULL(d22.QUAN_STOCKED, 0)) AS 入库数量,\n    u.UNIT_NAME\
            \ AS 单位\nFROM Data0017 m\nLEFT JOIN Data0496 cat ON m.GROUP_PTR = cat.RKEY\n\
            INNER JOIN Data0022 d22 ON m.RKEY = d22.INVENTORY_PTR\nLEFT JOIN Data0016\
            \ d16 ON d22.LOCATION_PTR = d16.RKEY\nINNER JOIN Data0002 u ON m.STOCK_UNIT_PTR\
            \ = u.RKEY\nWHERE d22.STATUS = 5\n  AND m.ACTIVE_FLAG = 'Y'\n  AND (cat.ttype\
            \ IS NULL OR cat.ttype <> N'T')\n  AND (m.INV_NAME NOT LIKE N'%外发%' AND\
            \ m.INV_NAME NOT LIKE N'%外协%')\n  AND (m.INV_PART_DESCRIPTION IS NULL\
            \ OR (m.INV_PART_DESCRIPTION NOT LIKE N'%外发%' AND m.INV_PART_DESCRIPTION\
            \ NOT LIKE N'%外协%'))\n  AND (m.INV_DESCRIPTION IS NULL OR (m.INV_DESCRIPTION\
            \ NOT LIKE N'%外发%' AND m.INV_DESCRIPTION NOT LIKE N'%外协%'))\n  AND (d16.IsHalfStock\
            \ IS NULL OR d16.IsHalfStock <> 1)\n  AND (d16.IS_PROD_STORE IS NULL OR\
            \ d16.IS_PROD_STORE <> 1)\nGROUP BY m.INV_PART_NUMBER, m.INV_PART_DESCRIPTION,\
            \ u.UNIT_NAME\nORDER BY SUM(ISNULL(d22.QUAN_STOCKED, 0)) DESC\n```\n\n\
            **`Data0207`（出库）连 `Data0016` 时的 `JOIN` 顺序（须防 4104）**：出库明细 **`d207.D0022_PTR`**\
            \ 指向 **`Data0022.RKEY`**，仓库维度在 **`Data0022.LOCATION_PTR → Data0016`**。**必须先**\
            \ **`LEFT JOIN Data0022 d22 ON d207.D0022_PTR = d22.RKEY`**，**再** **`LEFT\
            \ JOIN Data0016 d16 ON d22.LOCATION_PTR = d16.RKEY`**，然后才写 **`d16.IsHalfStock`\
            \ / `d16.IS_PROD_STORE`**。**禁止**把 **`JOIN Data0016`** 写在 **`JOIN Data0022\
            \ d22` 之前**，或在未定义 **`d22`** 的 **`ON`** 里写 **`d22.RKEY`**（否则 **4104 `The\
            \ multi-part identifier \"d22.RKEY\" could not be bound`**）。**禁止**写 **`JOIN\
            \ Data0016 d16 ON d207.D0022_PTR = d22.RKEY`**（错序且 **`Data0016`** 不应直接等于\
            \ **`D0022_PTR`**）。\n\n**正确模板（按物料分列汇总出库量；**用户含「统计」且无明细词 → 勿套用，改为不含 **`INV_PART_NUMBER`**\
            \ 的纯 **`SUM` 聚合**）**：\n\n```sql\nSELECT\n    m.INV_PART_NUMBER AS 原材料代码,\n\
            \    m.INV_PART_DESCRIPTION AS 原材料描述,\n    SUM(ISNULL(d207.QUANTITY, 0))\
            \ AS 出库数量,\n    u.UNIT_NAME AS 单位\nFROM Data0017 m\nLEFT JOIN Data0496\
            \ cat ON m.GROUP_PTR = cat.RKEY\nINNER JOIN Data0207 d207 ON m.RKEY =\
            \ d207.INVENTORY_PTR\nLEFT JOIN Data0022 d22 ON d207.D0022_PTR = d22.RKEY\n\
            LEFT JOIN Data0016 d16 ON d22.LOCATION_PTR = d16.RKEY\nINNER JOIN Data0002\
            \ u ON m.STOCK_UNIT_PTR = u.RKEY\nWHERE d207.TDATE >= '2026-01-01'\n \
            \ AND d207.TDATE < '2027-01-01'\n  AND m.ACTIVE_FLAG = 'Y'\n  AND (cat.ttype\
            \ IS NULL OR cat.ttype <> N'T')\n  AND (m.INV_NAME NOT LIKE N'%外发%' AND\
            \ m.INV_NAME NOT LIKE N'%外协%')\n  AND (m.INV_PART_DESCRIPTION IS NULL\
            \ OR (m.INV_PART_DESCRIPTION NOT LIKE N'%外发%' AND m.INV_PART_DESCRIPTION\
            \ NOT LIKE N'%外协%'))\n  AND (m.INV_DESCRIPTION IS NULL OR (m.INV_DESCRIPTION\
            \ NOT LIKE N'%外发%' AND m.INV_DESCRIPTION NOT LIKE N'%外协%'))\n  AND (d16.IsHalfStock\
            \ IS NULL OR d16.IsHalfStock <> 1)\n  AND (d16.IS_PROD_STORE IS NULL OR\
            \ d16.IS_PROD_STORE <> 1)\nGROUP BY m.INV_PART_NUMBER, m.INV_PART_DESCRIPTION,\
            \ u.UNIT_NAME\nORDER BY SUM(ISNULL(d207.QUANTITY, 0)) DESC\n```\n\n**正确模板（领用/出库数量\
            \ + 按物料分列 + 工厂过滤走「部门→工厂」`dept`/`w`，未要求半成品仓维度；单位表仍不可省略）**：与常见漏写单位 JOIN\
            \ 的 **`4104`** 语句相比，本模板**多出**一行 **`LEFT JOIN Data0002 u ON m.STOCK_UNIT_PTR\
            \ = u.RKEY`**；**禁止**删掉该行却仍保留 **`u.UNIT_NAME`**。\n\n```sql\nSELECT\n  \
            \  m.INV_PART_NUMBER AS 原材料代码,\n    m.INV_PART_DESCRIPTION AS 原材料描述,\n\
            \    SUM(ISNULL(d207.QUANTITY, 0)) AS 领用数量,\n    u.UNIT_NAME AS 单位\nFROM\
            \ Data0017 m\nLEFT JOIN Data0496 cat ON m.GROUP_PTR = cat.RKEY\nINNER\
            \ JOIN Data0207 d207 ON m.RKEY = d207.INVENTORY_PTR\nLEFT JOIN Data0034\
            \ dept ON d207.DEPT_PTR = dept.RKEY\nLEFT JOIN Data0015 w ON dept.whouse_ptr\
            \ = w.RKEY\nLEFT JOIN Data0002 u ON m.STOCK_UNIT_PTR = u.RKEY\nWHERE d207.TDATE\
            \ >= '2026-03-01'\n  AND d207.TDATE < '2026-04-01'\n  AND m.ACTIVE_FLAG\
            \ = 'Y'\n  AND (cat.ttype IS NULL OR cat.ttype <> N'T')\n  AND (m.INV_NAME\
            \ NOT LIKE N'%外发%' AND m.INV_NAME NOT LIKE N'%外协%')\n  AND (m.INV_PART_DESCRIPTION\
            \ IS NULL OR (m.INV_PART_DESCRIPTION NOT LIKE N'%外发%' AND m.INV_PART_DESCRIPTION\
            \ NOT LIKE N'%外协%'))\n  AND (m.INV_DESCRIPTION IS NULL OR (m.INV_DESCRIPTION\
            \ NOT LIKE N'%外发%' AND m.INV_DESCRIPTION NOT LIKE N'%外协%'))\n  AND LTRIM(RTRIM(w.WAREHOUSE_NAME))\
            \ = N'单面事业部'\nGROUP BY m.INV_PART_NUMBER, m.INV_PART_DESCRIPTION, u.UNIT_NAME\n\
            ORDER BY SUM(ISNULL(d207.QUANTITY, 0)) DESC\n```\n\n**大类点名时的追加规则（通用，禁止写死某一种物料代码）**：用户问\
            \ **「某大类…明细 / 用量明细」** 或 **「统计某大类…」** 且点名**单一材料大类**时，在上模板 **`WHERE`** 中\
            \ **`AND`** 追加 **1.12** 约定的 **`cat` 多通道并联**，须按**用户原词 / 用户给出的类别代码 / 1.13\
            \ 映射到的代码**动态构造（典型形态：**`LTRIM(RTRIM(cat.GROUP_NAME)) IN (代码变体…)`** **`OR\
            \ REPLACE(...)` 去连字符** **`OR cat.GROUP_NAME LIKE N'%…%'`** **`OR cat.GROUP_DESC\
            \ LIKE N'%…%'`**，关键词取自用户用语）。**禁止**在提示词级全局固定某一 **`GROUP_NAME` 常量**（如假定全网只属于某一个代码）；**禁止**因「明细」只加\
            \ **`GROUP BY` 物料**却省略本条 **`AND`**。\n\n## 核心业务规则（必须严格执行）\n1. **时间规则**\n\
            \   - 查询某月数据未指定年份 → 默认**当年**（如：3月 → YEAR(GETDATE())）\n   - 用户**明确给出年份或日期**（如「2026年」「2026-01」）→\
            \ **必须严格按该时间**构造区间；**禁止**把 **「2026年」改成别的年**。**例外（仅收紧上界、不改正年起始）**：下条 **「YYYY年各月\
            \ + 当前年」** 允许用 **`SYSDATETIME()`/`GETDATE()`** 生成 **「截至当前月」** 的 **`TDATE`\
            \ 上界**——**不是**用当前日期覆盖 **`>= '2026-01-01'`**，**不**改变用户指定的统计年。\n   - **「YYYY年各月」与当前自然年上界（必须执行，防未来月/脏日期）**：问句为\
            \ **「YYYY年各月 / 每月 / 按月」** + **领用/出库/使用量** 等（**`Data0207.TDATE`** 或等价业务日）且\
            \ **YYYY** 与 **执行时 `YEAR(CAST(SYSDATETIME() AS date))` 相同**，且用户**未**明确要求\
            \ **「统计到年底」「含未到月份」「12 个月全展示」** 时 → 业务语义为 **「当年从 1 月起截至当前业务月」**，**须在 `WHERE`\
            \ 对事实日期追加更紧上界**（与 **`TDATE < 'YYYY+1-01-01'`** **`AND` 联用**）：**`AND d207.TDATE\
            \ < DATEADD(MONTH, 1, DATEFROMPARTS(YYYY, MONTH(CAST(SYSDATETIME() AS\
            \ DATE)), 1))`**（**`YYYY` 与用户年一致**）。**效果**：若当前为 **5 月**，则**不得**纳入 **6～12\
            \ 月** 的 **`TDATE`**（避免 **误录未来日** 或误解）；**12 月** 时该上界与 **`'< YYYY+1-01-01'`**\
            \ 等价。**历史整年**（**YYYY < 当前年**）仍只用 **`>= 'YYYY-01-01' AND < 'YYYY+1-01-01'`**。**若用户坚持要「整历年到\
            \ 12-31」** 即使当年未到 → 须用户原句含 **年底/全年历月** 等再**不写**本条上界。**输出前自检（text2sql）**：命中\
            \ **当年各月** 且未含 **年底/12 个月占位** → 最终 SQL **`WHERE` 片段须同时出现** **`DATEFROMPARTS`**\
            \ 与 **`SYSDATETIME`** 或 **`GETDATE`**（与 **`DATEADD(MONTH, 1, …)`** 配套），**否则整段不合格**。**若仍出现\
            \ 6～12 月有数** → 先 **`SELECT MIN(TDATE), MAX(TDATE) FROM Data0207 WHERE\
            \ …`** 核查库内是否真有 **未来 `TDATE`**。\n   - **下游「数据分析 / 播报 / 表格渲染」（必须执行，防臆造\
            \ 12 个月）**：**禁止**在 **SQL 已按上条截断** 或 **仅返回 1～5 行** 的情况下，由 **二次大模型 / 报表模板**\
            \ **补全 1～12 月**、对 **未到月** 填 **虚构用量** 或 **「典型波动」数值**——**展示用量只能来自查询结果集逐行**，**无行即无该月**；**禁止**用\
            \ **常识推演** 代替 **数据库聚合**。**月均类主问**（见 **1.8「每月使用量 vs 月均使用量」④⑤**）：**禁止**把\
            \ **月均主结论** 展开成 **原材料/料号 × 多行** 的附表；若附表存在 → **仅允许「月」维**（**月份 + 该月使用量**）。\n\
            \   - 查询**整年**（如「2026年」）→ 半开区间：`>= 'YYYY-01-01' AND < 'YYYY+1-01-01'`（例：`>=\
            \ '2026-01-01' AND < '2027-01-01'`）\n   - **指定月份区间（必须执行，防「1-5月却按全年/有数月份均摊」）**：用户给出\
            \ **闭区间自然月** 表述时（如 **「1-5月」「1～5月」「1月到5月」「3月至6月」「第1季度」** 等）→ **`WHERE`**\
            \ 写 **该区间半开上界**，**禁止**套用 **「YYYY年各月 + 当前年上界」** 截断（用户已 explicit 指定止月）。解析示例：**「2026年1-5月」**\
            \ → **`d207.TDATE >= '2026-01-01' AND d207.TDATE < '2026-06-01'`**；**「2026年3-6月」**\
            \ → **`>= '2026-03-01' AND < '2026-07-01'`**；**「第1季度」** → **`>= 'YYYY-01-01'\
            \ AND < 'YYYY-04-01'`**。区间 **含起月、含止月**。\n   - 查询**近三个月** → 包含当月共计**3个月**，不包含额外月份\n\
            \   - 未指定时间维度 → 默认按**天**统计\n   - 时间筛选统一使用 `>=` 和 `<`，禁止使用函数包裹字段导致索引失效\n\
            \n1.1 **Data0022 收货 vs 入库（极易混用导致「有数据却查无」——必须区分）**\n   - 用户说 **接收 / 收货\
            \ / IQC / 来料** 等 → 业务时间字段用 **TDATE（接收日期）**；数量口径常用 **QUANTITY（已接收数量）**，按需结合\
            \ **STATUS**（3=IQC中，4=待入仓，5=已入仓）\n   - 用户说 **入库 / 入仓 / 已入库数量** 等 → 业务时间字段用\
            \ **stock_date（入库时间）**；数量口径用 **QUAN_STOCKED（入库数量）**；若需限定已完成入仓，可加 **STATUS\
            \ = 5（已入仓）**\n   - **`Data0022.STATUS` 与「库存 / 在库 / 现存量」口径（锦顺实例，必须区分）**：用户问\
            \ **库存 / 在库 / 现存量 / 有多少货 / 物料库存**（**未**明确要求 **仅已入仓完成 / 排除 IQC / 排除待入仓**）时\
            \ → **禁止**在 **`WHERE`** 中写死 **`d22.STATUS = 5`** 作为唯一条件：**生产库大量明细 `STATUS`\
            \ 为 `NULL` 仍有有效 `QUAN_ON_HAND`**，会导致 **有实物却查无**。**默认**：不写 **`STATUS`**\
            \ 条件，或对 **`STATUS` 显式放行 **`NULL`**：**`AND (d22.STATUS IS NULL OR d22.STATUS\
            \ = 5)`**（若业务确认 **`NULL` 与已入仓等价**）；数量汇总优先 **`SUM(ISNULL(d22.QUAN_ON_HAND,\
            \ 0)) AS 现存量`**（或 **`现有数量`**），按需并列 **`QUAN_STOCKED`**。**仅当**用户明确 **「仅统计已入仓\
            \ / STATUS 已关闭」** 且库内 **`STATUS` 枚举已核对** → 才可收紧为 **`d22.STATUS = 5`**。**禁止**\
            \ **`LEFT JOIN Data0022` + `WHERE d22.STATUS = 5`** 却不考虑 **`NULL`**，除非\
            \ **`SELECT DISTINCT STATUS FROM Data0022 WHERE …`** 已证实无 **`NULL` 有效库存**。\n\
            \   - 用户说 **采购金额 / 采购额 / 采购花费 / 采购成本**（尤其「按月统计采购金额」）时，必须走 **Data0022 采购口径**，金额建议为\
            \ **`SUM(ISNULL(d22.PRICE,0) * ISNULL(d22.QUANTITY,0))`**（若用户明确按入库口径可改\
            \ **`QUAN_STOCKED`**）；时间字段按语义在 **`TDATE`（接收）** 与 **`stock_date`（入库）**\
            \ 二选一。**禁止**把「采购金额」落到 **`Data0207.STANDARD_COST`**（该字段用于领用/消耗口径）。\n  \
            \ - **禁止**在「按入库时间统计入库量」时用 **TDATE** 做时间条件（常见错误：物料上年接收、本年入仓 → 按 TDATE 筛「本年入库」会得到空集或偏小的数）\n\
            \   - **禁止**在「按接收日统计收货量」时用 **stock_date** 替代 **TDATE**，除非用户明确要「入库日」口径\n\
            \   - **多分年 + 入库/采购入库 + 按年分列（必须执行，防「两年混一列」）**：用户同时点名 **两个及以上自然年**（如 **「24年、25年」「2024和2025」**）+\
            \ **入库 / 采购入库 / 入仓数量** 等 → **`SELECT` 须按年分列**（每年一列 **`SUM(CASE WHEN d22.stock_date\
            \ … THEN ISNULL(d22.QUAN_STOCKED,0) ELSE 0 END)`**），例如 **`AS [2024年采购入库总量]`**、**`AS\
            \ [2025年采购入库总量]`**；**`WHERE`** 写总覆盖区间及 **`w`/`cat`/`d16`/`m` 外发闸**。**禁止**单列\
            \ **`SUM(QUAN_STOCKED)`** 跨两年混算。**分年别名须 `[…]`**（文首 **防 102**）。**时间列**用\
            \ **`d22.stock_date`**，**禁止**用 **`TDATE`** 切入库分年。\n   - **「加总 / 总量」优先于「各种型号」口语（必须执行，防误判明细）**：用户常在同句说\
            \ **「各种型号的……各是多少」** 实际指 **该大类下所有型号合并后的数**（**要的是合计**）。凡原句或追问含 **加总 / 入库加总\
            \ / 总量 / 一共多少 / 合计几个数 / 不要明细 / 不要按型号分列** 等 → **输出 1 行**：**仅** **`[YYYY年…]`\
            \ 两列 `SUM`**（可加 **`MAX(u.UNIT_NAME) AS 单位`**、**`MAX(w.WAREHOUSE_NAME)`**\
            \ 等说明列），**禁止** **`GROUP BY m.INV_PART_NUMBER`/`m.INV_PART_DESCRIPTION`**。**仅当**用户明确\
            \ **「按型号分列 / 每种料一行 / 各型号各多少 / 明细清单」** 且**无**上述 **加总类优先词** → 才 **`GROUP\
            \ BY` 物料** 输出多行分年表。**与文首「统计→仅汇总」**：含 **「统计」** 且无 **按型号分列** 意图时，**禁 `GROUP\
            \ BY` 物料**。\n   - **「两年总量」单行合计 vs 按型号分年（与上条一致）**：用户要 **「2024年总量」「2025年总量」「两年各合计多少」「阻焊油墨物料入库加总的数量」**（含对话中从「多行型号表」改为**要总计**）→\
            \ **`SELECT`** 为 **分年两列 `SUM(CASE…)`**，**禁止** **`GROUP BY` 物料**。**多单位**：**`GROUP\
            \ BY u.UNIT_NAME`**，每年仍两列 **`SUM`**。**仅当**明确要 **各型号分列** 且无 **加总** 语义 →\
            \ 才 **`GROUP BY` 物料**。\n   - **`Data0022` 与半成品/成品仓列（必须执行，与 1.5 联动）**：**`IsHalfStock`、`IS_PROD_STORE`\
            \ 不在 `Data0022` 上**。凡 **`FROM Data0022 d22`** 且按 **1.5** 要排除半成品/成品仓 →\
            \ **必须**写 **`LEFT JOIN Data0016 d16 ON d22.LOCATION_PTR = d16.RKEY`**，半成品/成品条件**只能**用\
            \ **`d16.IsHalfStock` / `d16.IS_PROD_STORE`**。**输出 SQL 前强制自检**：若语句任意位置出现\
            \ **`d22.IsHalfStock`**、**`d22.IS_PROD_STORE`**、**`Data0022.IsHalfStock`**\
            \ 等子串 → **视为非法，整句重写**，不得仅改注释。\n\n1.2 **ACTIVE_FLAG（按表区分类型，禁止混用数字/字符比较）**\n\
            \   - **Data0017（原材料）与 Data0034（部门）的 `ACTIVE_FLAG` 类型可能不同，必须按实际列类型写条件，不能照搬。**\n\
            \   - **Data0017.ACTIVE_FLAG** 在常见生产库中为 **varchar**，存 **`'Y'`/`'N'`**（或类似字符）→\
            \ 过滤有效物料用 **`m.ACTIVE_FLAG = 'Y'`**（或与 `SELECT DISTINCT ACTIVE_FLAG FROM\
            \ Data0017` 结果一致）。**禁止**写 **`m.ACTIVE_FLAG = 1`**：SQL Server 会把字符列隐式转成\
            \ **int** 与 **1** 比较，遇到 **`'Y'`** 即报错：**`Conversion failed when converting\
            \ the varchar value 'Y' to data type int`**。\n   - **Data0034.ACTIVE_FLAG**\
            \ 多为 **tinyint**，存 **0/1** → 用 **`ACTIVE_FLAG = 1`** / **`= 0`**；**禁止**对该表写\
            \ **`= 'Y'`**（可能触发 `varchar 'Y' to tinyint` 类转换错误）。\n   - 业务口语「有效 / 启用\
            \ / Y」→ **Data0017 用 `'Y'`**；**Data0034 用 `= 1`**（停用则 **`'N'`** / **`=\
            \ 0`**，以 DISTINCT 为准）。\n   - 用户**未明确要求**「仅有效物料 / 排除停用物料」时 → **不要对 Data0017\
            \ 默认加 `ACTIVE_FLAG`**（避免类型假设错误且改变「排名前十」口径）；统计「部门总数」且未要求排除停用时 → **不要加 Data0034\
            \ 的 `ACTIVE_FLAG`**；仅「有效部门」时对 **Data0034** 加 **`WHERE ACTIVE_FLAG = 1`**。\n\
            \n1.3 **Data0034 部门代码 / 部门名称（避免「库里有却查无」）**\n   - **DEPT_NAME 常含前导/尾随空格或不可见空白**\
            \ → **禁止**仅用 `DEPT_NAME = N'用户原文'` 作为唯一条件（会与库里 ` N'人力资源部'` 等不相等）。应用 **`LTRIM(RTRIM(DEPT_NAME))`**\
            \ 与用户输入去空格后比较（目标库为 SQL Server 2017+ 且允许时可用 **`TRIM(DEPT_NAME)`**）。\n \
            \  - 用户只给部门简称或口语（如「人力」「人事」「HR」）→ 在已 `LTRIM(RTRIM(DEPT_NAME))` 的前提下使用 **`LIKE\
            \ N'%关键字%'`**；若可能多命中，**显式列出 DEPT_CODE、DEPT_NAME** 供辨别，必要时 **`ORDER BY\
            \ DEPT_CODE`**，避免武断 `TOP 1` 除非用户明确要唯一一条。\n   - 用户问「某**部门**的代码 / 哪个部门」且需与行政口径一致时\
            \ → 优先 **`TTYPE = 4`（部门/班组）**；若结果为空且用户坚持有该部门，可**去掉或放宽 TTYPE** 再查一次（避免把名称挂在非\
            \ 4 类型记录上时漏查）。\n   - **DEPT_CODE** 按**字符串**处理，可能含**前导零**（如 `049`）→ **禁止**与整数隐式混比；条件写\
            \ **`DEPT_CODE = N'049'`**，不要写成 `= 49`。\n   - 用户未要求「仅有效部门」时 → **不要默认加\
            \ `ACTIVE_FLAG = 1`**（与 1.2 统计部门条数规则一致）；仅当用户明确要有效/在用部门时再加。\n\n1.4 **工厂归属口径（Data0207\
            \ 领用/出库场景，必须防止错字段）**\n   - **Data0207（材料出库明细）没有 `WHOUSE_PTR` 字段**，**禁止**写\
            \ `Data0207.WHOUSE_PTR` 或等价别名字段（否则会触发 `Invalid column name 'WHOUSE_PTR'`）。\n\
            \   - **库存 / `QUAN_ON_HAND` + 按工厂（事业部名）过滤（防 207，必须执行）**：**禁止** **`LEFT\
            \ JOIN Data0034 dept ON m.DEPT_PTR = dept.RKEY`**（**`Data0017` 无 `DEPT_PTR`**，见本文\
            \ **Data0017** 列清单与文首黑名单）。用户问 **某事业部在库物料、某工厂库存、现存量且带 `Data0015` 工厂名**\
            \ 时，**必须** **`JOIN`/`LEFT JOIN Data0022 d22 ON m.RKEY = d22.INVENTORY_PTR`**，再\
            \ **`LEFT JOIN Data0015 w ON d22.WHOUSE_PTR = w.RKEY`**，**`WHERE LTRIM(RTRIM(w.WAREHOUSE_NAME))\
            \ = N'…'`**；按厂汇总在库量用 **`SUM(ISNULL(d22.QUAN_STOCKED, 0))`**（并配合 **`d22.STATUS`**、**`cat`/`m`\
            \ 外发闸**、按需 **`d16`** 等既有口径），**`GROUP BY m.INV_PART_NUMBER, …`**。**禁止**仅用\
            \ **`m.QUAN_ON_HAND` + `dept`** 冒充分厂库存。若用户明确只要全公司账面库存（仅用 **`m.QUAN_ON_HAND`**、不按分厂），则**不要**写\
            \ **`w`** 工厂条件。\n   - **库存/在库 + 用户点名子类（防「全厂全品类冒充油墨」，必须执行）**：问句在 **事业部/工厂/仓库**\
            \ 之外，还含有 **明确材料子类口语**（如 **油墨、胶水、锡膏、钻咀、覆铜板、办公用品、化学用品** 等；**不是**泛泛的「物料」「原材料」「全部」「库存」单字）且语义为\
            \ **库存/在库/结存/现存量/库存明细/仓里有哪些料** 等 → **`WHERE` 在已有 **`w`/`d22`/`cat.ttype`/外发三列**\
            \ 之外，**必须**再增加 **「子类收窄」** 条件块：**优先**按 **1.12** 对 **`cat`** 写 **`GROUP_NAME`/`GROUP_DESC`\
            \ 对用户词的并联**（如 **`油墨`**：**`LTRIM(RTRIM(cat.GROUP_NAME)) LIKE N'%油墨%' OR\
            \ LTRIM(RTRIM(ISNULL(cat.GROUP_DESC, N''))) LIKE N'%油墨%'`** 及 **1.13**\
            \ 映射候选 **`IN`**）；若类表颗粒粗、仅靠 **`cat` 仍过宽或过窄**，**允许**在同一 **`AND` 块内追加兜底**：**`(m.INV_NAME\
            \ LIKE N'%油墨%' OR m.INV_PART_DESCRIPTION LIKE N'%油墨%' OR m.INV_DESCRIPTION\
            \ LIKE N'%油墨%')`**（**与用户原词一致**，勿擅自改成过短子串以免误扩）。**禁止**仅 **`工厂名 + 外发闸 + ttype`**\
            \ 就 **`GROUP BY` 物料列** 返回该厂**全品类**——否则必出现「问油墨却列出铜球、白纸」类结果，**整段 SQL 视为不合格**。**`SELECT`\
            \ 建议** 同时输出 **`cat.GROUP_NAME AS 物料类别`**、**`ISNULL(cat.GROUP_DESC, N'')\
            \ AS 物料类别描述`**（见 **1.10**），便于核对口径。\n   - 需要按工厂统计 `Data0207.QUANTITY`（如「各工厂领用物料数量」）时，只能使用以下已知可执行关联路径之一：\n\
            \     - 路径A（按部门所属工厂）：`Data0207.DEPT_PTR -> Data0034.RKEY -> Data0034.whouse_ptr\
            \ -> Data0015.RKEY`\n     - 路径B（按来源入库工厂）：`Data0207.D0022_PTR -> Data0022.RKEY\
            \ -> Data0022.WHOUSE_PTR -> Data0015.RKEY`\n   - 用户未明确口径时，**默认优先路径A**（部门所属工厂，通常更符合领用责任归属）；若用户强调「按入库来源工厂」再改用路径B。\n\
            \   - 若要限定生产工厂，优先使用已存在业务标识（如 `Data0015.prod_flag = 1`）；`TTYPE` 仅在库内已确认含义时使用，禁止臆断固定值。\n\
            \   - **`Data0015` 别名 `w` 必须先 JOIN（必须执行，修复 4104）**：凡 **`WHERE` / `SELECT`\
            \ / `GROUP BY`** 出现 **`w.WAREHOUSE_NAME`、`w.WAREHOUSE_CODE`、`w.ABBR_NAME`**\
            \ 等 **`Data0015`** 列（别名 **`w`**），**`FROM` 链中必须先 **`JOIN`/`LEFT JOIN Data0015\
            \ w`**，禁止悬空引用。**领用场景 `Data0207 d207`** 连工厂：**路径A（默认）**：**`LEFT JOIN Data0034\
            \ dept ON d207.DEPT_PTR = dept.RKEY`**，再 **`LEFT JOIN Data0015 w ON dept.whouse_ptr\
            \ = w.RKEY`**（**`Data0034.whouse_ptr` → `Data0015.RKEY`**，字段见本文 **Data0034**）。**路径B**：已有\
            \ **`Data0022 d22`** 时 **`LEFT JOIN Data0015 w ON d22.WHOUSE_PTR = w.RKEY`**。**禁止**未写上述\
            \ **`JOIN`** 却在条件里写 **`LTRIM(RTRIM(w.WAREHOUSE_NAME)) = N'单面事业部'`** 等\
            \ → **`4104 ... \"w.WAREHOUSE_NAME\" could not be bound`**。「**单面事业部**」等为\
            \ **工厂名称**，过滤对象必须是 **`Data0015`**（**`w`**），不是 **`Data0034.DEPT_NAME`**（见\
            \ **1.4.1**）。\n   - **防 4104 + 防「事业部」误绑到 cat（必须执行）**：**`WHERE`/`SELECT`/`HAVING`**\
            \ 一旦出现 **`w.`**，**`FROM` 中在 `WHERE` 之前**必须已有 **`JOIN`/`LEFT JOIN`/`INNER\
            \ JOIN Data0015 w`**（**`Data0022` 入库/库存/采购入库数量** 等口径 → **`LEFT JOIN Data0015\
            \ w ON d22.WHOUSE_PTR = w.RKEY`**，与 **1.4** 路径 B 一致）。**输出前黑名单**：全文子串检索\
            \ **`w.`** → 若无 **`Data0015 w`** 的 **`JOIN`** → **整段不合格，须补 `JOIN w` 后再输出**。**禁止**写成\
            \ **`cat.GROUP_NAME LIKE N'%高精密事业部%'`**、**`cat.GROUP_DESC LIKE N'%单面事业部%'`**\
            \ 等——用户口中的 **「某某事业部」** 在锦顺口径下多为 **`Data0015` 工厂名**，**不是** **`Data0496`\
