            \ LIKE N'%|用户核心串'`**（整段字面仍须写进 SQL，勿拼接断行）。**同一牌号存在加长后缀**（如 **`KB-6160`**\
            \ 与 **`KB-6160LC`**）时，**`LIKE N'%KB-6160%'`** 会同时命中；仅当用户明确要「不含 LC」时再在\
            \ **`WHERE` 中追加排除条件**（如 **`AND m.INV_PART_DESCRIPTION NOT LIKE N'%KB-6160LC%'`**\
            \ 等，**以用户原话为准**，**禁止**臆造业务规则）。  \n        - **输出前自检**：问题含 **「原材料规格 … KB-6160」**\
            \ 类表述，而 **`WHERE` 仅有 `INV_PART_DESCRIPTION`/`INV_DESCRIPTION` 整列等值** 或\
            \ **仅有 1) 三联等值且右端为短牌号** → **不合格，须改为本款 **`LIKE`** 并联**。  \n     1) **等值须并联「`|`\
            \ ↔ `/` 归一」（必须执行，修复「用户写 `/`、库内写 `|` 导致整段 `=` 恒不匹配」）**：**仅适用于用户原文为「整段长规格描述」**（多段尺寸/工艺组合，见识别规则「规格组合」）。**禁止**把\
            \ **`m.INV_PART_DESCRIPTION = N'用户原文'`** 作为**唯一**匹配手段——**模型常见偷懒只写这一条 →\
            \ 库内为 `|` 分隔时必查无数据**。下列 **三联 `OR` 须「整段照抄进 SQL」**，**缺一不可**（占位 **`N'用户原文'`**\
            \ 替换为用户粘贴的**同一整段**规格串）：  \n        **`AND (`**  \n        **`LTRIM(RTRIM(m.INV_PART_DESCRIPTION))\
            \ = LTRIM(RTRIM(N'用户原文'))`**  \n        **`OR LTRIM(RTRIM(REPLACE(REPLACE(m.INV_PART_DESCRIPTION,\
            \ N'|', N'/'), N'｜', N'/'))) = LTRIM(RTRIM(N'用户原文'))`**  \n        **`OR\
            \ LTRIM(RTRIM(m.INV_PART_DESCRIPTION)) = LTRIM(RTRIM(REPLACE(REPLACE(N'用户原文',\
            \ N'/', N'|'), N'／', N'|')))`**  \n        **`)`**  \n        （可按库内习惯增减\
            \ **`REPLACE`** 变体；全角半角、首尾空格仍以 **`LTRIM(RTRIM)`** 对齐。）  \n        **输出前自检**：用户串含\
            \ **`/`**（规格分段特征）且 **`WHERE` 里 `INV_PART_DESCRIPTION` 仅有「单列等值」而无上述 **`OR`**\
            \ 并联 → **本 SQL 不合格，必须补全后再输出**。**若用户串为短牌号且已走 0)** → **不要求**本款三联等值。\n  \
            \   2) 上述仍无命中或须收窄时，用 **`m.INV_PART_DESCRIPTION LIKE N'%…%'`** 分段兜底：对用户串取\
            \ **2～3 段最具区分度的连续子串**（避免单字符或过短 `%` 导致误命中过多），各段 **`AND`** 组合；必要时并联 **`m.INV_NAME`**、**`m.INV_DESCRIPTION`**\
            \ 的 **`LIKE`**（与 **1.8** 办公用品类关键词统计思路一致，但本条针对「整段规格描述」）。\n     3) **`LIKE`\
            \ 转义**：用户串中的 **`_`（下划线）** 在 **`LIKE`** 中为单字通配符，拼接条件时必须 **`ESCAPE`** 或对\
            \ **`_` → `[_]`** 转义，**禁止**因未转义导致匹配错误或误扩结果；**`*`、`/`** 在 T-SQL **`LIKE`**\
            \ 中无通配符含义，可按字面量使用。\n     4) **`|` 与 `/` 分段差异（主数据常见）**：**`INV_PART_DESCRIPTION`**\
            \ 中规格段之间常用 **竖线 `|`**，用户粘贴/口语常用 **斜杠 `/`**（例：用户 **`HB1.2MM/15um/0/1240*1035/…`**\
            \ 对应库内 **`HB1.2MM|15um/0|1240*1035|…`**）。**禁止**在 **`1)` 归一等值已并联**的情况下仍拒绝匹配；若仍过宽，应改用\
            \ **多段 `LIKE`（材质/厚度/尺寸等关键段 `AND`）**。**`|` 在 `LIKE` 中为普通字符**。\n     5)\
            \ **同基底、后缀不同多行主数据**：仅按尺寸段 **`LIKE`** 可能命中 **多 `RKEY`**（如 **`…|KM-1`**\
            \ 与 **`…|KM-1-D`**）。用户串含 **更长后缀**（如 **`KM-1-D`**）时，必须 **`AND m.INV_PART_DESCRIPTION\
            \ LIKE N'%…该后缀…%'`**（**`_` 须按 3) 转义**）收窄到唯一或用户意图明确的一行；**禁止**在未收窄时对 **`JS-…`**\
            \ 与 **`D-JS-…`** 等两行直接 **`SUM` 合并** 除非用户明确要求「同规格合并」。\n   - **第二步（用量/入库/领用）**：用第一步得到的\
            \ **`m.RKEY`**（**`INVENTORY_PTR`**）或 **`m.INV_PART_NUMBER`** 关联业务事实表，时间口径仍遵守\
            \ **第 1 节**（如 **1.8** 领用用 **Data0207.TDATE**、**Data0207.QUANTITY**；入库与收货区分\
            \ **1.1**；用户指定 **2026 年** 等须严格区间）。**`LEFT JOIN` 事实表且要按日期筛选发生额时**：**日期条件须写在\
            \ `JOIN … ON` 中与键并列**，**禁止**仅在 **`WHERE`** 对已左连的事实表日期筛选（否则无发生额时整行消失，且与「无此料」无法区分）。**禁止**对用户\
            \ **统计…某规格物料…年内领用** 类问题使用 **`INNER JOIN Data0207`** 再在 **`WHERE`** 写 **`d207.TDATE`**——该写法在\
            \ **年内无领用** 时 **`FROM Data0017`** 主数据行也会被丢掉，界面表现为 **「查无数据」**；正确写法为 **`LEFT\
            \ JOIN Data0207 d207 ON m.RKEY = d207.INVENTORY_PTR AND d207.TDATE >=\
            \ 'YYYY-01-01' AND d207.TDATE < 'YYYY+1-01-01'`**，聚合 **`SUM(ISNULL(d207.QUANTITY,0))`**\
            \ 得 **0**。\n   - **第二步补充——「由原材料描述查库存」（`Data0022`）**：语义为 **库存 / 在库 / 现存量**\
            \ 时，在 **`JOIN Data0022 d22`**、**`JOIN Data0016 d16`**（半成品/成品闸）及 **`cat`/`m`\
            \ 外发闸** 之后：**描述匹配仍用本条第一步**（**嵌入短牌号走 0)**；**整段长规格走 1)** 归一并值 + **2)** 关键段\
            \ **`LIKE`**；型号段如 **`KSM-…`** 建议 **`LIKE N'%KSM-…%'`** 避免因 **`/5KG/袋`\
            \ 等后缀与库不一致导致整段 `=` 失败）**；**`Data0022.STATUS` 遵守 **1.1**「库存 vs STATUS」**：**默认不写\
            \ **`d22.STATUS = 5`** 单条件**，或写 **`(d22.STATUS IS NULL OR d22.STATUS =\
            \ 5)`**（与业务核对后选用）；汇总列 **`SUM(ISNULL(d22.QUAN_ON_HAND, 0)) AS 现存量`**（用户口语「库存」优先），按需加\
            \ **`QUAN_STOCKED`**。**仍须** **`LEFT JOIN Data0002 u ON m.STOCK_UNIT_PTR\
            \ = u.RKEY`** 若输出 **`单位`**。\n   - **「统计 + 整段规格串 / 规格短牌号」汇总形态（必须执行，与文首铁律例外对齐）**：触发条件见文首\
            \ **「统计 + 整段规格串 / 规格短牌号」例外**（含 **「原材料规格」+ 短牌号**，匹配用 **第一步 0)**）。**`FROM`**：**`Data0017\
            \ m`** → **`LEFT JOIN Data0496 cat`**（材料口径仍 **`ttype`/外发闸**）→ **`LEFT\
            \ JOIN Data0207 d207 ON m.RKEY = d207.INVENTORY_PTR AND d207.TDATE >=\
            \ … AND d207.TDATE < …`** → **`LEFT JOIN Data0002 u ON m.STOCK_UNIT_PTR\
            \ = u.RKEY`**（输出单位时 **不可省略**）。**`WHERE`**：**仅写 **`m`/`cat` 侧条件**；**描述匹配**：用户为\
            \ **整段长规格描述** 时**必须**采用 **第一步 1)** 完整三联 **`OR`**；用户为 **嵌入短牌号** 时**必须**采用\
            \ **第一步 0)** **`LIKE`** 并联，**禁止**用 1) 三联等值冒充；**两种情形均禁止**仅 **`LTRIM(RTRIM(m.INV_PART_DESCRIPTION))\
            \ = …` 单列等值**；建议保留 **`m.ACTIVE_FLAG = 'Y'`**（与全文其它物料查询默认一致，除非用户明确含停用物料）；**禁止**把\
            \ **`d207.TDATE`** 只写在 **`WHERE`** 而不在 **`JOIN … ON`**。**`SELECT`**：**`MAX(m.INV_PART_NUMBER)\
            \ AS 原材料代码`**、**`MAX(m.INV_PART_DESCRIPTION) AS 原材料描述`**、**`ISNULL(SUM(ISNULL(d207.QUANTITY,\
            \ 0)), 0) AS 领用数量`**、**`MAX(u.UNIT_NAME) AS 单位`**（**`单位` 必须来自 `u`**，见\
            \ **1.7**）。**`GROUP BY`**：单行汇总时允许 **`GROUP BY m.INV_PART_NUMBER, m.INV_PART_DESCRIPTION,\
            \ u.UNIT_NAME`**（与 **`MAX`/`SUM`** 并存合法），或改用 **`GROUP BY m.RKEY`** 等价粒度；**禁止**在应写\
            \ **0)** 或 **1)** 时省略匹配条件仅靠 **`GROUP BY`**「凑」结果。**`ORDER BY`**：推荐 **`ORDER\
            \ BY SUM(ISNULL(d207.QUANTITY, 0)) DESC`**（或与 **`SELECT` 列表别名一致且当前方言支持\
            \ **`ORDER BY` 别名** 时可用别名）。**禁止**孤立的 **`SELECT SUM(...) FROM … INNER JOIN\
            \ Data0207 WHERE TDATE`**。\n   - **多条命中**：**`COUNT(DISTINCT m.RKEY) >\
            \ 1`** 时，**禁止**无说明地 **`TOP 1`** 汇总全库用量。必须 **分原材料代码（及描述）返回多行** 各自聚合，或在同一结果集中\
            \ **`GROUP BY m.INV_PART_NUMBER, m.INV_PART_DESCRIPTION`**（描述可用 **`MAX`**）使业务可核对；仅当用户明确「合并同名规格总量」且语义允许时方可合并。\n\
            \   - **结果展示**：仍须符合 **1.7**（输出 **原材料代码**、**原材料描述**、数量列中文别名、**单位** 等）；统计语句中\
            \ **`SELECT` 必须带出** 匹配到的 **`INV_PART_NUMBER` AS 原材料代码** 与 **`INV_PART_DESCRIPTION`\
            \ AS 原材料描述**，避免只返回数字无法对照主数据。\n   - **与「物料代码」提问的区分**：用户给出 **短编码、纯字母数字料号**\
            \ 且无规格分隔特征、且**未**表述为 **原材料规格 / 牌号**（见 **第一步 0)**）时，可 **`INV_PART_NUMBER`**\
            \ 精确或 `LIKE N'前缀%'`；**代码与描述同时给出** 时，**`WHERE` 内 `AND` 同时约束** 代码与描述，避免张冠李戴。\n\
            \   - **含连字符/分段符的料号（必须执行，修复「JS-CCL-00614 类编码查无」）**：企业常用原材料代码形如 **`XX-XXX-00614`**、**`A-BB-12345`**（字母数字\
            \ + **`-`、`.`** 等分段，**无** **`/ * × MM um`** 等规格组合特征）、且**非**用户明确表述的 **「原材料规格\
