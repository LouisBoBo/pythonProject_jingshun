    - data:
        code: "# Dify 代码节点：arg1=数据，arg2=配置（标题+图表形式）\n# 输入：arg1（必填，数据）；arg2（可选，```json\
          \ {\"title\":\"...\",\"chart_type\":\"...\"} ```）\n# 标题来源：arg2.title > 入参\
          \ title > 对象内 title > 首行 Schema: > 空\n# 输出（与 Dify 输出变量一致）：title, data（度量数值）,\
          \ type（分类；; 分隔；月份列格式化为 1月、2月…）, chart_type（来自 arg2，无则空）\n# 乱码：GBK/UTF-8\
          \ 字节被误当作 Latin-1 显示时（如 ¼Æ»®¿Æ → 计划科），输出前自动尝试修复。\n\nimport json\nimport re\n\
          \n\ndef _has_cjk(s: str) -> bool:\n    return any(\"\\u4e00\" <= c <= \"\
          \\u9fff\" for c in s)\n\n\ndef _cjk_score(s: str) -> int:\n    return sum(1\
          \ for c in s if \"\\u4e00\" <= c <= \"\\u9fff\")\n\n\ndef _fix_mojibake_string(s:\
          \ str) -> str:\n    \"\"\"\n    已是正常 UTF-8 中文则不处理，避免误伤。\n    否则尝试：latin-1\
          \ 字节按 gbk / gb18030 / utf-8 解码，取含中文最多的一种。\n    \"\"\"\n    if not s or not\
          \ isinstance(s, str):\n        return s\n    if _has_cjk(s):\n        return\
          \ s\n    best = s\n    best_score = _cjk_score(s)\n    for codec in (\"\
          gbk\", \"gb18030\"):\n        try:\n            t = s.encode(\"latin-1\"\
          ).decode(codec)\n            sc = _cjk_score(t)\n            if sc > best_score:\n\
          \                best, best_score = t, sc\n        except (UnicodeDecodeError,\
          \ UnicodeEncodeError):\n            continue\n    try:\n        t = s.encode(\"\
          latin-1\").decode(\"utf-8\")\n        sc = _cjk_score(t)\n        if sc\
          \ > best_score:\n            best = t\n    except (UnicodeDecodeError, UnicodeEncodeError):\n\
          \        pass\n    return best\n\n\ndef _empty_result(chart_type=\"\"):\n\
          \    return {\"title\": \"\", \"data\": \"\", \"type\": \"\", \"chart_type\"\
          : chart_type or \"\"}\n\n\ndef _pick_category_key_from_string_columns(string_keys:\
          \ list[str]) -> str | None:\n    \"\"\"\n    在多个字符串列中选作图分类轴的列：优先「名称/描述」类，避免「部门编号」等编码列\n\
          \    （仅当编号与名称并存时；若只有编号列则仍用编号）。\n    \"\"\"\n    if not string_keys:\n  \
          \      return None\n\n    def score(k: str) -> tuple[int, int, int]:\n \
          \       kn = k.casefold()\n        label_like = 0\n        if any(h in k\
          \ for h in (\"名称\", \"姓名\", \"描述\", \"标题\", \"简称\", \"类目\", \"标签\", \"部门名\"\
          , \"组织名\")):\n            label_like += 4\n        if any(h in k for h in\
          \ (\"组织名称\", \"班组名称\", \"仓库名称\", \"物料名称\", \"客户名称\")):\n            label_like\
          \ += 4\n        if any(sub in kn for sub in (\"name\", \"label\", \"title\"\
          , \"description\")):\n            label_like += 2\n        if any(h in k\
          \ for h in (\"类别\", \"分类\", \"类型\")) and not any(\n            x in k for\
          \ x in (\"编号\", \"编码\", \"代码\", \"代号\")\n        ):\n            label_like\
          \ += 1\n\n        id_like = 0\n        if any(h in k for h in (\"编号\", \"\
          编码\", \"代码\", \"代号\", \"工号\")):\n            id_like += 4\n        for pat\
          \ in (\n            \"_id\",\n            \"_code\",\n            \"_no\"\
          ,\n            \"deptcode\",\n            \"orgcode\",\n            \"department_id\"\
          ,\n            \"dept_id\",\n            \"org_id\",\n        ):\n     \
          \       if pat in kn:\n                id_like += 3\n        if kn.endswith(\"\
          _id\") or kn.endswith(\"_code\") or kn.endswith(\"_no\"):\n            id_like\
          \ += 2\n\n        pos = string_keys.index(k)\n        return (label_like,\
          \ -id_like, -pos)\n\n    return max(string_keys, key=score)\n\n\ndef _pick_category_key_from_numeric_columns(numeric_keys:\
          \ list[str]) -> str | None:\n    \"\"\"\n    无字符串分类列时，用数值型维度列作 X 轴（如 月份、年份）。\n\
          \    多列时按「时间粒度」优先：月/日 > 季 > 年 > 序号。\n    \"\"\"\n    if not numeric_keys:\n\
          \        return None\n    if len(numeric_keys) == 1:\n        return numeric_keys[0]\n\
          \n    def score(k: str) -> tuple[int, int]:\n        kn = k.casefold()\n\
          \        s = 0\n        if any(h in k for h in (\"月份\", \"月\")) or \"month\"\
          \ in kn:\n            s += 10\n        if any(h in k for h in (\"日期\", \"\
          时间\")) or any(x in kn for x in (\"date\", \"day\")):\n            s += 9\n\
          \        if any(h in k for h in (\"周\", \"星期\")) or \"week\" in kn:\n  \
          \          s += 7\n        if any(h in k for h in (\"季度\", \"季\")) or \"\
          quarter\" in kn:\n            s += 6\n        if any(h in k for h in (\"\
          年份\", \"年\")) or kn == \"year\" or kn.endswith(\"_year\"):\n           \
          \ s += 5\n        if any(h in k for h in (\"序号\", \"顺序\")) or kn in (\"\
          index\", \"id\") or kn.endswith(\"_id\"):\n            s += 2\n        pos\
          \ = numeric_keys.index(k)\n        return (s, -pos)\n\n    return max(numeric_keys,\
          \ key=score)\n\n\ndef _is_numeric_dimension_key(k: str) -> bool:\n    \"\
          \"\"纯维度型数值列（月份、年份等），不宜默认当作度量列。\"\"\"\n    if not k:\n        return False\n\
          \    kn = k.casefold()\n    if any(h in k for h in (\"月份\", \"年份\", \"季度\"\
          , \"周\", \"星期\", \"序号\", \"顺序\")):\n        return True\n    if any(x in\
          \ kn for x in (\"month\", \"year\", \"quarter\", \"week\", \"day\", \"date\"\
          )):\n        return True\n    if kn in (\"index\", \"id\") or kn.endswith(\"\
          _id\"):\n        return True\n    return False\n\n\ndef _is_ratio_like_key(k:\
          \ str) -> bool:\n    \"\"\"占比/百分比类字段，不应作为分类轴。\"\"\"\n    if not k:\n   \
          \     return False\n    kn = k.casefold()\n    zh_hints = (\"占比\", \"百分比\"\
          , \"比率\", \"比例\", \"环比\", \"同比\", \"增长率\")\n    en_hints = (\"ratio\", \"\
          rate\", \"percent\", \"percentage\", \"pct\")\n    if any(h in k for h in\
          \ zh_hints):\n        return True\n    if any(h in kn for h in en_hints):\n\
          \        return True\n    return False\n\n\ndef _is_month_like_key(k: str)\
          \ -> bool:\n    if not k:\n        return False\n    kn = k.casefold()\n\
          \    return (\"月份\" in k) or (\"月\" == k) or (\"month\" in kn)\n\n\ndef\
          \ _format_category_label(category_key: str, raw_val) -> str:\n    \"\"\"\
          分类轴展示：月份列输出 1月、2月 …\"\"\"\n    s0 = str(raw_val).strip() if raw_val is not\
          \ None else \"\"\n    if not s0:\n        return _fix_mojibake_string(s0)\n\
          \    kn = (category_key or \"\").casefold()\n    month_like = \"月份\" in\
          \ (category_key or \"\") or kn == \"month\" or kn.endswith(\".month\")\n\
          \    if month_like and not s0.endswith(\"月\"):\n        m = re.match(r\"\
          ^\\d{4}[-/](\\d{1,2})$\", s0)\n        if m:\n            return f\"{int(m.group(1))}月\"\
          \n        try:\n            f = float(s0)\n            if f == int(f):\n\
          \                return f\"{int(f)}月\"\n        except (ValueError, TypeError,\
          \ OverflowError):\n            pass\n    return _fix_mojibake_string(s0)\n\
          \n\ndef _is_amount_like_key(k: str) -> bool:\n    \"\"\"判断度量列是否为金额类字段。\"\
          \"\"\n    if not k:\n        return False\n    kn = k.casefold()\n    zh_hints\
          \ = (\"金额\", \"总额\", \"销售额\", \"单价\", \"价格\", \"费用\", \"成本\", \"税额\")\n\
          \    en_hints = (\"amount\", \"money\", \"price\", \"cost\", \"fee\", \"\
          revenue\", \"amt\")\n    if any(h in k for h in zh_hints):\n        return\
          \ True\n    if any(h in kn for h in en_hints):\n        return True\n  \
          \  return False\n\n\ndef _format_value_output(value_key: str, raw_val) ->\
          \ str:\n    \"\"\"金额类字段保留两位小数，其它字段保持原样输出。\"\"\"\n    if raw_val is None:\n\
          \        return \"\"\n    if _is_amount_like_key(value_key):\n        try:\n\
          \            return f\"{float(raw_val):.2f}\"\n        except (TypeError,\
          \ ValueError, OverflowError):\n            pass\n    return _fix_mojibake_string(str(raw_val))\n\
          \n\ndef _to_float_safe(raw_val):\n    \"\"\"将常见数字文本安全转为 float（支持千分位、百分号）。\"\
          \"\"\n    if raw_val is None:\n        return None\n    if isinstance(raw_val,\
          \ (int, float)):\n        try:\n            return float(raw_val)\n    \
          \    except (TypeError, ValueError, OverflowError):\n            return\
          \ None\n    s = str(raw_val).strip()\n    if not s:\n        return None\n\
          \    is_percent = s.endswith(\"%\")\n    s = s.replace(\",\", \"\").replace(\"\
          %\", \"\").strip()\n    try:\n        num = float(s)\n        return num\
          \ / 100 if is_percent else num\n    except (TypeError, ValueError, OverflowError):\n\
          \        return None\n\n\ndef _detect_value_and_category_keys(rows):\n \
          \   \"\"\"从首行推断数值列与分类列。\"\"\"\n    if not rows:\n        return None, None\n\
          \    first = rows[0]\n    if not isinstance(first, dict):\n        return\
          \ None, None\n    value_hints = (\n        \"用量\",\n        \"金额\",\n  \
          \      \"合计\",\n        \"总计\",\n        \"总额\",\n        \"销售额\",\n   \
          \     \"产量\",\n        \"次数\",\n        \"count\",\n        \"value\",\n\
          \        \"数量\",\n        \"值\",\n        \"数值\",\n        \"使用次数\",\n \
          \   )\n    numeric_keys = []\n    string_keys = []\n    for k, v in first.items():\n\
          \        if v is None:\n            continue\n        try:\n           \
          \ float(v)\n            numeric_keys.append(k)\n        except (TypeError,\
          \ ValueError):\n            if isinstance(v, str):\n                string_keys.append(k)\n\
          \    vk = next((k for k in numeric_keys if any(h in k for h in value_hints)),\
          \ None)\n    if vk is None and numeric_keys:\n        non_dim = [k for k\
          \ in numeric_keys if not _is_numeric_dimension_key(k)]\n        vk = non_dim[0]\
          \ if non_dim else numeric_keys[0]\n\n    # 优先把“月份”列作为分类轴，确保图例展示月份而非占比数值。\n\
          \    all_keys = list(first.keys())\n    month_candidates = [k for k in all_keys\
          \ if k != vk and _is_month_like_key(k)]\n    if month_candidates:\n    \
          \    return vk, month_candidates[0]\n\n    # 优先时间/序列维度（如 月份/年份/日期）作为 X 轴，避免误用“描述/名称”长文本列。\n\
          \    # 仅当不存在可用数值维度时，再回退到字符串列。\n    ck = None\n    if vk and numeric_keys:\n\
          \        numeric_dims = [k for k in numeric_keys if k != vk and _is_numeric_dimension_key(k)\
          \ and not _is_ratio_like_key(k)]\n        if not numeric_dims:\n       \
          \     numeric_dims = [k for k in numeric_keys if k != vk and not _is_ratio_like_key(k)]\n\
          \        if numeric_dims:\n            ck = _pick_category_key_from_numeric_columns(numeric_dims)\n\
          \    if ck is None and string_keys:\n        non_ratio_strings = [k for\
          \ k in string_keys if not _is_ratio_like_key(k)]\n        if non_ratio_strings:\n\
          \            return vk, _pick_category_key_from_string_columns(non_ratio_strings)\n\
          \        ck = _pick_category_key_from_string_columns(string_keys)\n    return\
          \ vk, ck\n\n\ndef _parse_schema_line(text):\n    \"\"\"若首行为 'Schema: xxx'，返回\
          \ xxx 作为可选标题，否则返回 None。\"\"\"\n    if not text or not isinstance(text, str):\n\
          \        return None\n    s = text.strip()\n    if s.startswith(\"Schema:\"\
          ):\n        first_nl = s.find(\"\\n\")\n        if first_nl != -1:\n   \
          \         return s[7:first_nl].strip() or None  # \"Schema:\".length = 7\n\
