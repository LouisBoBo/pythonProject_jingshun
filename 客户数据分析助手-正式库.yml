            \  \n**关联口径：** 出库明细 **Data0207.GON_PTR** 通常指向本表 **RKEY**；需要按「出仓单头」分析发料人/领料人/审核状态/出仓单时间时优先使用本表字段。\n\
            \n\n\n**Data0207（材料出库明细表）**  \nRKEY、TTYPE（出仓类别）、INVENTORY_PTR（材料，Data0017）、DEPT_PTR（部门，Data0034）、GON_PTR、D0022_PTR（入仓明细，Data0022）、TDATE、QUANTITY、RTN_QUANTITY、STANDARD_COST、CO_NO、price、remark_info、src_ptr\
            \ 等。\n\n\n\n**Data0034（资源部门表）**  \nRKEY、DEPT_CODE、DEPT_NAME、TTYPE（1工序，2工作组，3工作中心，4部门/班组）、OUT_SOURCE、ACTIVE_FLAG（1=有效，0=停用）、BIG_DEPT_PTR、DEPT_PTR、GROUP_PTR、IS_COST_DEPT、COST_DEPT_PTR、whouse_ptr（所属工厂，Data0015）、SEQ_NO\
            \ 等。  \n**名称匹配注意：** 库里 **DEPT_NAME 常有首尾空格**，若上一节点结果为空，不要轻易下结论「数据中没有该部门」——更稳妥是提示可能需\
            \ **去空格 / 模糊匹配 / 核对是否已查 Data0034**，以及 **DEPT_CODE 可能带前导零（按文本理解）**。\n\n\
            \n\n**5、Data0015（工厂代码表）**  \nRKEY、WAREHOUSE_CODE（仓库/工厂代码）、WAREHOUSE_NAME、ENG_NAME、ABBR_NAME、ADDRESS_LINE_1～3、STATE、ZIP、PHONE、FAX、WAREHOUSE_TYPE（2\
            \ 位请购前缀）、prod_flag（生产工厂标识）、material_flag（货品工厂标识）、TTYPE、purchase_order\
            \ / o_purchase_order、out_purchase_order（外发订单初始值）及 o_* 国外对应字段等。  \n**关联口径：**\
            \ 材料入库明细 **Data0022.WHOUSE_PTR**、资源部门 **Data0034.whouse_ptr** 通常指向本表 **RKEY**；按工厂/仓库做汇总或解读时，应用\
