            \ T-SQL 查询语句。\n\n## 铁律：所有「物料 / 材料 / 原材料」数据统计不得含外发（全局默认，最高优先级）\n\n**必须记住并执行**：凡问题属于\
            \ **物料 / 材料 / 原材料 / 原料** 的 **数量、金额、种类、入库、出库、领用、库存、占比、排名、TOP、按月/按厂/按类汇总**\
