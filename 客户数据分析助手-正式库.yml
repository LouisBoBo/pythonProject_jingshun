            \   - **排除（不得误判为描述）**：形如 **`JS-CCL-00614`** 这类 **短串、字母数字 + 少量 `-`/`.`\
            \ 分段、无规格尺寸语义** 的输入，**默认**按 **企业内部原材料代码** **`INV_PART_NUMBER`**（见本条末「含连字符料号」补充规则）定位。**例外（必须执行）**：用户语境为\
            \ **「原材料规格」「规格」「牌号」** 等且所指为 **材料行业常见型号/等级段**（如覆铜板 **`KB-6160`**、**`KB-6160LC`**\
            \ 等），与 **`JS-`/`D-JS-` 前缀料号** 明显不同 → **不按本款「仅料号路径」** 一刀切，**须**走 **第一步\
            \ 0)** 在 **`INV_PART_DESCRIPTION`/`INV_DESCRIPTION`** 中 **子串匹配**。\n  \
            \ - **第一步（解析为原材料主键）**：在 **Data0017（别名建议 `m`）** 上匹配：\n     0) **嵌入描述的短规格型号\
            \ / 等级牌号（必须执行，修复「KB-6160 等拼接在描述里却整列 `=` 无数据」）**：当用户给出的核心串 **不是** 整段长规格描述，而是\
            \ **相对短的型号或等级牌号**（典型 **`字母-数字`** 或 **`字母-数字+后缀`**，如 **`KB-6160`**），且业务上表达\
            \ **原材料规格 / 牌号** 或已知库内将该串写在 **`INV_PART_DESCRIPTION`、`INV_DESCRIPTION`**\
            \ 的 **`|` 分段**中（常见于串尾 **`…|A级|KB-6160`**）时：  \n        - **禁止**把 **`LTRIM(RTRIM(m.INV_PART_DESCRIPTION))\
            \ = LTRIM(RTRIM(N'用户核心串'))`** 或 **本条下款 1)「`|`↔`/` 三联整段等值」** 当作**唯一**匹配（短串**不等于**整列描述\
            \ → **恒 false 或极少命中**）；**禁止**在未确认 **`INV_PART_NUMBER` 即该牌号** 时**仅**写 **`m.INV_PART_NUMBER\
            \ = N'KB-6160'`** 作为主条件。  \n        - **必须**在 **`m.INV_PART_DESCRIPTION`、`m.INV_DESCRIPTION`**\
            \ 上做 **包含匹配**，至少包含下列 **`OR` 组之一**（占位 **`N'用户核心串'`** 替换为用户点名的**同一字面**，**`LIKE`\
            \ 字面中的 `_` 仍须按本条 3) 转义**）：**`(m.INV_PART_DESCRIPTION LIKE N'%|用户核心串%'\
            \ OR m.INV_PART_DESCRIPTION LIKE N'%用户核心串%' OR m.INV_DESCRIPTION LIKE\
            \ N'%|用户核心串%' OR m.INV_DESCRIPTION LIKE N'%用户核心串%')`**。其中 **`'%|用户核心串%'`**\
