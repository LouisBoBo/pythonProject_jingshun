    - data:
        code: "import json\nimport re\nfrom typing import Any, Optional\n\n# 一些常见中文莫吉巴克字符（你示例里的\
          \ Ò Ö Ä Ë Ï 等通常会包含这些）\nMOJIBAKE_MARKERS = (\n    \"Ò\",\n    \"Ó\",\n  \
          \  \"Ö\",\n    \"Ä\",\n    \"Ë\",\n    \"Ï\",\n    \"Ã\",\n    \"Â\",\n\
          \    \"â\",\n    \"ã\",\n    \"ä\",\n    \"å\",\n    \"æ\",\n    \"ç\",\n\
          \    \"è\",\n    \"é\",\n    \"ê\",\n    \"ë\",\n    \"ù\",\n    \"ú\",\n\
          \    \"û\",\n)\n\n\ndef _count_chinese(s: str) -> int:\n    return len(re.findall(r\"\
          [\\u4e00-\\u9fff]\", s))\n\n\ndef _score_text(s: str) -> int:\n    \"\"\"\
          越像正常中文文本分数越高。\"\"\"\n    if not s:\n        return -10**9\n    replacement\
          \ = s.count(\"\\ufffd\")\n    control = sum(1 for ch in s if ord(ch) < 32\
          \ and ch not in \"\\n\\r\\t\")\n    chinese = _count_chinese(s)\n    return\
          \ chinese * 100 - replacement * 1000 - control * 20\n\n\ndef _looks_like_mojibake_cn(s:\
          \ str) -> bool:\n    if not s:\n        return False\n    # 有明显莫吉巴克特征就尝试反解\n\
          \    if \"\\ufffd\" in s:\n        return True\n    return any(m in s for\
          \ m in MOJIBAKE_MARKERS)\n\n\ndef _decode_mojibake_best(s: str) -> str:\n\
          \    \"\"\"\n    反解常见“中文莫吉巴克”：\n    可能原因：原始 bytes 被错误当做 latin1/cp1252 解码成字符串。\n\
          \    做法：把当前字符串重新 encode 回 bytes，再按候选编码 decode 选最像中文的结果。\n    \"\"\"\n  \
          \  if not isinstance(s, str) or not s:\n        return s\n    if not _looks_like_mojibake_cn(s):\n\
          \        return s\n\n    best = s\n    best_score = _score_text(s)\n\n \
          \   src_encodings = [\"latin1\", \"cp1252\"]\n    dst_encodings = [\"utf-8\"\
          , \"utf-8-sig\", \"gb18030\", \"gbk\", \"utf-16le\", \"utf-16be\", \"utf-16\"\
          ]\n\n    for src in src_encodings:\n        try:\n            raw_bytes\
          \ = s.encode(src)\n        except Exception:\n            continue\n\n \
          \       for dst in dst_encodings:\n            try:\n                cand\
          \ = raw_bytes.decode(dst)\n            except Exception:\n             \
          \   continue\n            if cand.startswith(\"\\ufeff\"):\n           \
          \     cand = cand.lstrip(\"\\ufeff\")\n\n            sc = _score_text(cand)\n\
          \            if sc > best_score:\n                best_score = sc\n    \
          \            best = cand\n\n    return best\n\n\ndef _fix_obj(x: Any) ->\
          \ Any:\n    if isinstance(x, dict):\n        return {k: _fix_obj(v) for\
          \ k, v in x.items()}\n    if isinstance(x, list):\n        return [_fix_obj(v)\
          \ for v in x]\n    if isinstance(x, str):\n        return _decode_mojibake_best(x)\n\
          \    return x\n\n\ndef _extract_json_objects(text: str) -> list[str]:\n\
          \    \"\"\"\n    从一大段文本中提取形如 { ... } 的 JSON 对象片段（支持多个连续对象）。\n    \"\"\"\n\
          \    objs: list[str] = []\n    i = 0\n    n = len(text)\n    while i < n:\n\
          \        if text[i] != \"{\":\n            i += 1\n            continue\n\
          \        depth = 1\n        j = i + 1\n        in_str = False\n        esc\
          \ = False\n        while j < n and depth > 0:\n            ch = text[j]\n\
          \            if in_str:\n                if esc:\n                    esc\
          \ = False\n                elif ch == \"\\\\\":\n                    esc\
          \ = True\n                elif ch == '\"':\n                    in_str =\
          \ False\n            else:\n                if ch == '\"':\n           \
          \         in_str = True\n                elif ch == \"{\":\n           \
          \         depth += 1\n                elif ch == \"}\":\n              \
          \      depth -= 1\n            j += 1\n        if depth == 0:\n        \
          \    objs.append(text[i:j])\n            i = j\n        else:\n        \
          \    break\n    return objs\n\n\ndef main(arg1: Optional[Any] = None, **kwargs)\
          \ -> dict:\n    # 兜底取输入：Dify 常见是 arg1/text/content 或任意第一个参数\n    raw = arg1\n\
          \    if raw is None:\n        for k in (\"arg1\", \"text\", \"content\"\
          ):\n            if kwargs.get(k) is not None:\n                raw = kwargs.get(k)\n\
          \                break\n    if raw is None and kwargs:\n        raw = next(iter(kwargs.values()),\
          \ \"\")\n\n    try:\n        # 情况A：输入已是 dict/list（这类场景下无法保证原始“字符串格式”不变）\n\
          \        if isinstance(raw, (dict, list)):\n            fixed = _fix_obj(raw)\n\
          \            return {\"result\": json.dumps(fixed, ensure_ascii=False)}\n\
          \n        # 情况B：输入是“文本”（例如：Schema: dbo\\n{...}{...}）\n        # 目标：只修复 value\
          \ 字符串里的“乱码”（莫吉巴克），其它内容（包括换行/空格/对象分隔）原样保留。\n        text = \"\" if raw is\
          \ None else str(raw)\n\n        fixed_text = text\n\n        # 只替换 : 后面紧跟的双引号字符串\
          \ value\n        fixed_text = re.sub(\n            r'(:\\s*\")([^\"]*)(\"\
          )',\n            lambda m: f'{m.group(1)}{_decode_mojibake_best(m.group(2))}{m.group(3)}',\n\
          \            fixed_text,\n        )\n\n        # 只替换 : 后面紧跟的单引号字符串 value\n\
          \        fixed_text = re.sub(\n            r\"(:\\s*')([^']*)(')\",\n  \
          \          lambda m: f\"{m.group(1)}{_decode_mojibake_best(m.group(2))}{m.group(3)}\"\
          ,\n            fixed_text,\n        )\n\n        return {\"result\": fixed_text}\n\
          \n    except Exception as e:\n        return {\"result\": f\"[decode failed]\
          \ {str(e)[:500]}\"}"
        code_language: python3
