    - data:
        code: "\"\"\"\n从 Dify 传入的数据结构中提取 files 中的 url，并拼接完整地址。\n入参：arg1 为 dict，含 \"\
          files\" 数组，每项可有 \"url\" 字段。\n出参：result 为完整 url（含 base_url 前缀）。\n\"\"\"\n\
          # 修正：BASE_URL 只保留纯地址，无多余文本\nBASE_URL = \"http://120.238.80.70:15657\"\n\n\
          \ndef main(arg1=None, **kwargs):\n    raw = arg1 or kwargs.get(\"input\"\
          ) or (kwargs.get(\"arg1\") if kwargs else None)\n    if raw is None:\n \
          \       return {\"result\": \"\"}\n\n    # 支持：dict 含 \"files\" 键，或直接传入 files\
          \ 数组\n    if isinstance(raw, list):\n        files = raw\n    elif isinstance(raw,\
          \ dict):\n        files = raw.get(\"files\") or []\n    else:\n        return\
          \ {\"result\": \"\"}\n    if not isinstance(files, list):\n        return\
          \ {\"result\": \"\"}\n\n    urls = []\n    for f in files:\n        if isinstance(f,\
          \ dict) and f.get(\"url\"):\n            u = str(f[\"url\"]).strip()\n \
          \           if u and not u.startswith(\"http\"):\n                # 拼接时自动处理斜杠，避免双斜杠问题\n\
          \                u = BASE_URL.rstrip(\"/\") + \"/\" + u.lstrip(\"/\")\n\
          \            urls.append(u)\n\n    return {\"result\": urls[0] if len(urls)\
          \ == 1 else \",\".join(urls) if urls else \"\"}"
