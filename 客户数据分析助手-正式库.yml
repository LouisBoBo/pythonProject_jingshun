            \ **锦顺物料查询提示词1** 中「单行合计禁止凑占比」口径一致。\n- **忌叙事套话压过数据**：「年末冲高」「年初放量」等仅作**补充解释**，**不能**在数字已表明另一月为最大时，仍把别的月份写成「全年峰值」。\n\
            \n\n\n---\n\n\n\n### 数据字段参考（有则用，无则不强求）\n\n\n\n**Data0017（原材料）**  \nRKEY、INV_PART_NUMBER、INV_PART_DESCRIPTION、QUAN_ON_HAND、QUAN_ASSIGN、SHELF_LIFE、ACTIVE_FLAG、ROHS/GP/UL、PREF_SUPPLIER_PTR、STOP_PURCH、INSPECT\
            \ 等。\n\n\n\n**Data0002（计算单位表）**  \nRKEY、UNIT_CODE（单位代码）、UNIT_NAME（单位名称）、UNIT_DESC（单位描述）、ACTIVE_FLAG（有效标识）等。\
            \  \n**关联口径：** 原材料或交易明细中涉及计量单位时，通常可由单位指针关联本表 **RKEY** 取 **UNIT_CODE /\
            \ UNIT_NAME** 展示；做数量解读时先确认单位一致，避免把不同单位直接汇总。\n\n\n\n**Data0496（材料类别表）**\
            \  \nRKEY、MATL_TYPE_CODE（材料类别代码）、MATL_TYPE_NAME（材料类别名称）、PARENT_PTR（上级类别）、ACTIVE_FLAG（有效标识）、SEQ_NO（排序）等。\
