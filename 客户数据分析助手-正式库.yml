    - data:
        code: "\"\"\"\nDify 代码节点：将 JSON 数组字符串转换为 Markdown 表格字符串。\n\n输入变量（任一即可）：\n\
          - md_text: string（推荐）\n- arg1: string（兼容）\n\n输出变量：\n- md_text: string（Markdown\
          \ 表格）\n- row_count: string（行数）\n\"\"\"\n\nfrom __future__ import annotations\n\
          \nimport json\nfrom typing import Any, Dict, List\n\n\ndef _unwrap_markdown_fence(text:\
          \ str) -> str:\n    text = text.strip()\n    if not text.startswith(\"```\"\
          ):\n        return text\n    lines = text.split(\"\\n\")\n    if lines and\
          \ lines[0].startswith(\"```\"):\n        lines = lines[1:]\n    if lines\
          \ and lines[-1].strip() == \"```\":\n        lines = lines[:-1]\n    return\
          \ \"\\n\".join(lines).strip()\n\n\ndef _to_rows(raw: Any) -> List[Dict[str,\
          \ Any]]:\n    if raw is None:\n        return []\n    if isinstance(raw,\
          \ list):\n        return [r for r in raw if isinstance(r, dict)]\n    text\
          \ = _unwrap_markdown_fence(str(raw))\n    if not text:\n        return []\n\
          \    parsed = json.loads(text)\n    if isinstance(parsed, list):\n     \
          \   return [r for r in parsed if isinstance(r, dict)]\n    return []\n\n\
          \ndef _escape_cell(value: Any) -> str:\n    s = \"\" if value is None else\
          \ str(value)\n    return s.replace(\"|\", \"\\\\|\").replace(\"\\n\", \"\
          \ \")\n\n\ndef main(md_text: Any = None, arg1: Any = None, **kwargs: Any)\
          \ -> Dict[str, Any]:\n    raw = md_text\n    if raw is None:\n        raw\
          \ = arg1\n    if raw is None:\n        raw = kwargs.get(\"md_text\")\n \
          \   if raw is None:\n        raw = kwargs.get(\"arg1\")\n\n    rows = _to_rows(raw)\n\
          \    if not rows:\n        return {\"md_text\": \"\", \"row_count\": \"\
          0\"}\n\n    headers = list(rows[0].keys())\n    head_line = \"| \" + \"\
          \ | \".join(headers) + \" |\"\n    split_line = \"| \" + \" | \".join([\"\
          ---\"] * len(headers)) + \" |\"\n\n    body_lines = []\n    for row in rows:\n\
          \        body_lines.append(\n            \"| \" + \" | \".join(_escape_cell(row.get(col,\
          \ \"\")) for col in headers) + \" |\"\n        )\n\n    table = \"\\n\"\
          .join([head_line, split_line] + body_lines)\n    return {\"md_text\": table,\
          \ \"row_count\": str(len(rows))}\n"
