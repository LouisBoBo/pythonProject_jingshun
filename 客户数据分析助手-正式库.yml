            \ = N'整段描述'`**，通常 **0 行**，因 **`INV_PART_NUMBER` 为原材料代码**，与描述不是同一列。\n \
            \  - **识别规则（优先按描述查）**：满足以下 **任一** 时，必须先按 **描述/名称/规格** 在 **Data0017** 定位物料，再关联\
