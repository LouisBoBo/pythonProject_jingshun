    - data:
        code: "# Dify 代码节点：根据 data / title / type / chart_type 生成\n#   - echarts_option：ECharts\
          \ JSON（仅当后续有能渲染 option 的组件时使用）\n#   - chart_echarts_fence：Dify 内嵌柱图改为「横向条形\
          \ + 多色 + 极差大时 X 轴对数」；echarts_option 竖图极差大时带 dataZoom 滑块。\n#   - chart_mermaid：饼图用\
          \ pie title；柱/线用 xychart-beta 且 x 轴自动去重同名，避免 Mermaid 报 invalid。\n#   - chart_markdown\
          \ / chart_html：data: URI，多数 Dify 会拦截。\n# 在 Dify 中配置输出变量：echarts_option、chart_echarts_fence、chart_mermaid、chart_markdown、chart_html（均为\
          \ string）。\n#\n# 输入示例（上一节点或开始节点传入对象）：\n# {\n#   \"data\": \"2811902.0;249117.0;...\"\
          ,\n#   \"title\": \"入库数量排名前十的物料占比情况\",\n#   \"type\": \"全制程外发;外发锣板;...\"\
          ,\n#   \"chart_type\": \"饼状图\"\n# }\n# 展示用分类文字优先：若传入 type_name 或 category_labels（;\
          \ 分隔），优先于 type（便于部门图用名称、排序仍按编号）。\n\nfrom __future__ import annotations\n\
          \nimport base64\nimport copy\nimport html\nimport io\nimport json\nimport\
          \ math\nimport re\nfrom typing import Any\n\n\n# 高对比渐变配色（主色 → 辅色），用于系列与饼图扇区\n\
          # 横向条形图（Dify fence）类目超过此数量时启用 Y 轴滚动，避免 20 条挤在固定高度里看不清\n_BAR_CATEGORY_SCROLL_THRESHOLD\
          \ = 10\n# 初次进入时窗口内大约展示的类目条数（其余用滑块拖动查看）\n_BAR_CATEGORY_SCROLL_WINDOW = 10\n\
          \n_GRADIENT_PAIRS = [\n    (\"#5B8FF9\", \"#61DDAA\"),\n    (\"#65789B\"\
          , \"#F6BD16\"),\n    (\"#7262FD\", \"#78D3F8\"),\n    (\"#F6903D\", \"#F08BB4\"\
          ),\n    (\"#008685\", \"#5AD8A6\"),\n    (\"#945FB9\", \"#FF9845\"),\n \
          \   (\"#1D39C4\", \"#69C0FF\"),\n    (\"#D4380D\", \"#FFC069\"),\n    (\"\
          #08979C\", \"#87E8DE\"),\n    (\"#531DAB\", \"#B37FEB\"),\n    (\"#237804\"\
          , \"#95DE64\"),\n    (\"#AD2102\", \"#FFCCC7\"),\n]\n\n\ndef _parse_numbers(s:\
          \ str) -> list[float]:\n    if not s or not str(s).strip():\n        return\
          \ []\n    parts = re.split(r\"[;,\\s|]+\", str(s).strip())\n    out: list[float]\
          \ = []\n    for p in parts:\n        p = p.strip()\n        if not p:\n\
          \            continue\n        try:\n            out.append(float(p))\n\
          \        except ValueError:\n            continue\n    return out\n\n\n\
          def _parse_labels(s: str) -> list[str]:\n    if not s or not str(s).strip():\n\
          \        return []\n    return [x.strip() for x in str(s).split(\";\") if\
          \ x.strip()]\n\n\ndef _normalize_chart_type(raw: str) -> str:\n    t = (raw\
          \ or \"\").strip().lower()\n    if t in (\"饼状图\", \"饼图\", \"pie\"):\n  \
          \      return \"pie\"\n    if t in (\"柱状图\", \"条形图\", \"bar\"):\n      \
          \  return \"bar\"\n    if t in (\"线型图\", \"折线图\", \"line\"):\n        return\
          \ \"line\"\n    return \"bar\"\n\n\ndef _align_series(values: list[float],\
          \ labels: list[str]) -> tuple[list[float], list[str]]:\n    n = min(len(values),\
          \ len(labels)) if labels else len(values)\n    if not labels:\n        labels\
          \ = [f\"项{i + 1}\" for i in range(len(values))]\n        n = len(values)\n\
          \    v = values[:n]\n    l = labels[:n]\n    if len(v) < len(l):\n     \
          \   v = v + [0.0] * (len(l) - len(v))\n    elif len(l) < len(v):\n     \
          \   l = l + [f\"项{i + 1}\" for i in range(len(l), len(v))]\n    return v,\
          \ l\n\n\ndef _unique_slice_names(labels: list[str]) -> list[str]:\n    \"\
          \"\"饼图扇区与图例共用 data.name；ECharts 会合并同名图例，故重复名称依次加 #2、#3。\"\"\"\n    out:\
          \ list[str] = []\n    used: dict[str, int] = {}\n    for raw in labels:\n\
          \        base = (raw or \"\").strip() or \"项\"\n        key = base.casefold()\n\
          \        n = used.get(key, 0) + 1\n        used[key] = n\n        out.append(base\
          \ if n == 1 else f\"{base} #{n}\")\n    return out\n\n\ndef _linear_gradient(i:\
          \ int, vertical: bool = True) -> dict[str, Any]:\n    a, b = _GRADIENT_PAIRS[i\
          \ % len(_GRADIENT_PAIRS)]\n    return {\n        \"type\": \"linear\",\n\
          \        \"x\": 0,\n        \"y\": 0,\n        \"x2\": 0 if vertical else\
          \ 1,\n        \"y2\": 1 if vertical else 0,\n        \"colorStops\": [\n\
          \            {\"offset\": 0, \"color\": a},\n            {\"offset\": 1,\
          \ \"color\": b},\n        ],\n    }\n\n\ndef build_option(\n    data: str,\n\
          \    title: str,\n    type_labels: str,\n    chart_type: str,\n) -> dict[str,\
          \ Any]:\n    values = _parse_numbers(data)\n    labels = _parse_labels(type_labels)\n\
          \    values, labels = _align_series(values, labels)\n    ctype = _normalize_chart_type(chart_type)\n\
          \    chart_title = (title or \"\").strip() or \"图表\"\n\n    base_title =\
          \ {\n        \"text\": chart_title,\n        \"left\": \"center\",\n   \
          \     \"top\": 12,\n        \"textStyle\": {\n            \"fontSize\":\
          \ 18,\n            \"fontWeight\": 600,\n            \"color\": \"#1a1a2e\"\
          ,\n        },\n        \"subtextStyle\": {\"color\": \"#6b7280\", \"fontSize\"\
          : 12},\n    }\n\n    tooltip_common = {\n        \"trigger\": \"item\" if\
          \ ctype == \"pie\" else \"axis\",\n        \"backgroundColor\": \"rgba(255,255,255,0.92)\"\
          ,\n        \"borderColor\": \"#e5e7eb\",\n        \"borderWidth\": 1,\n\
          \        \"textStyle\": {\"color\": \"#111827\"},\n        \"axisPointer\"\
          : {\"type\": \"shadow\" if ctype == \"bar\" else \"line\"},\n    }\n\n \
          \   if ctype == \"pie\":\n        pie_names = _unique_slice_names(labels)\n\
          \        pie_data = [\n            {\n                \"name\": pie_names[i],\n\
          \                \"value\": values[i],\n                \"itemStyle\": {\n\
          \                    \"color\": _linear_gradient(i, vertical=False),\n \
          \                   \"borderRadius\": 8,\n                    \"borderColor\"\
          : \"#fff\",\n                    \"borderWidth\": 2,\n                 \
          \   \"shadowBlur\": 12,\n                    \"shadowColor\": \"rgba(26,26,46,0.15)\"\
          ,\n                },\n            }\n            for i in range(len(values))\n\
          \        ]\n        return {\n            \"backgroundColor\": \"transparent\"\
          ,\n            \"color\": [p[0] for p in _GRADIENT_PAIRS],\n           \
          \ \"title\": base_title,\n            \"tooltip\": {\n                **tooltip_common,\n\
          \                \"formatter\": \"{b}<br/>数值：{c} ({d}%)\",\n           \
          \ },\n            \"legend\": {\n                \"type\": \"scroll\",\n\
          \                \"orient\": \"vertical\",\n                \"right\": \"\
          4%\",\n                \"top\": \"middle\",\n                \"textStyle\"\
          : {\"color\": \"#4b5563\", \"fontSize\": 11},\n                \"pageIconColor\"\
          : \"#5B8FF9\",\n            },\n            \"series\": [\n            \
          \    {\n                    \"name\": chart_title,\n                   \
          \ \"type\": \"pie\",\n                    \"radius\": [\"42%\", \"68%\"\
          ],\n                    \"center\": [\"40%\", \"55%\"],\n              \
          \      \"roseType\": \"area\",\n                    \"avoidLabelOverlap\"\
          : True,\n                    \"itemStyle\": {\"borderRadius\": 8},\n   \
          \                 \"label\": {\n                        \"show\": True,\n\
          \                        \"formatter\": \"{b}\\n{d}%\",\n              \
          \          \"color\": \"#374151\",\n                        \"fontSize\"\
          : 11,\n                        \"lineHeight\": 16,\n                   \
          \ },\n                    \"labelLine\": {\n                        \"length\"\
          : 14,\n                        \"length2\": 10,\n                      \
          \  \"smooth\": True,\n                    },\n                    \"emphasis\"\
          : {\n                        \"scale\": True,\n                        \"\
          scaleSize\": 6,\n                        \"itemStyle\": {\n            \
          \                \"shadowBlur\": 24,\n                            \"shadowColor\"\
          : \"rgba(91,143,249,0.45)\",\n                        },\n             \
          \           \"label\": {\"fontSize\": 12, \"fontWeight\": \"bold\"},\n \
          \                   },\n                    \"animationType\": \"scale\"\
          ,\n                    \"animationEasing\": \"elasticOut\",\n          \
          \          \"data\": pie_data,\n                }\n            ],\n    \
          \    }\n\n    # 柱状图 / 折线图共用类目轴\n    x_axis = {\n        \"type\": \"category\"\
          ,\n        \"data\": labels,\n        \"axisLine\": {\"lineStyle\": {\"\
          color\": \"#e5e7eb\"}},\n        \"axisTick\": {\"show\": False},\n    \
          \    \"axisLabel\": {\n            \"color\": \"#6b7280\",\n           \
          \ \"fontSize\": 11,\n            \"interval\": 0,\n            \"rotate\"\
          : 32 if len(labels) > 5 else 0,\n            \"hideOverlap\": True,\n  \
          \          \"width\": 72,\n            \"overflow\": \"truncate\",\n   \
          \     },\n    }\n    y_axis = {\n        \"type\": \"value\",\n        \"\
          splitLine\": {\"lineStyle\": {\"type\": \"dashed\", \"color\": \"#f0f0f0\"\
          }},\n        \"axisLabel\": {\"color\": \"#9ca3af\", \"margin\": 14},\n\
          \    }\n\n    if ctype == \"bar\":\n        series = [\n            {\n\
          \                \"name\": \"数值\",\n                \"type\": \"bar\",\n\
          \                \"data\": [\n                    {\n                  \
          \      \"value\": values[i],\n                        \"itemStyle\": {\n\
          \                            \"color\": _linear_gradient(i),\n         \
          \                   \"borderRadius\": [6, 6, 0, 0],\n                  \
          \          \"shadowBlur\": 8,\n                            \"shadowColor\"\
          : \"rgba(91,143,249,0.25)\",\n                        },\n             \
          \       }\n                    for i in range(len(values))\n           \
          \     ],\n                \"barWidth\": \"52%\",\n                \"emphasis\"\
          : {\n                    \"focus\": \"series\",\n                    \"\
          itemStyle\": {\"shadowBlur\": 16, \"shadowColor\": \"rgba(91,143,249,0.45)\"\
          },\n                },\n                \"animationEasing\": \"elasticOut\"\
          ,\n            }\n        ]\n        grid_bar = {\"left\": 88, \"right\"\
          : \"4%\", \"bottom\": 100, \"top\": 88, \"containLabel\": True}\n      \
          \  out_bar: dict[str, Any] = {\n            \"backgroundColor\": \"transparent\"\
          ,\n            \"title\": base_title,\n            \"tooltip\": {**tooltip_common,\
          \ \"axisPointer\": {\"type\": \"shadow\"}},\n            \"grid\": grid_bar,\n\
          \            \"xAxis\": x_axis,\n            \"yAxis\": y_axis,\n      \
          \      \"series\": series,\n        }\n        pos_v = [v for v in values\
          \ if v > 0]\n        if len(pos_v) >= 2:\n            ratio = max(values)\
          \ / min(pos_v)\n            if ratio > 18:\n                out_bar[\"dataZoom\"\
          ] = [\n                    {\"type\": \"inside\", \"xAxisIndex\": 0, \"\
          filterMode\": \"none\"},\n                    {\"type\": \"slider\", \"\
          xAxisIndex\": 0, \"height\": 22, \"bottom\": 36},\n                ]\n \
          \               gb = dict(out_bar[\"grid\"])\n                gb[\"bottom\"\
          ] = 128\n                out_bar[\"grid\"] = gb\n        return out_bar\n\
          \n    # line\n    line_gradient = {\n        \"type\": \"linear\",\n   \
          \     \"x\": 0,\n        \"y\": 0,\n        \"x2\": 0,\n        \"y2\":\
          \ 1,\n        \"colorStops\": [\n            {\"offset\": 0, \"color\":\
          \ \"rgba(91,143,249,0.35)\"},\n            {\"offset\": 1, \"color\": \"\
          rgba(91,143,249,0.02)\"},\n        ],\n    }\n    return {\n        \"backgroundColor\"\
          : \"transparent\",\n        \"title\": base_title,\n        \"tooltip\"\
          : {**tooltip_common},\n        \"grid\": {\"left\": 88, \"right\": \"4%\"\
          , \"bottom\": 100, \"top\": 88, \"containLabel\": True},\n        \"xAxis\"\
          : x_axis,\n        \"yAxis\": y_axis,\n        \"series\": [\n         \
          \   {\n                \"name\": \"数值\",\n                \"type\": \"line\"\
          ,\n                \"smooth\": True,\n                \"symbol\": \"circle\"\
          ,\n                \"symbolSize\": 8,\n                \"showSymbol\": True,\n\
          \                \"lineStyle\": {\"width\": 3, \"color\": \"#5B8FF9\", \"\
          shadowBlur\": 8, \"shadowColor\": \"rgba(91,143,249,0.4)\"},\n         \
          \       \"itemStyle\": {\n                    \"color\": \"#5B8FF9\",\n\
          \                    \"borderColor\": \"#fff\",\n                    \"\
          borderWidth\": 2,\n                    \"shadowBlur\": 6,\n            \
          \        \"shadowColor\": \"rgba(91,143,249,0.35)\",\n                },\n\
          \                \"areaStyle\": {\"color\": line_gradient},\n          \
          \      \"emphasis\": {\"focus\": \"series\", \"scale\": True},\n       \
          \         \"data\": values,\n                \"animationEasing\": \"cubicOut\"\
          ,\n            }\n        ],\n    }\n\n\ndef _mpl_series_colors(n: int)\
          \ -> list[str]:\n    return [_GRADIENT_PAIRS[i % len(_GRADIENT_PAIRS)][0]\
          \ for i in range(n)]\n\n\ndef _svg_text(s: str) -> str:\n    return html.escape(s,\
          \ quote=True)\n\n\ndef _label_short(s: str, max_len: int = 10) -> str:\n\
          \    s = s.strip()\n    if len(s) <= max_len:\n        return s\n    return\
          \ s[: max_len - 1] + \"…\"\n\n\ndef _build_svg_chart(values: list[float],\
          \ labels: list[str], chart_title: str, ctype: str) -> str:\n    \"\"\"纯标准库生成\
          \ SVG（无 matplotlib 时回退）。ctype: pie | bar | line\"\"\"\n    w, h = 920, 560\n\
          \    bg = \"#f8f9fc\"\n    parts: list[str] = [\n        f'<svg xmlns=\"\
          http://www.w3.org/2000/svg\" width=\"{w}\" height=\"{h}\" viewBox=\"0 0\
          \ {w} {h}\">',\n        f'<rect width=\"100%\" height=\"100%\" fill=\"{bg}\"\
          />',\n    ]\n    defs: list[str] = [\"<defs>\"]\n    for i in range(len(values)):\n\
          \        a, b = _GRADIENT_PAIRS[i % len(_GRADIENT_PAIRS)]\n        defs.append(\n\
          \            f'<linearGradient id=\"g{i}\" x1=\"0%\" y1=\"0%\" x2=\"0%\"\
          \ y2=\"100%\">'\n            f'<stop offset=\"0%\" stop-color=\"{a}\"/><stop\
          \ offset=\"100%\" stop-color=\"{b}\"/></linearGradient>'\n        )\n  \
          \  defs.append(\"</defs>\")\n    parts.extend(defs)\n\n    title_esc = _svg_text(chart_title)\n\
          \    parts.append(\n        f'<text x=\"{w // 2}\" y=\"40\" text-anchor=\"\
          middle\" font-size=\"18\" font-weight=\"600\" '\n        f'fill=\"#1a1a2e\"\
          \ font-family=\"system-ui,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif\"\
          >'\n        f\"{title_esc}</text>\"\n    )\n\n    if ctype == \"pie\":\n\
          \        total = sum(values) or 1.0\n        cx, cy, r = 340, 290, 130\n\
          \        start = -math.pi / 2\n        legend_x, ly = 620, 120\n       \
          \ for i, v in enumerate(values):\n            sweep = 2 * math.pi * (v /\
          \ total)\n            end = start + sweep\n            x0 = cx + r * math.cos(start)\n\
          \            y0 = cy + r * math.sin(start)\n            x1 = cx + r * math.cos(end)\n\
          \            y1 = cy + r * math.sin(end)\n            large = 1 if sweep\
          \ > math.pi else 0\n            parts.append(\n                f'<path d=\"\
          M {cx} {cy} L {x0:.2f} {y0:.2f} A {r} {r} 0 {large} 1 {x1:.2f} {y1:.2f}\
          \ Z\" '\n                f'fill=\"url(#g{i})\" stroke=\"#fff\" stroke-width=\"\
          2\"/>'\n            )\n            pct = 100.0 * v / total\n           \
          \ if pct >= 3:\n                mid = start + sweep / 2\n              \
          \  tx = cx + (r * 0.62) * math.cos(mid)\n                ty = cy + (r *\
          \ 0.62) * math.sin(mid)\n                parts.append(\n               \
          \     f'<text x=\"{tx:.1f}\" y=\"{ty:.1f}\" text-anchor=\"middle\" dominant-baseline=\"\
          middle\" '\n                    f'font-size=\"11\" fill=\"#fff\" font-weight=\"\
          600\" font-family=\"system-ui,sans-serif\">'\n                    f\"{pct:.1f}%</text>\"\
          \n                )\n            start = end\n            parts.append(\n\
          \                f'<rect x=\"{legend_x}\" y=\"{ly}\" width=\"12\" height=\"\
          12\" rx=\"2\" fill=\"url(#g{i})\"/>'\n                f'<text x=\"{legend_x\
          \ + 20}\" y=\"{ly + 10}\" font-size=\"11\" fill=\"#374151\" '\n        \
          \        f'font-family=\"system-ui,PingFang SC,Microsoft YaHei,sans-serif\"\
          >{_svg_text(_label_short(labels[i], 14))}</text>'\n            )\n     \
          \       ly += 22\n    else:\n        plot_l, plot_r, plot_t, plot_b = 72,\
          \ w - 48, 88, h - 110\n        inner_w = plot_r - plot_l\n        inner_h\
          \ = plot_b - plot_t\n        maxv = max(values) if values else 1.0\n   \
          \     if maxv <= 0:\n            maxv = 1.0\n        n = len(values)\n\n\
          \        for gy in range(5):\n            yy = plot_t + inner_h * gy / 4\n\
          \            parts.append(\n                f'<line x1=\"{plot_l}\" y1=\"\
          {yy:.1f}\" x2=\"{plot_r}\" y1=\"{yy:.1f}\" '\n                f'stroke=\"\
          #e5e7eb\" stroke-dasharray=\"4 4\"/>'\n            )\n\n        if ctype\
          \ == \"bar\":\n            slot = inner_w / n if n else inner_w\n      \
          \      bw = slot * 0.58\n            for i, v in enumerate(values):\n  \
          \              x = plot_l + i * slot + (slot - bw) / 2\n               \
          \ bh = (v / maxv) * inner_h\n                y = plot_b - bh\n         \
          \       parts.append(\n                    f'<rect x=\"{x:.1f}\" y=\"{y:.1f}\"\
          \ width=\"{bw:.1f}\" height=\"{max(bh, 0.5):.1f}\" '\n                 \
          \   f'rx=\"6\" fill=\"url(#g{i})\" stroke=\"#fff\" stroke-width=\"1\"/>'\n\
          \                )\n                lab = _svg_text(_label_short(labels[i]))\n\
          \                cx = x + bw / 2\n                parts.append(\n      \
          \              f'<text x=\"{cx:.1f}\" y=\"{plot_b + 18}\" text-anchor=\"\
          end\" font-size=\"10\" fill=\"#6b7280\" '\n                    f'font-family=\"\
          system-ui,PingFang SC,Microsoft YaHei,sans-serif\" '\n                 \
          \   f'transform=\"rotate(-32 {cx:.1f} {plot_b + 18})\">{lab}</text>'\n \
          \               )\n        else:\n            if n == 1:\n             \
          \   xs = [plot_l + inner_w / 2]\n            else:\n                xs =\
          \ [plot_l + inner_w * j / (n - 1) for j in range(n)]\n            pts =\
          \ []\n            area = [f\"{plot_l},{plot_b}\"]\n            for j, v\
          \ in enumerate(values):\n                px = xs[j]\n                py\
          \ = plot_b - (v / maxv) * inner_h\n                pts.append(f\"{px:.1f},{py:.1f}\"\
          )\n                area.append(f\"{px:.1f},{py:.1f}\")\n            area.append(f\"\
          {xs[-1]:.1f},{plot_b}\")\n            parts.append(\n                f'<polygon\
          \ points=\"{\" \".join(area)}\" fill=\"#5B8FF9\" fill-opacity=\"0.18\" stroke=\"\
          none\"/>'\n            )\n            parts.append(\n                f'<polyline\
          \ points=\"{\" \".join(pts)}\" fill=\"none\" stroke=\"#5B8FF9\" stroke-width=\"\
          3\" '\n                f'stroke-linejoin=\"round\" stroke-linecap=\"round\"\
          />'\n            )\n            for j, v in enumerate(values):\n       \
          \         px, py = float(pts[j].split(\",\")[0]), float(pts[j].split(\"\
          ,\")[1])\n                parts.append(\n                    f'<circle cx=\"\
          {px}\" cy=\"{py}\" r=\"6\" fill=\"#fff\" stroke=\"#5B8FF9\" stroke-width=\"\
          2\"/>'\n                )\n                lab = _svg_text(_label_short(labels[j]))\n\
          \                parts.append(\n                    f'<text x=\"{px}\" y=\"\
          {plot_b + 18}\" text-anchor=\"end\" font-size=\"10\" fill=\"#6b7280\" '\n\
          \                    f'font-family=\"system-ui,PingFang SC,Microsoft YaHei,sans-serif\"\
          \ '\n                    f'transform=\"rotate(-32 {px} {plot_b + 18})\"\
          >{lab}</text>'\n                )\n\n    parts.append(\"</svg>\")\n    return\
          \ \"\".join(parts)\n\n\ndef _chart_mime_and_base64(\n    values: list[float],\n\
          \    labels: list[str],\n    chart_title: str,\n    ctype: str,\n) -> tuple[str,\
          \ str]:\n    \"\"\"返回 (mime, base64_raw)。优先 PNG，失败则 SVG。\"\"\"\n    try:\n\
          \        import matplotlib\n\n        matplotlib.use(\"Agg\")\n        import\
          \ matplotlib.pyplot as plt\n\n        plt.rcParams.update(\n           \
          \ {\n                \"font.sans-serif\": [\n                    \"PingFang\
          \ SC\",\n                    \"Microsoft YaHei\",\n                    \"\
          SimHei\",\n                    \"Noto Sans CJK SC\",\n                 \
          \   \"Arial Unicode MS\",\n                    \"DejaVu Sans\",\n      \
          \          ],\n                \"axes.unicode_minus\": False,\n        \
          \    }\n        )\n\n        fig, ax = plt.subplots(figsize=(11, 6.5), dpi=120)\n\
          \        fig.patch.set_facecolor(\"#f8f9fc\")\n        ax.set_facecolor(\"\
          #f8f9fc\")\n        colors = _mpl_series_colors(len(values))\n\n       \
          \ if ctype == \"pie\":\n            explode = [0.02] * len(values)\n   \
          \         ax.pie(\n                values,\n                labels=labels,\n\
          \                colors=colors,\n                autopct=lambda p: f\"{p:.1f}%\"\
          \ if p > 3 else \"\",\n                explode=explode,\n              \
          \  wedgeprops={\"edgecolor\": \"white\", \"linewidth\": 2},\n          \
          \      textprops={\"fontsize\": 9},\n            )\n            ax.set_title(chart_title,\
          \ fontsize=16, fontweight=\"bold\", pad=16, color=\"#1a1a2e\")\n       \
          \ elif ctype == \"bar\":\n            x = range(len(values))\n         \
          \   ax.bar(x, values, color=colors, edgecolor=\"white\", linewidth=1.2)\n\
          \            ax.set_xticks(list(x))\n            ax.set_xticklabels(labels,\
          \ rotation=35, ha=\"right\", fontsize=9)\n            ax.set_title(chart_title,\
          \ fontsize=16, fontweight=\"bold\", pad=12, color=\"#1a1a2e\")\n       \
          \     ax.yaxis.grid(True, linestyle=\"--\", alpha=0.35)\n            ax.set_axisbelow(True)\n\
          \            ax.spines[\"top\"].set_visible(False)\n            ax.spines[\"\
          right\"].set_visible(False)\n        else:\n            x = range(len(values))\n\
          \            ax.plot(\n                list(x),\n                values,\n\
          \                color=\"#5B8FF9\",\n                linewidth=2.8,\n  \
          \              marker=\"o\",\n                markersize=7,\n          \
          \      markerfacecolor=\"#fff\",\n                markeredgewidth=2,\n \
          \               markeredgecolor=\"#5B8FF9\",\n            )\n          \
          \  ax.fill_between(list(x), values, alpha=0.22, color=\"#5B8FF9\")\n   \
          \         ax.set_xticks(list(x))\n            ax.set_xticklabels(labels,\
          \ rotation=35, ha=\"right\", fontsize=9)\n            ax.set_title(chart_title,\
          \ fontsize=16, fontweight=\"bold\", pad=12, color=\"#1a1a2e\")\n       \
          \     ax.yaxis.grid(True, linestyle=\"--\", alpha=0.35)\n            ax.spines[\"\
          top\"].set_visible(False)\n            ax.spines[\"right\"].set_visible(False)\n\
          \n        plt.tight_layout()\n        buf = io.BytesIO()\n        fig.savefig(buf,\
          \ format=\"png\", bbox_inches=\"tight\", facecolor=fig.get_facecolor(),\
          \ edgecolor=\"none\")\n        plt.close(fig)\n        raw = base64.standard_b64encode(buf.getvalue()).decode(\"\
          ascii\")\n        return \"image/png\", raw\n    except Exception:\n   \
          \     svg = _build_svg_chart(values, labels, chart_title, ctype)\n     \
          \   raw = base64.standard_b64encode(svg.encode(\"utf-8\")).decode(\"ascii\"\
          )\n        return \"image/svg+xml\", raw\n\n\ndef build_chart_markdown(\n\
          \    data: str,\n    title: str,\n    type_labels: str,\n    chart_type:\
          \ str,\n) -> str:\n    \"\"\"\n    Markdown 图片行：使用 ![](data:...) 紧凑写法，避免\
          \ `!` 与 `[` 之间被误加空格导致无法识别。\n    直接回复里请只输出本变量，不要在前面再写 `!` 或 `![`。\n    \"\
          \"\"\n    values = _parse_numbers(data)\n    labels = _parse_labels(type_labels)\n\
          \    values, labels = _align_series(values, labels)\n    ctype = _normalize_chart_type(chart_type)\n\
          \    chart_title = (title or \"\").strip() or \"图表\"\n\n    if not values:\n\
          \        return \"\"\n\n    mime, raw = _chart_mime_and_base64(values, labels,\
          \ chart_title, ctype)\n    return f\"![](data:{mime};base64,{raw})\"\n\n\
          \ndef build_chart_html(\n    data: str,\n    title: str,\n    type_labels:\
          \ str,\n    chart_type: str,\n) -> str:\n    \"\"\"\n    HTML <img data:...>，部分\
          \ Dify / Web 对 Markdown 图片限制较严时，可在「直接回复」里优先尝试本字段（需允许 HTML）。\n    \"\"\"\n\
          \    values = _parse_numbers(data)\n    labels = _parse_labels(type_labels)\n\
          \    values, labels = _align_series(values, labels)\n    ctype = _normalize_chart_type(chart_type)\n\
          \    chart_title = (title or \"\").strip() or \"图表\"\n\n    if not values:\n\
          \        return \"\"\n\n    mime, raw = _chart_mime_and_base64(values, labels,\
          \ chart_title, ctype)\n    alt = html.escape(chart_title, quote=True)\n\
          \    return (\n        f'<img src=\"data:{mime};base64,{raw}\" alt=\"{alt}\"\
          \ '\n        'style=\"max-width:100%;height:auto;display:block;margin:12px\
          \ 0;\" />'\n    )\n\n\ndef _dify_bar_horizontal_layout(o: dict[str, Any])\
          \ -> None:\n    \"\"\"\n    将「竖向类目柱图」改为「横向条形图」：长类目在左侧易读；数值用对数轴拉开量级。\n  \
          \  \"\"\"\n    series_list = o.get(\"series\") or []\n    if not series_list:\n\
          \        return\n    s0 = series_list[0]\n    if s0.get(\"type\") != \"\
          bar\":\n        return\n    xa = o.get(\"xAxis\")\n    if not isinstance(xa,\
          \ dict) or xa.get(\"type\") != \"category\":\n        return\n    cats:\
          \ list[str] = [str(x) for x in (xa.get(\"data\") or [])]\n    raw = s0.get(\"\
          data\") or []\n    vals: list[float] = []\n    if raw and isinstance(raw[0],\
          \ dict):\n        for d in raw:\n            if isinstance(d, dict) and\
          \ \"value\" in d:\n                vals.append(float(d[\"value\"]))\n  \
          \  elif raw and isinstance(raw[0], (int, float)):\n        vals = [float(x)\
          \ for x in raw]\n    else:\n        return\n    if not vals or len(vals)\
          \ != len(cats):\n        return\n\n    pos = [v for v in vals if v > 0]\n\
          \    mx = max(vals) if vals else 1.0\n    mn = min(pos) if pos else 1.0\n\
          \    use_log = mn > 0 and mx / mn > 12\n\n    n = len(vals)\n    o[\"color\"\
          ] = [_GRADIENT_PAIRS[i % len(_GRADIENT_PAIRS)][0] for i in range(n)]\n \
          \   s0[\"data\"] = vals\n    s0[\"colorBy\"] = \"data\"\n    s0.pop(\"emphasis\"\
          , None)\n    # 条厚用「类目带宽的百分比」，避免固定像素 × 条数超过画布高度导致 Dify/ECharts 报错\n    s0[\"\
          barWidth\"] = \"72%\"\n    s0[\"barCategoryGap\"] = \"22%\"\n    s0.pop(\"\
          barMaxWidth\", None)\n    s0[\"itemStyle\"] = {\n        \"borderRadius\"\
          : [0, 12, 12, 0],\n        \"shadowBlur\": 10,\n        \"shadowColor\"\
          : \"rgba(91,143,249,0.2)\",\n    }\n    s0[\"showBackground\"] = True\n\
          \    s0[\"backgroundStyle\"] = {\"color\": \"rgba(148,163,184,0.14)\", \"\
          borderRadius\": [0, 12, 12, 0]}\n    s0[\"label\"] = {\n        \"show\"\
          : True,\n        \"position\": \"right\",\n        \"distance\": 8,\n  \
          \      \"fontSize\": 10,\n        \"color\": \"#64748b\",\n        \"formatter\"\
          : \"{c}\",\n    }\n\n    if use_log:\n        # 不用字符串 \"dataMin\"：部分内嵌 ECharts\
          \ 在对数轴上对非数字 min 会异常\n        log_min = max(1e-6, mn * 0.75) if mn > 0 else\
          \ 1e-6\n        o[\"xAxis\"] = {\n            \"type\": \"log\",\n     \
          \       \"logBase\": 10,\n            \"min\": log_min,\n            \"\
          axisLine\": {\"lineStyle\": {\"color\": \"#cbd5e1\"}},\n            \"splitLine\"\
          : {\"lineStyle\": {\"type\": \"dashed\", \"color\": \"#e2e8f0\"}},\n   \
          \         \"axisLabel\": {\"color\": \"#64748b\", \"fontSize\": 10, \"margin\"\
          : 8},\n        }\n    else:\n        o[\"xAxis\"] = {\n            \"type\"\
          : \"value\",\n            \"splitLine\": {\"lineStyle\": {\"type\": \"dashed\"\
          , \"color\": \"#e2e8f0\"}},\n            \"axisLabel\": {\"color\": \"#64748b\"\
          , \"fontSize\": 10},\n        }\n\n    o[\"yAxis\"] = {\n        \"type\"\
          : \"category\",\n        \"data\": cats,\n        \"inverse\": True,\n \
          \       \"axisTick\": {\"show\": False},\n        \"axisLine\": {\"show\"\
          : False},\n        \"splitLine\": {\"show\": False},\n        \"axisLabel\"\
          : {\n            \"color\": \"#334155\",\n            \"fontSize\": 11,\n\
          \            \"align\": \"right\",\n            \"width\": 220,\n      \
          \      \"overflow\": \"truncate\",\n            \"interval\": 0,\n     \
          \   },\n    }\n    tt = o.get(\"tooltip\")\n    if isinstance(tt, dict):\n\
          \        o[\"tooltip\"] = {**tt, \"trigger\": \"axis\", \"axisPointer\"\
          : {\"type\": \"shadow\"}}\n    # 横向条图：压缩标题区与 X 轴下方留白，把垂直空间留给绘图区（原 grid top/bottom\
          \ 偏大）\n    tit = o.get(\"title\")\n    if isinstance(tit, dict):\n     \
          \   o[\"title\"] = {\n            **tit,\n            \"top\": 8,\n    \
          \        \"padding\": [2, 0, 4, 0],\n            \"itemGap\": 4,\n     \
          \   }\n    xa_bottom = o.get(\"xAxis\")\n    if isinstance(xa_bottom, dict):\n\
          \        al = xa_bottom.get(\"axisLabel\") or {}\n        xa_bottom[\"axisLabel\"\
          ] = {**al, \"margin\": 6}\n        o[\"xAxis\"] = xa_bottom\n\n    # 类目多时在\
          \ Y 轴（类目轴）上缩放/滑动，固定高度下也能看完 20 条及以上。\n    # maxSpan 与初始 end-start 一致：防止内嵌\
          \ ECharts 把滑块拉满 100% 导致 N 条仍挤在一屏。\n    # 条数越多 win_pct 越小，可视条数上限约 _BAR_CATEGORY_SCROLL_WINDOW，不会「越多越挤」。\n\
          \    if n > _BAR_CATEGORY_SCROLL_THRESHOLD:\n        win = min(_BAR_CATEGORY_SCROLL_WINDOW,\
          \ n)\n        win_pct = min(100.0, 100.0 * win / n)\n        o[\"dataZoom\"\
          ] = [\n            {\n                \"type\": \"inside\",\n          \
          \      \"yAxisIndex\": 0,\n                \"filterMode\": \"filter\",\n\
          \                \"maxSpan\": win_pct,\n            },\n            {\n\
          \                \"type\": \"slider\",\n                \"yAxisIndex\":\
          \ 0,\n                \"filterMode\": \"filter\",\n                \"orient\"\
          : \"vertical\",\n                \"right\": 6,\n                \"width\"\
          : 20,\n                \"start\": 0,\n                \"end\": win_pct,\n\
          \                \"maxSpan\": win_pct,\n                \"showDetail\":\
          \ False,\n            },\n        ]\n        o[\"grid\"] = {\"left\": 4,\
          \ \"right\": \"24%\", \"top\": 50, \"bottom\": 28, \"containLabel\": True}\n\
          \    else:\n        o.pop(\"dataZoom\", None)\n        o[\"grid\"] = {\"\
          left\": 4, \"right\": \"18%\", \"top\": 50, \"bottom\": 28, \"containLabel\"\
          : True}\n    o[\"backgroundColor\"] = \"#f8fafc\"\n\n\ndef _option_for_dify_fence(option:\
          \ dict[str, Any]) -> dict[str, Any]:\n    \"\"\"\n    Dify 对话里 ```echarts```：柱图改为横向条形\
